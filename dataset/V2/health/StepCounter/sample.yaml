version: "2.0"
dataset_version: "v2"
sample_id: StepCounter
title: 计步器
app_type: 健康
data_mode: "frontend_mock"

requirement: |
  实现一个功能完整的计步追踪应用，使用模拟数据展示计步功能，覆盖今日步数、目标管理、历史记录、统计图表、运动参数设置与成就系统的完整闭环。

  【数据说明】
  1. 步数为应用内模拟生成（定时器每秒随机增加1-3步），非真实传感器数据
  2. 内置过去7天的模拟历史数据（递增趋势：5000/6200/7100/8000/7500/8500/9000步）
  3. 内置24小时步数分布模拟数据（工作时段步数多，夜间步数少）
  4. 所有数据本地持久化（目标、步长、体重、历史记录、成就状态）

  【导航结构】
  5. 底部为4个Tab：首页（今日步数）、统计、历史、我的（设置/成就）
  6. 各Tab切换保持各自状态

  【首页Tab-今日步数】
  7. 大圆环进度条：显示今日步数/目标步数的完成比例，圆环填充动画
  8. 数字显示区：今日步数（大字）、距离(km)、消耗卡路里(kcal)
  9. 距离计算公式：步数 × 步长(默认0.7m) ÷ 1000 = km
  10. 卡路里计算公式：步数 × 0.04 = kcal（体重>80kg时系数为0.05）
  11. "开始计步"按钮：点击后启动模拟计步（每秒随机增加1-3步）
  12. "停止计步"按钮：停止模拟
  13. 目标设置入口：点击可快速修改每日目标（默认8000步）
  14. 达标提示：今日步数达到目标时显示达标状态或祝贺提示

  【统计Tab-详细统计】
  15. 今日24小时柱状图：每小时步数分布（应用内置模拟数据：工作时段步数多，夜间步数少）
  16. 内置示例数据：0-6点每小时0-50步，7-9点每小时200-500步，10-18点每小时100-300步，19-22点每小时50-200步，23点后0-50步
  17. 本周概览：本周累计步数、日均步数、达标天数（基于历史数据统计）
  18. 周/月统计切换：可切换查看周维度与月维度的步数汇总

  【历史Tab-历史记录】
  19. 近7天每日步数列表：日期+步数+是否达标图标
  20. 7天步数折线图
  21. 内置过去7天的模拟历史数据（递增趋势：5000/6200/7100/8000/7500/8500/9000步）
  22. 历史列表始终展示内置的近7天步数数据（应用预置，非空态）

  【我的Tab-设置与成就】
  23. 每日目标步数：输入框，默认8000步
  24. 步长设置：输入框，默认70cm
  25. 体重设置：输入框，默认65kg（影响卡路里系数：体重>80kg时系数为0.05）
  26. 参数修改后保存，首页距离/卡路里/圆环按新参数联动更新
  27. 成就系统：展示成就徽章列表（如首次达标、连续达标3天、累计1万步、累计5万步等），已解锁与未解锁状态区分
  28. 成就达成时点亮对应徽章
  29. 个人信息区：展示累计步数、累计运动天数等汇总

pages:
  - name: "首页Tab-今日步数"
    description: "大圆环进度显示今日步数/目标、距离、卡路里，开始/停止计步、目标入口、达标提示"
    features:
      - "大圆环进度条：步数/目标比例填充动画"
      - "今日步数大字显示"
      - "距离(km)和卡路里(kcal)实时计算"
      - "开始/停止模拟计步按钮"
      - "目标设置入口"
      - "达标状态提示"

  - name: "统计Tab-详细统计"
    description: "今日24小时步数分布柱状图与周/月概览"
    features:
      - "24小时步数柱状图"
      - "内置模拟数据（工作时段步数多，夜间步数少）"
      - "本周累计/日均/达标天数概览"
      - "周/月维度统计切换"

  - name: "历史Tab-历史记录"
    description: "近7天每日步数列表和折线图"
    features:
      - "7天每日步数列表：日期+步数+达标图标"
      - "7天步数折线图"
      - "内置递增趋势模拟历史数据（始终展示近7天）"

  - name: "我的Tab-设置与成就"
    description: "个人参数设置、参数联动、成就徽章与个人汇总"
    features:
      - "每日目标步数设置（默认8000步）"
      - "步长设置（默认70cm）"
      - "体重设置（默认65kg，影响卡路里系数）"
      - "参数修改后首页联动更新"
      - "成就徽章列表（已解锁/未解锁）"
      - "累计步数与运动天数汇总"

navigation:
  type: bottom_tab
  tabs:
    - "首页Tab-今日步数"
    - "统计Tab-详细统计"
    - "历史Tab-历史记录"
    - "我的Tab-设置与成就"

core_functions:
  - 底部Tab导航（首页/统计/历史/我的）
  - 大圆环进度条展示今日步数/目标步数
  - 模拟计步（每秒随机增加1-3步）
  - 距离和卡路里实时计算（基于步长和体重）
  - 目标达标提示
  - 24小时步数分布柱状图
  - 周/月统计概览与切换
  - 近7天历史步数列表和折线图
  - 个人参数设置（目标/步长/体重）与联动更新
  - 成就系统（徽章解锁）

constraints: "步数为应用内模拟生成（定时器每秒随机增加1-3步），非真实传感器数据；历史数据和24小时统计数据为内置示例；所有数据本地存储；无需用户登录；成就徽章与个人汇总数据本地持久化"

notes: "前端模拟计步完整闭环样本。重点验证：圆环进度与步数映射正确性、距离/卡路里计算公式、24小时柱状图与7天折线图数据展示、周/月统计切换、参数修改后的联动更新以及成就解锁逻辑。"
