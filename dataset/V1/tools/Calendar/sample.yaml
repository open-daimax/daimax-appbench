version: "2.0"
sample_id: Calendar
title: 日历
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_local"

requirement: |
  实现一个日历应用，支持事件管理和农历显示：

  【月视图主页】
  1. 月历网格：7列(周一到周日)×5-6行
  2. 今日高亮：当天日期用圆形背景标记
  3. 有事件的日期：底部小圆点标记
  4. 农历显示：每个日期下方小字显示农历日期
  5. 节假日标记：法定节假日红色文字（内置当年元旦/春节/清明/劳动节/端午/中秋/国庆）
  6. 左右滑动或箭头按钮切换月份
  7. 点击某天→查看当天事件列表→可添加新事件
  8. 顶部显示当前年月

  【添加/编辑事件页】
  9. 事件标题输入（必填）
  10. 开始时间选择器
  11. 结束时间选择器
  12. 重复设置：不重复/每天/每周/每月
  13. 提醒设置：页面内提醒（事件开始前，对应日期页面顶部显示提醒横幅）
  14. 保存事件

  【周视图】
  15. 横向7天(本周周一~周日)
  16. 纵向24小时时间轴（每小时一格）
  17. 事件显示为时间块（标题+时间段色块）
  18. 点击空白时间格→快速创建事件

core_functions:
  - 月历网格渲染(今日高亮/事件圆点标记)
  - 农历日期显示
  - 法定节假日标记(红色)
  - 月份切换(左右滑动/箭头)
  - 事件CRUD(标题/时间/重复/提醒)
  - 周视图(7天×24小时时间轴)
  - 事件重复规则(每天/每周/每月)

constraints: "节假日数据内置当前年份中国法定假日；农历算法使用简化版本（可仅展示日期对应农历文字）；周视图起始日为周一；事件存本地localStorage"

notes: "前端样本，事件数据本地存储，节假日硬编码。重点验证月历网格渲染、农历显示、事件CRUD、重复规则、周视图时间块展示。"
