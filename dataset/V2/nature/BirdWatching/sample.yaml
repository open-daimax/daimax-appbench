version: "2.0"
dataset_version: "v2"
sample_id: BirdWatching
title: 观鸟记录
app_type: 自然观察
requires_backend: true
requires_auth: true
complexity: high
status: active

requirement: |
  实现一个观鸟记录应用，支持观测记录、鸟类图鉴查阅、成就徽章收集和季节分布查看：

  【导航结构】
  底部Tab导航共5个入口：观测动态(主页)/鸟类图鉴/成就系统/发现/我的

  【登录/注册页】
  1. 支持用户注册和登录，提供邮箱+密码方式
  2. 登录成功后进入观测动态主页

  【观测动态页(主页)】
  3. 展示所有观测记录列表（按时间倒序）
  4. 每条记录卡片显示：鸟种名称、观测日期、地点、数量、照片缩略图
  5. 右上角"+"按钮进入添加观测记录页
  6. 系统预置3条示例观测记录供展示

  【观测详情页】
  7. 观测照片大图
  8. 鸟种名称与分类信息
  9. 观测数据：数量、行为描述、环境（栖息地类型）
  10. 观测地点和日期时间
  11. 编辑和删除按钮

  【添加观测记录页】
  12. 选择或拍摄鸟类照片
  13. 选择鸟种（从图鉴列表选择或手动输入）
  14. 填写观测数量
  15. 选择行为类型（觅食/飞翔/鸣叫/筑巢/休息）
  16. 选择环境类型（湿地/森林/草地/城市公园/海岸）
  17. 填写观测地点
  18. 选择观测日期时间
  19. 保存后记录出现在观测动态列表

  【鸟类图鉴页(Tab)】
  20. 鸟类列表：展示所有图鉴中的鸟种
  21. 每项显示：鸟种图片、中文名、拉丁学名、科属
  22. 顶部搜索栏支持按名称搜索
  23. 分类筛选：按目/科分类浏览
  24. 系统预置至少10种常见鸟类数据

  【鸟种详情页】
  25. 鸟种大图
  26. 基本信息：中文名、拉丁学名、科属、保护级别
  27. 形态特征描述
  28. 栖息环境和分布区域
  29. 季节分布图表（春/夏/秋/冬出现频率）
  30. 我的观测次数统计

  【成就系统页(Tab)】
  31. 成就徽章网格展示
  32. 每个徽章显示：图标、名称、解锁状态（已解锁/未解锁）
  33. 进度信息：如"已观测5/10种水鸟"
  34. 系统预置成就：初次观测、观测10种、观测50次、水鸟专家、林鸟达人等

  【成就详情页】
  35. 徽章大图
  36. 成就名称和描述
  37. 解锁条件和当前进度
  38. 解锁时间（已解锁的）

  【发现页(Tab)】
  39. 季节分布总览：当季推荐观测鸟种
  40. 热门观测地点推荐
  41. 观测小知识/技巧卡片

  【我的页(Tab)】
  42. 用户头像和昵称
  43. 统计数据：总观测次数、观测鸟种数、解锁成就数
  44. 我的记录入口：查看个人所有观测记录
  45. 目标鸟种入口：设置想要观测的目标鸟种列表
  46. 退出登录

  【我的记录页】
  47. 个人观测记录列表（按时间倒序）
  48. 支持按鸟种筛选

  【设置目标鸟种页】
  49. 从图鉴中选择想要观测的目标鸟种
  50. 已设定目标鸟种列表展示
  51. 已观测到的目标标记为"已完成"

pages:
  - name: "登录/注册页"
    level: "L3"
    entry_from: "应用启动/我的页-未登录状态"
    description: "用户注册与登录入口"
    features:
      - "邮箱+密码注册"
      - "邮箱+密码登录"
      - "登录成功跳转主页"

  - name: "观测动态"
    level: "L1"
    entry_from: "底部Tab-观测动态"
    description: "观测记录信息流"
    features:
      - "观测记录卡片列表"
      - "添加观测入口"
      - "预置示例记录"

  - name: "观测详情"
    level: "L2"
    entry_from: "观测动态-点击记录卡片"
    description: "单条观测记录完整信息"
    features:
      - "观测照片大图"
      - "鸟种信息+观测数据"
      - "地点+日期"
      - "编辑/删除按钮"

  - name: "添加观测记录"
    level: "L3"
    entry_from: "观测动态-右上角+按钮"
    description: "新增观测记录表单"
    features:
      - "照片上传"
      - "选择鸟种"
      - "数量+行为+环境+地点+日期"

  - name: "鸟类图鉴"
    level: "L1"
    entry_from: "底部Tab-鸟类图鉴"
    description: "鸟种百科列表"
    features:
      - "鸟种列表（图片+名称+学名+科属）"
      - "搜索栏"
      - "分类筛选"

  - name: "鸟种详情"
    level: "L2"
    entry_from: "鸟类图鉴-点击鸟种"
    description: "鸟种完整信息和季节分布"
    features:
      - "鸟种大图+基本信息"
      - "形态特征"
      - "栖息环境和分布"
      - "季节分布图表"
      - "我的观测次数"

  - name: "成就系统"
    level: "L1"
    entry_from: "底部Tab-成就系统"
    description: "成就徽章展示"
    features:
      - "徽章网格"
      - "解锁状态"
      - "进度信息"

  - name: "成就详情"
    level: "L2"
    entry_from: "成就系统-点击徽章"
    description: "单个成就详细信息"
    features:
      - "徽章大图+名称+描述"
      - "解锁条件和进度"

  - name: "发现"
    level: "L1"
    entry_from: "底部Tab-发现"
    description: "季节推荐和观测资讯"
    features:
      - "当季推荐鸟种"
      - "热门观测地点"
      - "观测知识卡片"

  - name: "我的"
    level: "L1"
    entry_from: "底部Tab-我的"
    description: "个人中心和统计"
    features:
      - "头像昵称"
      - "统计数据"
      - "我的记录入口"
      - "目标鸟种入口"
      - "退出登录"

  - name: "我的记录"
    level: "L2"
    entry_from: "我的-我的记录入口"
    description: "个人观测记录列表"
    features:
      - "观测记录列表"
      - "按鸟种筛选"

  - name: "设置目标鸟种"
    level: "L3"
    entry_from: "我的-目标鸟种入口"
    description: "目标鸟种管理"
    features:
      - "从图鉴选择目标鸟种"
      - "已设定目标列表"
      - "已观测标记完成"

core_functions:
  - 用户注册与登录
  - 观测记录管理（添加/编辑/删除观测记录）
  - 鸟类图鉴查阅（搜索/分类/详情/季节分布）
  - 成就徽章系统（自动解锁/进度追踪）
  - 个人统计（观测次数/鸟种数/成就数）
  - 目标鸟种设置与追踪
  - 季节推荐和观测资讯

constraints:
  - 需使用真实的后端应用
  - 用户只能查看和管理自己的观测记录（RLS隔离）
  - 成就自动根据观测记录解锁，不可手动操作
  - 系统预置至少10种鸟类图鉴数据
  - 系统预置3条示例观测记录供展示
  - 季节分布使用模拟数据
  - 照片功能使用模拟方式（照片由模型根据主题自动生成）
