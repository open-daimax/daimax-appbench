version: "2.0"
sample_id: ExpenseNote
title: 记账本
app_type: 工具
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的个人记账应用，包含以下页面与功能：

  【登录注册页】
  - 支持用户注册和登录
  - 登录成功后进入记账主页

  【记账主页（Tab1）】
  - 顶部月度概览卡片：本月总支出(红)/总收入(绿)/结余(蓝)
  - 顶部月份切换：左右箭头切换查看不同月份
  - 当月记录列表：按时间倒序展示收支记录
  - 每条记录：分类图标 + 分类名 + 备注 + 金额（收入绿色带+号/支出红色带-号）
  - 支持下拉刷新
  - 左滑记录显示删除按钮，确认后删除
  - 点击记录进入记录详情页
  - 右下角浮动"记一笔"按钮
  - 无记录时显示空状态引导

  【记一笔 / 编辑记录页】
  - 支出/收入切换Tab（默认支出）
  - 金额输入区：大字显示金额，数字键盘输入
  - 分类选择网格：
    - 支出：餐饮🍔/交通🚗/购物🛒/娱乐🎮/居住🏠/通讯📱/医疗💊/教育📚/其他❓
    - 收入：工资💰/奖金🎁/兼职💼/红包🧧/其他❓
  - 备注输入框（可选，最多30字）
  - 日期选择（默认今天）
  - 保存后返回主页，记录出现在列表；编辑模式回显已有内容

  【记录详情页】
  - 展示记录完整信息：类型、金额、分类、备注、日期
  - 提供编辑与删除入口

  【月度报表页（Tab2）】
  - 本月支出分类饼图：各分类占比+金额
  - 本月收支对比柱状图：收入柱+支出柱
  - 月度预算：设定预算金额+已用进度条+剩余金额；超额时进度条变红并提示"已超出预算"
  - 近6个月趋势：每月总支出折线图
  - 无数据时显示空状态

  【我的/设置页（Tab3）】
  - 展示当前登录用户信息
  - 主题切换（浅色/深色）
  - 预算提醒设置
  - 数据导出
  - 关于应用
  - 退出登录

  底部Tab导航：记账 / 报表 / 我的

core_functions:
  - 用户注册登录
  - 记账主页(月度概览+记录列表+月份切换+下拉刷新)
  - 记一笔(支出/收入Tab+金额+分类+备注+日期)
  - 记录详情查看与编辑
  - 删除记录(左滑+确认)
  - 月度报表(分类饼图/收支柱状图/预算进度条/趋势折线图)
  - 预算管理(设定金额+超额提醒)
  - 我的/设置页(用户信息/主题切换/数据导出/关于/退出登录)

constraints: "金额最多2位小数；用户数据完全自产CRUD；RLS数据隔离；分类为预设固定选项"

notes: "后端CRUD样本，用户自产数据。重点验证收支CRUD完整性、月度统计聚合、分类汇总、预算超额逻辑、RLS权限隔离。"
