version: "2.0"
sample_id: HomeBrewRecipe
title: 家酿果酒记录
app_type: 饮品酿造
dataset_version: "V2"
complexity: high
requires_backend: false
requires_auth: false

requirement: |
  实现一个家酿果酒记录应用，为家酿爱好者提供批次管理、配方库、发酵追踪与品尝记录功能：

  【酿造批次Tab】
  1. 批次列表：按时间倒序展示酿造批次，每条显示批次编号、酒名、状态(发酵中/陈酿中/已完成)、开始日期
  2. 批次状态筛选：全部/发酵中/陈酿中/已完成
  3. 点击进入批次详情
  4. 系统预置至少3个示例批次

  【配方库Tab】
  5. 配方卡片列表：显示酒名、基础水果、酒精度预估、发酵周期
  6. 按水果分类浏览（葡萄/苹果/梅子/柑橘/莓类/其他）
  7. 点击进入配方详情：完整配方信息+材料清单+步骤说明
  8. 预置至少6个经典配方

  【发酵追踪Tab】
  9. 当前发酵中批次列表（仅显示状态为发酵中的批次）
  10. 每批次显示：批次名称、开始日期、当前天数、最新温度和比重
  11. 快速记录入口：点击即可为某批次添加今日数据

  【品尝记录Tab】
  12. 品尝记录列表：显示酒名、品尝日期、评分、简短评价
  13. 支持按评分排序
  14. 关联对应批次

  【设置Tab】
  15. 材料清单管理（水果、糖、酵母等常用材料库）
  16. 计量单位设置（公制/英制）
  17. 通知设置（发酵提醒开关）

  【批次详情页】
  18. 批次基本信息：批次号、酒名、配方来源、开始日期、状态
  19. 材料用量记录：使用的水果种类和用量、糖量、酵母类型
  20. 发酵曲线：日期-温度/比重折线图
  21. 操作日志：每次操作记录（搅拌、转桶、添加物等）
  22. 状态流转按钮：发酵中→陈酿中→已完成

  【新建批次】
  23. 选择配方（从配方库选择或自定义）
  24. 填写批次名称、开始日期
  25. 记录材料用量（水果种类/kg、糖/g、酵母/g、水/L）
  26. 设置预期发酵周期
  27. 保存创建批次

  【记录发酵数据】
  28. 选择批次
  29. 记录当日温度(°C)和比重(SG值)
  30. 添加操作备注（如"搅拌除气"、"转二次发酵桶"）
  31. 保存记录

  【新建配方】
  32. 填写酒名、基础水果类型
  33. 设置预估酒精度、发酵周期
  34. 添加材料清单（名称+用量）
  35. 编写步骤说明
  36. 保存配方

  【添加品尝笔记】
  37. 关联批次（从已完成批次选择）
  38. 评分（1-5分）
  39. 品尝维度记录：色泽/香气/口感/回味
  40. 文字笔记
  41. 保存品尝记录

pages:
  - name: "酿造批次列表"
    level: "L1"
    description: "批次时间线与状态筛选"
    entry_from: "底部Tab-批次"
  - name: "配方库"
    level: "L1"
    description: "配方分类浏览"
    entry_from: "底部Tab-配方"
  - name: "发酵追踪"
    level: "L1"
    description: "发酵中批次监控与快速记录"
    entry_from: "底部Tab-发酵"
  - name: "品尝记录列表"
    level: "L1"
    description: "品尝评价列表与排序"
    entry_from: "底部Tab-品尝"
  - name: "设置"
    level: "L1"
    description: "材料库、单位与通知设置"
    entry_from: "底部Tab-设置"
  - name: "批次详情"
    level: "L2"
    description: "批次完整信息、发酵曲线与操作日志"
    entry_from: "酿造批次列表-点击批次"
  - name: "配方详情"
    level: "L2"
    description: "配方完整信息与材料步骤"
    entry_from: "配方库-点击配方卡片"
  - name: "发酵曲线"
    level: "L2"
    description: "温度/比重随时间变化图表"
    entry_from: "批次详情-发酵曲线区域"
  - name: "品尝详情"
    level: "L2"
    description: "单条品尝记录完整内容"
    entry_from: "品尝记录列表-点击记录"
  - name: "材料清单"
    level: "L2"
    description: "常用材料库管理"
    entry_from: "设置-材料清单入口"
  - name: "新建批次"
    level: "L3"
    description: "创建酿造批次表单"
    entry_from: "酿造批次列表-新建按钮"
  - name: "新建配方"
    level: "L3"
    description: "创建配方表单"
    entry_from: "配方库-新建按钮"
  - name: "记录发酵数据"
    level: "L3"
    description: "每日温度/比重数据录入"
    entry_from: "发酵追踪-快速记录按钮/批次详情-添加记录"
  - name: "添加品尝笔记"
    level: "L3"
    description: "品尝评分与笔记表单"
    entry_from: "品尝记录列表-新建按钮"
  - name: "编辑材料"
    level: "L3"
    description: "新增或编辑材料信息"
    entry_from: "材料清单-添加/编辑按钮"

navigation:
  type: bottom_tab
  tabs:
    - { name: "批次", icon: "flask", page: "酿造批次列表" }
    - { name: "配方", icon: "book", page: "配方库" }
    - { name: "发酵", icon: "thermometer", page: "发酵追踪" }
    - { name: "品尝", icon: "wine", page: "品尝记录列表" }
    - { name: "设置", icon: "settings", page: "设置" }

core_functions:
  - 酿造批次管理（创建/状态流转/详情）
  - 配方库浏览与创建
  - 发酵数据追踪（温度/比重曲线）
  - 品尝评分记录
  - 材料清单管理
  - 批次状态流转（发酵中→陈酿中→已完成）

constraints:
  - 纯前端应用，数据存储使用localStorage
  - 发酵曲线使用折线图展示温度和比重双Y轴
  - 品尝评分使用1-5分制
  - 比重(SG)值范围1.000-1.150，精确到小数点后三位
  - 预置至少3个示例批次和6个经典配方

notes: "纯前端家酿应用。重点验证：创建配方→开始批次→每日记录发酵数据→状态流转→品尝评估的完整闭环。"
