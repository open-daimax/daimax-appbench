version: "2.0"
sample_id: Stopwatch
title: 秒表与计时器
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的多功能计时工具应用，集成秒表、倒计时、多计时器、历史记录与设置，形成"计时→记录→回顾→管理"的完整闭环。使用底部 Tab 导航在各功能页之间切换。

  【页面结构】
  1. 秒表页（底部Tab-1，默认页）：
     - 顶部标题"秒表"
     - 中央大字时间显示：格式 MM:SS.ms（分:秒.毫秒），字号占屏幕宽度约 70%，居中
     - 主操作区（时间下方）：
       · 未开始状态：显示[开始]主按钮
       · 计时中状态：显示[记圈]与[暂停]两个按钮
       · 暂停状态：显示[重置]与[继续]两个按钮
     - 分段列表（页面下半部分，可滚动）：每次记圈生成一行，显示"圈次 | 分段时间 | 累计时间"
     - 最快圈整行高亮绿色，最慢圈整行高亮红色（分段数≥3 时生效）
     - 空状态：未记圈时列表区显示引导文案"开始计时后点击记圈记录分段"

  2. 倒计时页（底部Tab-2）：
     - 顶部标题"倒计时"
     - 时间设置区：时/分/秒 三个滚动选择器（滚轮选择器）
     - 快捷预设按钮行：[1分钟] [3分钟] [5分钟] [10分钟] [30分钟]，点击后自动填充选择器
     - 主操作区：
       · 设置状态：显示[开始]按钮
       · 倒计时中：显示环形进度条 + [暂停][取消]按钮
       · 暂停状态：显示[继续][取消]按钮
     - 剩余时间大字显示（MM:SS 或 HH:MM:SS）
     - 归零提示：倒计时到 00:00 时全屏显示"时间到！"大字 + 红色闪烁动画 + 提示音（受设置页音效开关控制）
     - 计时精度误差不超过 ±500ms

  3. 多计时器页（底部Tab-3）：
     - 顶部标题"多计时器"与右上角[+ 添加]按钮
     - 计时器列表：每个计时器为一张卡片，显示"标题 + 剩余时间 + 进度条 + [暂停/继续][删除]按钮"
     - 添加计时器弹窗：可输入标题与设置时长后确认创建
     - 最多可同时创建 5 个独立倒计时，各自独立运行、暂停、删除，互不影响
     - 空状态：无计时器时显示"点击右上角 + 添加计时器"引导

  4. 历史记录页（底部Tab-4）：
     - 顶部标题"历史记录"
     - 记录列表：展示已保存的秒表成绩，每条显示"日期时间 | 总时长 | 圈数"，点击展开查看该次全部分段明细
     - 每条记录支持左滑或点击[删除]单条删除
     - 顶部[清空全部]按钮
     - 秒表在暂停后点击[保存记录]可将本次成绩写入历史
     - 空状态：无记录时显示"暂无历史记录"

  5. 设置页（底部Tab-5）：
     - 顶部标题"设置"
     - 音效开关：开启/关闭倒计时结束提示音
     - 震动反馈开关：结束时是否震动
     - 时间格式选择：秒表毫秒显示开/关（MM:SS.ms 或 MM:SS）
     - 主题：浅色/深色切换
     - 关于：应用版本与说明

  【核心机制】
  - 秒表：开始/暂停/继续/重置全流程；记圈生成分段（分段时间=本圈耗时，累计时间=从开始到记圈的总时间）
  - 倒计时：滚轮或预设设置时长，启动后逐秒递减，支持暂停/继续/取消，归零全屏提示
  - 多计时器：多个倒计时并行独立运行
  - 历史记录：秒表成绩持久化保存、查看明细、单条/全部删除

  【视觉与反馈】
  - 计时数字使用等宽字体，避免抖动
  - 记圈时新分段行有淡入动画
  - 倒计时结束"时间到！"文字闪烁 3 秒
  - 环形进度条随倒计时平滑收缩

  【数据持久化】
  - 秒表历史记录使用 localStorage 本地持久化，关闭应用后重新打开仍可查看
  - 设置项（音效/震动/格式/主题）持久化保存
  - 注：计时器运行态不持久化，关闭页面后运行中的秒表/倒计时不恢复

core_functions:
  - 秒表计时(开始/暂停/继续/重置)
  - 记圈分段(圈次/分段时间/累计时间)
  - 最快圈绿色/最慢圈红色高亮
  - 倒计时设置(时/分/秒滚动选择器)
  - 快捷预设(1/3/5/10/30分钟)
  - 倒计时环形进度条与逐秒递减
  - 倒计时完成提示("时间到！"+闪烁+提示音)
  - 多计时器并行(最多5个独立倒计时)
  - 秒表历史记录保存/查看明细/删除
  - 设置页(音效/震动/时间格式/主题)
  - 历史记录与设置本地持久化(localStorage)
  - 底部Tab导航(秒表/倒计时/多计时器/历史/设置)

constraints:
  - 纯前台计时，不支持后台运行；关闭页面后运行态计时器不恢复
  - 计时精度误差不超过 ±500ms
  - 历史记录与设置使用 localStorage 持久化
  - 多计时器最多 5 个
  - 无需用户登录

notes: "V2版本：扩展为多功能计时工具，新增历史记录页与设置页，形成完整闭环。重点验证秒表精度、记圈分段逻辑、倒计时归零提示、多计时器独立运行、历史记录持久化。"
