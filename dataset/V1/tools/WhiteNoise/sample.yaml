version: "2.0"
sample_id: WhiteNoise
title: 白噪音
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的白噪音混合播放应用，帮助用户专注、助眠或放松，支持多音源混合、场景预设、定时关闭与个性化设置。
  注意：本应用为UI交互展示型，音频播放为状态模拟（图标激活/音量滑块可交互），不要求真实播放声音文件。

  【整体导航结构】
  应用采用底部 Tab 导航，包含 3 个主 Tab：
  - "混音"（播放主页，默认首页）
  - "场景"（预设场景列表页）
  - "我的"（设置与偏好页）

  【混音页 - 播放主页（默认首页）】
  1. 音源网格：展示 8 种环境音源图标卡片
     - 🌧️雨声、🌊海浪、🌲森林、🔥篝火、☕咖啡厅、🌬️风声、🐦鸟鸣、⚡雷声
  2. 点击音源图标→激活该音源（图标高亮 + 显示该音源音量滑块）
  3. 每个音源独立音量控制滑块（0-100%）
  4. 可同时激活多个音源（混合播放）
  5. 再次点击已激活的音源→关闭该音源
  6. 当前混合状态显示："正在播放：雨声 + 森林"，未激活时提示"选择音源开始播放"
  7. 底部播放控制栏：播放/暂停大按钮（控制所有已激活音源）+ 总音量控制条
  8. 定时器入口：进入定时设置，设置后顶部显示"XX 分钟后自动关闭"倒计时
  9. 保存为场景按钮：将当前激活的音源组合与音量保存为一个自定义场景（输入名称）

  【定时关闭设置】
  10. 定时选项：15 分钟 / 30 分钟 / 60 分钟 / 90 分钟 / 不定时
  11. 选择后返回主页，顶部显示倒计时并持续递减
  12. 倒计时归零后自动暂停所有音源
  13. 定时进行中可取消定时（恢复为不定时）

  【场景页 - 预设与自定义场景】
  14. 预设场景列表：内置若干推荐场景（如"雨天入眠"=雨声+雷声、"专注工作"=咖啡厅+森林、"海边度假"=海浪+鸟鸣）
  15. 每个场景卡片显示场景名 + 包含的音源组合
  16. 点击场景卡片→一键应用该组合并跳转混音页开始播放
  17. 展示用户自定义保存的场景，支持删除自定义场景
  18. 无自定义场景时该区域显示空状态提示

  【我的页 - 设置与偏好】
  19. 默认音量设置：新激活音源时的初始音量（0-100%）
  20. 淡入淡出开关：播放/暂停时音量是否渐变（开/关）
  21. 后台保持播放开关：切换页面时是否保持播放状态（开/关）
  22. 默认定时时长设置：可选 15/30/60/90 分钟或不定时
  23. 重置所有音量与场景入口：点击后二次确认，恢复默认状态
  24. 设置修改后立即持久化

  【数据流转说明】
  用户在混音页激活音源并调节音量→可保存为场景→场景页展示预设与自定义场景→
  点击场景一键应用回混音页→我的页设置影响默认音量与定时→重置后回到初始状态。

core_functions:
  - 底部Tab导航(混音/场景/我的)
  - 8种音源图标卡片网格展示
  - 音源激活/关闭切换(图标高亮)
  - 独立音量滑块控制(0-100%)
  - 多音源混合(同时激活多个)
  - 当前混合状态文字显示
  - 播放/暂停总控与底部总音量
  - 定时关闭(15/30/60/90分钟/不定时/可取消)
  - 预设场景一键应用
  - 自定义场景保存与删除
  - 默认音量/淡入淡出/后台播放等偏好设置
  - 重置所有音量与场景
  - 空状态展示

constraints: "UI交互展示型应用，不需要真实音频文件；音源状态和音量存localStorage；定时器纯前台运行"

notes: "纯前端白噪音应用（UI交互模拟）。重点验证音源激活/关闭、多音源混合状态、音量滑块交互、定时器设置等功能。"
