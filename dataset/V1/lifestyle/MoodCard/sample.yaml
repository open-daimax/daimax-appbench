version: "2.0"
sample_id: MoodCard
title: 今日心情卡片
app_type: 生活
dataset_version: "v2"
requires_backend: false
requires_auth: false
complexity: low
status: active

requirement: |
  实现一个功能完整的心情卡片生成应用，包含以下页面与功能：

  【心情编辑页（Tab1·主页）】
  - 顶部标题"今日心情"
  - 心情图标选择区：4种心情按钮（开心/平静/低落/兴奋），选中高亮+放大，默认无选中
  - 一句话输入框：placeholder"写下你此刻的心情…"，限制50字，显示字数统计
  - 背景样式选择区：3-4种预设卡片背景色/渐变供选择，选中有边框高亮
  - "生成卡片"按钮（需选中心情图标后才可点击，否则置灰）
  - 点击"生成卡片" → 跳转到【卡片预览页】

  【卡片预览页（子页面，从编辑页"生成"或历史页"点击"进入）】
  - 顶部返回按钮 → 返回来源页（编辑页或历史页）
  - 卡片居中展示：选中的心情图标 + 一句话文字 + 当前日期 + 所选背景样式
  - 卡片有圆角阴影精美排版
  - "保存到相册"按钮（点击后toast提示"已保存"）
  - "重新编辑"按钮 → 返回编辑页（保留之前的选择状态）
  - "分享"按钮入口（点击显示分享选项面板）

  【历史心情页（Tab2）】
  - 按日期倒序展示已生成的心情卡片列表
  - 每条记录：心情图标 + 一句话摘要（截断显示） + 日期
  - 点击记录 → 进入【卡片预览页】（展示该条完整卡片）
  - 无记录时显示空状态"还没有心情记录，去创建第一张吧"

  底部Tab导航：创建心情 / 心情历史

core_functions:
  - 心情图标选择（4种互斥选中）
  - 一句话文字输入（50字限制+字数统计）
  - 背景样式选择
  - 生成卡片并跳转预览
  - 卡片预览展示（图标+文字+日期+背景）
  - 保存到相册（模拟操作+toast）
  - 重新编辑（返回并保留选择）
  - 历史心情记录列表
  - 点击历史记录查看完整卡片

constraints: "纯前端本地应用；心情图标4种互斥选择；卡片样式需精美（圆角阴影）；历史记录使用本地存储；字数限制50字"

notes: "无后端纯前端样本。重点验证心情选择交互、卡片生成展示、页面跳转流畅性、历史记录管理。"
