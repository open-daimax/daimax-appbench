version: "2.0"
sample_id: Weibo
title: 微博
app_type: 社交
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
requires_backend: true
requires_auth: true

requirement: |
  实现一个微博风格的社交媒体应用，是一个功能完整的真实社交产品。
  应用采用底部Tab导航，包含首页、发现、发布、消息、我的五个主入口，覆盖内容创建闭环、
  互动体系（点赞/评论/转发）、用户体系、内容发现与通知系统。

  【页面1：登录注册页】
  - 支持用户注册和登录
  - 注册表单：邮箱、密码、昵称（注册时可填）
  - 登录表单：邮箱、密码
  - 提供登录/注册切换入口
  - 注册成功后自动登录并跳转首页
  - 表单校验：邮箱格式、密码长度，错误时给出提示

  【页面2：首页信息流（Tab-首页）】
  - 顶部：频道切换（如"关注""推荐"两个标签） + 搜索入口
  - 展示关注用户的微博和推荐内容（系统预置至少5条示例微博）
  - 每条微博显示：作者头像 + 昵称 + 正文 + 图片（可选） + 发布时间
  - 底部交互栏：点赞数 / 评论数 / 转发数，点赞可直接在列表页操作
  - 支持下拉刷新与上拉加载更多（分页）
  - 点击微博进入详情页
  - 发布入口：右下角浮动按钮
  - "关注"标签无内容时显示空状态引导

  【页面3：发现/热搜页（Tab-发现）】
  - 顶部搜索栏：输入关键词搜索微博正文和话题
  - 热搜榜：硬编码至少10条热搜话题（排名 + 话题名 + 热度值，可带"热""新"标签）
  - 点击热搜话题 → 展示该话题相关微博列表
  - 搜索历史记录：展示最近搜索词，可清空
  - 搜索结果展示匹配微博；无结果时显示空状态提示

  【页面4：发布微博页（Tab-发布）】
  - 文字输入框（最多140字，实时显示剩余字数）
  - 可选添加图片（占位符URL，支持多张，可删除已选图片）
  - 可添加话题标签（#话题#，支持多个）
  - 发布按钮：发布后跳转首页且微博出现在信息流顶部
  - 表单校验：正文不能为空且不超字数限制，违反时给出提示

  【页面5：微博详情页（评论转发）】
  - 显示微博完整正文 + 图片 + 话题标签 + 发布时间
  - 作者信息栏：头像 + 昵称 + "关注/已关注"按钮
  - 底部操作栏：点赞（点击变红+计数+1，再次取消）、评论、转发计数
  - 评论列表：显示所有评论（头像+昵称+内容+时间），支持点赞评论
  - 评论输入框：输入文字发送评论，新评论即时出现
  - 转发按钮：点击弹出转发面板，可添加转发语，转发成功后计数+1

  【页面6：消息/通知页（Tab-消息）】
  - 通知分类入口：点赞、评论、新增粉丝（关注）
  - 互动通知列表：展示谁点赞/评论/转发了我的微博（头像+昵称+动作描述+时间）
  - 点击通知可跳转到对应微博详情
  - 无通知时显示空状态提示

  【页面7：个人主页/我的（Tab-我的）】
  - 顶部资料区：头像、昵称、简介、粉丝数、关注数、微博数
  - "编辑资料"入口：可修改昵称、简介、头像
  - 我的微博列表：展示自己发布的所有微博
  - 删除微博：在个人主页可删除自己的微博（仅删除自己的）
  - 设置/退出登录入口

constraints: |
  需使用真实的后端应用。
  系统预置5条微博和3个示例用户；热搜榜为硬编码固定数据10条。

notes: "后端CRUD样本，用户自己发微博。热搜为硬编码数据不需要动态计算。"
