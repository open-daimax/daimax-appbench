version: "2.0"
dataset_version: "v2"
sample_id: SeedLibrary
title: 种子图书馆
app_type: 自然观察
requires_backend: true
requires_auth: true
complexity: high
status: active

requirement: |
  实现一个种子图书馆应用，支持种子入库管理、借出追踪、种植指南查阅、收获记录和社区共享：

  【导航结构】
  底部Tab导航共5个入口：种子库(主页)/借出管理/种植指南/社区/我的

  【登录/注册页】
  1. 支持用户注册和登录，提供邮箱+密码方式
  2. 登录成功后进入种子库主页

  【种子库页(主页)】
  3. 种子列表：以卡片形式展示用户拥有的所有种子
  4. 每张卡片显示：种子图片、品种名称、来源、库存数量、状态标签（充足/紧缺/无库存）
  5. 顶部搜索栏支持按品种名称搜索
  6. 分类筛选：按类别（蔬菜/花卉/草本/果树）筛选
  7. 右上角"+"进入入库种子页
  8. 系统预置5种示例种子供展示

  【种子详情页】
  9. 种子大图
  10. 基本信息：品种名称、学名、类别、来源、入库日期
  11. 库存信息：当前库存、已借出数量、总入库量
  12. 种植指南摘要：适播季节、发芽温度
  13. 借出记录列表：该种子的所有借出记录
  14. 编辑和删除按钮

  【入库种子页】
  15. 上传种子照片
  16. 填写品种名称（必填）
  17. 填写学名（可选）
  18. 选择类别：蔬菜/花卉/草本/果树
  19. 填写来源（如自留种/交换/购买）
  20. 输入入库数量
  21. 填写适播季节（可选）
  22. 保存后种子出现在种子库列表

  【借出管理页(Tab)】
  23. 借出记录列表：展示所有借出的种子记录
  24. 每条显示：种子品种、借出人姓名、借出数量、借出日期、状态（已借出/已归还/种植中）
  25. 支持按状态筛选
  26. 右上角"+"进入登记借出页

  【登记借出页】
  27. 选择要借出的种子（从自己的种子库中选择）
  28. 填写借出人姓名
  29. 输入借出数量（不超过当前库存）
  30. 选择借出日期
  31. 填写备注（可选）
  32. 保存后：种子库存减少对应数量，借出记录出现在列表

  【借出详情页】
  33. 借出完整信息
  34. 种子品种、借出人、数量、日期
  35. 状态流转按钮：已借出→种植中→已归还
  36. 归还时库存恢复

  【种植指南页(Tab)】
  37. 种植指南列表：展示所有可参考的种植指南
  38. 每项显示：品种名称、适播季节、种植难度
  39. 支持搜索
  40. 系统预置至少8种种植指南

  【指南详情页】
  41. 品种名称和图片
  42. 适播季节和种植难度
  43. 土壤要求
  44. 播种方法（直播/育苗移栽）
  45. 发芽条件（温度、天数）
  46. 生长周期
  47. 养护要点
  48. 常见问题

  【社区页(Tab)】
  49. 社区动态列表：用户分享的种植经验和收获
  50. 每条动态显示：发布者昵称、内容摘要、照片、点赞数、发布时间
  51. 右上角"+"进入发布分享页
  52. 系统预置3条示例社区动态

  【发布分享页】
  53. 输入分享标题
  54. 输入分享正文
  55. 上传照片（可选）
  56. 选择关联种子品种（可选）
  57. 发布后动态出现在社区列表

  【我的页(Tab)】
  58. 用户头像和昵称
  59. 统计数据：种子品种数、借出总次数、收获总次数
  60. 收获记录入口
  61. 我的分享入口
  62. 退出登录

  【收获记录页】
  63. 收获记录列表：展示用户的所有收获
  64. 每条显示：种子品种、收获量、收获日期、照片
  65. 右上角"+"进入记录收获页

  【记录收获页】
  66. 选择关联种子品种
  67. 输入收获量
  68. 选择收获日期
  69. 上传收获照片（可选）
  70. 填写心得备注（可选）
  71. 保存后记录出现在收获列表

pages:
  - name: "登录/注册页"
    level: "L3"
    entry_from: "应用启动/我的页-未登录状态"
    description: "用户注册与登录入口"
    features:
      - "邮箱+密码注册"
      - "邮箱+密码登录"
      - "登录成功跳转主页"

  - name: "种子库"
    level: "L1"
    entry_from: "底部Tab-种子库"
    description: "种子列表主页"
    features:
      - "种子卡片列表（图片+品种+来源+库存+状态）"
      - "搜索栏"
      - "分类筛选"
      - "入库种子入口"

  - name: "种子详情"
    level: "L2"
    entry_from: "种子库-点击种子卡片"
    description: "单个种子完整信息"
    features:
      - "种子大图+基本信息"
      - "库存信息"
      - "种植指南摘要"
      - "借出记录列表"
      - "编辑/删除按钮"

  - name: "入库种子"
    level: "L3"
    entry_from: "种子库-右上角+按钮"
    description: "新增种子入库"
    features:
      - "照片+品种+学名+类别+来源+数量+适播季节"

  - name: "借出管理"
    level: "L1"
    entry_from: "底部Tab-借出管理"
    description: "借出记录列表"
    features:
      - "借出记录列表（品种+借出人+数量+日期+状态）"
      - "按状态筛选"
      - "登记借出入口"

  - name: "登记借出"
    level: "L3"
    entry_from: "借出管理-右上角+按钮"
    description: "新增借出登记"
    features:
      - "选择种子+借出人+数量+日期+备注"

  - name: "借出详情"
    level: "L2"
    entry_from: "借出管理-点击借出记录"
    description: "单条借出完整信息"
    features:
      - "借出信息详情"
      - "状态流转（已借出→种植中→已归还）"

  - name: "种植指南"
    level: "L1"
    entry_from: "底部Tab-种植指南"
    description: "种植指南列表"
    features:
      - "指南列表（品种+适播季节+难度）"
      - "搜索功能"

  - name: "指南详情"
    level: "L2"
    entry_from: "种植指南-点击指南条目"
    description: "种植指南完整内容"
    features:
      - "品种+图片+适播季节+难度"
      - "土壤+播种方法+发芽条件"
      - "生长周期+养护要点"

  - name: "社区"
    level: "L1"
    entry_from: "底部Tab-社区"
    description: "社区动态列表"
    features:
      - "动态列表（昵称+内容+照片+点赞+时间）"
      - "发布分享入口"
      - "预置示例动态"

  - name: "发布分享"
    level: "L3"
    entry_from: "社区-右上角+按钮"
    description: "发布社区分享"
    features:
      - "标题+正文+照片+关联品种"

  - name: "我的"
    level: "L1"
    entry_from: "底部Tab-我的"
    description: "个人中心"
    features:
      - "头像昵称"
      - "统计数据"
      - "收获记录入口"
      - "我的分享入口"
      - "退出登录"

  - name: "收获记录"
    level: "L2"
    entry_from: "我的-收获记录入口"
    description: "收获记录列表"
    features:
      - "收获列表（品种+收获量+日期+照片）"
      - "记录收获入口"

  - name: "记录收获"
    level: "L3"
    entry_from: "收获记录-右上角+按钮"
    description: "新增收获记录"
    features:
      - "选择品种+收获量+日期+照片+心得"

core_functions:
  - 用户注册与登录
  - 种子入库管理（添加/编辑/删除+分类筛选+搜索）
  - 借出管理（登记借出/状态流转/库存联动）
  - 种植指南查阅（搜索/详情）
  - 收获记录（记录收获量+照片）
  - 社区共享（发布分享/浏览动态/点赞）
  - 个人统计（种子数/借出次数/收获次数）

constraints:
  - 需使用真实的后端应用
  - 用户只能管理自己的种子和借出记录（RLS隔离）
  - 借出数量不可超过当前库存
  - 借出后库存自动减少，归还后库存恢复
  - 库存状态规则：数量≥10为充足，1-9为紧缺，0为无库存
  - 系统预置5种示例种子和至少8种种植指南
  - 系统预置3条示例社区动态
  - 照片功能使用模拟方式（照片由模型根据主题自动生成）
