version: "2.0"
sample_id: TarotCard
title: 塔罗牌占卜
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的塔罗牌占卜应用，支持多牌阵占卜、牌面释义、历史记录管理、牌库查阅与个性化设置。

  【整体导航结构】
  应用采用底部 Tab 导航，包含 4 个主 Tab：
  - "占卜"（抽牌主页，默认首页）
  - "牌库"（塔罗牌图鉴列表页）
  - "历史"（占卜记录页）
  - "我的"（设置与偏好页）

  【占卜页 - 抽牌主页（默认首页）】
  1. 顶部牌阵选择：支持两种牌阵——"单牌指引"（1 张）与"时间之流"（3 张：过去/现在/未来）
  2. 可选问题输入框：占卜前可输入本次占卜的问题（如"本月事业运势"），随记录保存
  3. 中央展示一叠倒扣的牌背图案与"开始占卜"按钮
  4. 点击后显示选牌指引（如"请选择 3 张牌：过去/现在/未来"）
  5. 展示 7 张倒扣的牌供选择（从牌库中随机抽取）
  6. 依次点选目标数量的牌，每选一张显示位置标签（过去✓/现在✓/未来✓）
  7. 选满后"查看结果"按钮出现，其余牌不可再选

  【牌面释义页】
  8. 依次展示所选牌的正面：牌面图案（占位符）+ 牌名
  9. 每张牌显示：位置（过去/现在/未来）、牌名、正位/逆位（随机决定）、释义文字（2-3 句解读）
  10. 综合解读区域：根据所选牌组合给出整体建议（1 段话）；若有问题则围绕问题作答
  11. "保存到历史"按钮与"重新占卜"按钮

  【牌库页 - 塔罗牌图鉴】
  12. 展示内置 22 张大阿尔卡纳牌的列表（牌面占位图 + 牌名 + 编号）
  13. 点击任一牌进入牌详情：牌名、关键词、正位释义、逆位释义
  14. 支持按牌名搜索过滤牌库

  【历史页 - 占卜记录】
  15. 占卜记录列表：日期 + 牌阵类型 + 牌名缩写 + 整体关键词（若有问题则显示问题）
  16. 点击记录查看完整释义详情
  17. 支持删除单条记录
  18. 无记录时显示"还没有占卜记录，去抽一卦吧"

  【我的页 - 设置与偏好】
  19. 默认牌阵设置：打开占卜页时默认选中的牌阵（单牌/三牌）
  20. 逆位开关：是否启用逆位牌（关闭时全部按正位解读）
  21. 抽牌动画开关：翻牌时是否播放翻牌动画（开/关）
  22. 清空所有占卜记录入口：点击后二次确认，清空全部历史
  23. 设置修改后立即持久化并在占卜页生效

  【数据流转说明】
  用户在占卜页选择牌阵并抽牌→牌面释义页展示释义与综合解读→保存到历史→历史页查看/删除记录→
  牌库页可随时查阅牌意→我的页设置影响默认牌阵与逆位→清空后历史页回到空状态。

  数据说明：内置22张大阿尔卡纳牌数据（牌名+正位释义+逆位释义），每张牌有唯一ID。

core_functions:
  - 底部Tab导航(占卜/牌库/历史/我的)
  - 牌阵选择(单牌/三牌)
  - 可选问题输入
  - 牌背展示与开始占卜
  - 7张牌随机展示供选择
  - 依次选牌(位置标签)
  - 牌面释义(牌名/正逆位/释义文字)
  - 综合解读(组合建议/围绕问题)
  - 保存到历史记录
  - 历史记录列表(查看/删除)
  - 重新占卜
  - 牌库图鉴(22张/详情/搜索)
  - 默认牌阵/逆位/动画等偏好设置
  - 清空历史记录
  - 空状态展示

constraints: "内置22张大阿尔卡纳牌（含正逆位释义）；选牌和结果存localStorage；占位符图案代替真实牌面图"

notes: "纯前端塔罗牌应用。重点验证随机选牌交互、正逆位释义展示、综合解读、历史记录保存与删除等功能。内置牌数据：愚者/魔术师/女教皇/皇后/皇帝/教皇/恋人/战车/力量/隐者/命运之轮/正义/倒吊人/死神/节制/恶魔/塔/星星/月亮/太阳/审判/世界。"
