version: "2.0"
sample_id: IncenseJournal
title: 香道品鉴日记
app_type: 饮品酿造
dataset_version: "V2"
complexity: high
requires_backend: false
requires_auth: false

requirement: |
  实现一个香道品鉴日记应用，为香道爱好者提供香材档案、品鉴记录、香方配伍与熏香计时功能：

  【品鉴日记Tab】
  1. 品鉴日记时间线列表：按日期倒序展示品鉴记录，每条显示香材名称、品鉴日期、评分、心情标签
  2. 支持按香材类型筛选（沉香/檀香/花香/草本/树脂/合香）
  3. 点击进入品鉴详情
  4. 预置至少5条示例品鉴记录

  【香材档案Tab】
  5. 香材卡片列表：显示名称、类型、产地、等级(星级)、特征描述
  6. 按类型分类浏览（沉香/檀香/花香/草本/树脂）
  7. 点击进入香材详情：完整信息+适宜场景+搭配建议
  8. 预置至少10种经典香材数据

  【香方配伍Tab】
  9. 香方列表：显示香方名称、主要香材、适宜场景、收藏数
  10. 按场景分类（静坐/阅读/茶道/睡前/待客）
  11. 点击进入香方详情：配伍比例+使用方法+品鉴笔记
  12. 预置至少6个经典香方

  【熏香计时Tab】
  13. 计时器主界面：大字体倒计时/正计时显示
  14. 快捷预设时间：15分钟/30分钟/45分钟/60分钟
  15. 自定义时间设置
  16. 开始/暂停/重置按钮
  17. 选择当前熏香的香方或香材
  18. 计时结束后自动弹出品鉴记录入口

  【设置Tab】
  19. 收藏香方列表入口
  20. 品鉴统计（总品鉴次数、最爱香材、熏香总时长）
  21. 提醒设置（计时结束提醒方式）
  22. 清除数据

  【品鉴详情页】
  23. 品鉴完整信息：香材/香方名称、品鉴日期、场景
  24. 品鉴评分：前调/中调/尾调各1-5分
  25. 感官描述：气味特征标签（清新/甘甜/木质/辛香/烟熏等）
  26. 心情标签：宁静/愉悦/专注/放松
  27. 品鉴笔记文字

  【香材详情页】
  28. 香材完整信息：名称、类型、产地、等级、价格区间
  29. 特征描述：气味描述+持久度+适宜季节
  30. 搭配建议：与其他香材的配伍推荐

  【新建品鉴】
  31. 选择品鉴对象（香材或香方）
  32. 选择品鉴场景
  33. 三调评分：前调/中调/尾调各1-5分
  34. 选择气味特征标签（多选）
  35. 选择心情标签
  36. 输入品鉴笔记
  37. 保存记录

  【创建香方】
  38. 填写香方名称
  39. 添加香材配伍（选择香材+比例/用量）
  40. 设置适宜场景
  41. 编写使用方法说明
  42. 保存香方

pages:
  - name: "品鉴日记列表"
    level: "L1"
    description: "品鉴记录时间线与分类筛选"
    entry_from: "底部Tab-品鉴"
  - name: "香材档案"
    level: "L1"
    description: "香材分类浏览与搜索"
    entry_from: "底部Tab-香材"
  - name: "香方配伍"
    level: "L1"
    description: "香方列表与场景分类"
    entry_from: "底部Tab-香方"
  - name: "熏香计时"
    level: "L1"
    description: "熏香倒计时器与香材选择"
    entry_from: "底部Tab-计时"
  - name: "设置"
    level: "L1"
    description: "收藏、统计与偏好设置"
    entry_from: "底部Tab-设置"
  - name: "品鉴详情"
    level: "L2"
    description: "品鉴记录完整内容与三调评分"
    entry_from: "品鉴日记列表-点击记录"
  - name: "香材详情"
    level: "L2"
    description: "香材完整信息与搭配建议"
    entry_from: "香材档案-点击香材卡片"
  - name: "香方详情"
    level: "L2"
    description: "香方配伍比例与使用方法"
    entry_from: "香方配伍-点击香方卡片"
  - name: "计时记录"
    level: "L2"
    description: "历史熏香计时记录列表"
    entry_from: "设置-熏香统计"
  - name: "收藏列表"
    level: "L2"
    description: "已收藏的香方列表"
    entry_from: "设置-收藏入口"
  - name: "新建品鉴"
    level: "L3"
    description: "创建品鉴记录表单"
    entry_from: "品鉴日记列表-新建按钮/计时结束弹窗"
  - name: "添加香材"
    level: "L3"
    description: "录入新香材信息"
    entry_from: "香材档案-添加按钮"
  - name: "创建香方"
    level: "L3"
    description: "配伍新香方表单"
    entry_from: "香方配伍-新建按钮"
  - name: "开始计时"
    level: "L3"
    description: "计时器启动与香材选择"
    entry_from: "熏香计时-开始按钮"
  - name: "编辑笔记"
    level: "L3"
    description: "品鉴笔记文字编辑"
    entry_from: "新建品鉴-笔记步骤"

navigation:
  type: bottom_tab
  tabs:
    - { name: "品鉴", icon: "feather", page: "品鉴日记列表" }
    - { name: "香材", icon: "leaf", page: "香材档案" }
    - { name: "香方", icon: "book-open", page: "香方配伍" }
    - { name: "计时", icon: "clock", page: "熏香计时" }
    - { name: "设置", icon: "settings", page: "设置" }

core_functions:
  - 品鉴记录（三调评分+气味标签+心情+笔记）
  - 香材档案浏览与分类
  - 香方配伍管理
  - 熏香计时器（预设/自定义时间）
  - 收藏管理
  - 品鉴统计

constraints:
  - 纯前端应用，数据存储使用localStorage
  - 计时器精度±500ms，支持后台运行提醒
  - 品鉴评分使用1-5分制，三调独立评分
  - 预置至少5条品鉴记录、10种香材、6个香方
  - 气味特征标签至少提供8种（清新/甘甜/木质/辛香/烟熏/花香/果香/药香）

notes: "纯前端香道应用。重点验证：了解香材→选择配伍→熏香计时→记录品鉴感受→收藏配方的完整闭环。"
