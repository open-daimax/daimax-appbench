version: "2.0"
dataset_version: "v1"
sample_id: ShoppingApp
title: 购物商城
app_type: 电商
requires_backend: true
requires_auth: true
complexity: high
status: deprecated
deprecated_reason: "确定拦截"

requirement: |
  实现一个完整的购物商城应用，支持商品浏览、搜索、购物车和下单：

  【首页-商品推荐】
  1. 顶部搜索栏：点击进入搜索页
  2. 分类导航栏：横向展示商品分类（如服饰、电子、食品、家居），点击进入分类列表
  3. 推荐商品列表：瀑布流展示商品卡片，每个卡片显示商品图片、名称、价格
  4. 下拉加载更多商品
  5. 系统预置至少10个示例商品供展示

  【搜索页】
  6. 输入关键词搜索商品，实时显示匹配结果
  7. 支持按价格区间筛选（设置最低价和最高价）
  8. 支持按价格排序（升序/降序）
  9. 搜索无结果时显示"未找到相关商品"提示

  【商品详情页】
  10. 展示商品大图（可左右滑动切换多图）
  11. 显示商品名称、价格、库存数量
  12. 规格选择区：选择颜色/尺寸，不同规格可能有不同价格和库存
  13. 数量选择：加减按钮控制购买数量，不能超过库存
  14. "加入购物车"按钮
  15. "立即购买"按钮
  16. 收藏按钮：点击收藏/取消收藏

  【购物车页(Tab)】
  17. 购物车商品列表：显示商品图片、名称、规格、单价、数量
  18. 每项可修改数量（加减按钮）
  19. 左滑删除商品
  20. 全选/取消全选复选框
  21. 底部结算栏：显示已选商品总价，"去结算"按钮
  22. 购物车为空时显示空状态提示（如"购物车空空如也，去逛逛吧"）

  【结算确认页】
  23. 选择或新增收货地址（姓名、手机号、详细地址）
  24. 显示订单商品清单和总价
  25. "提交订单"按钮 → 模拟支付成功 → 显示成功提示 → 跳转订单列表

  【订单列表页(Tab)】
  26. 展示用户所有订单，每个订单显示状态（待支付/待收货/已完成）、商品缩略图、金额
  27. 点击订单进入订单详情页
  28. 无订单时显示空状态提示

  【订单详情页】
  29. 显示订单商品清单、单价数量、收货地址、订单总额、订单状态
  30. 状态流转：待支付 -> 待收货 -> 已完成（模拟支付后进入待收货，确认收货后已完成）
  31. 已完成订单提供评价入口

  【评价系统】
  32. 订单完成后可对购买的商品进行评价
  33. 评价包含评分（星级）和文字评价
  34. 已评价商品显示评价内容，不可重复评价

  【个人中心(Tab)】
  35. 显示用户头像和昵称
  36. 我的订单入口
  37. 收藏商品列表入口
  38. 地址管理入口
  39. 关注的店铺入口
  40. 退出登录

  【店铺关注】
  41. 商品详情页可关注/取消关注店铺
  42. 个人中心查看已关注的店铺列表

pages:
  - name: "首页-商品推荐"
    description: "商品瀑布流展示和分类导航"
    features:
      - "搜索入口"
      - "分类导航栏"
      - "商品瀑布流列表：图片+名称+价格"
      - "下拉加载更多"

  - name: "搜索页"
    description: "商品搜索和筛选"
    features:
      - "关键词搜索"
      - "价格区间筛选"
      - "价格排序"
      - "无结果提示"

  - name: "商品详情页"
    description: "商品完整信息和购买操作"
    features:
      - "商品图片轮播"
      - "规格选择（颜色/尺寸）"
      - "数量选择（不超库存）"
      - "加入购物车"
      - "立即购买"
      - "收藏/取消收藏"

  - name: "购物车"
    description: "已加入购物车的商品管理"
    features:
      - "商品列表：图片+名称+规格+单价+数量"
      - "修改数量"
      - "删除商品"
      - "全选/结算"
      - "空状态提示"

  - name: "结算确认"
    description: "提交订单前的确认页"
    features:
      - "收货地址选择/新增"
      - "订单商品清单"
      - "提交订单+模拟支付"

  - name: "订单列表"
    description: "用户所有历史订单"
    features:
      - "订单状态展示（待支付/待收货/已完成）"
      - "点击进入订单详情"
      - "空状态提示"

  - name: "订单详情"
    description: "单个订单详情与状态流转"
    features:
      - "商品清单+单价数量+总额"
      - "收货地址+订单状态"
      - "状态流转（待支付->待收货->已完成）"
      - "已完成订单评价入口"

  - name: "商品评价"
    description: "订单完成后的商品评价"
    features:
      - "评分（星级）+文字评价"
      - "不可重复评价"

  - name: "个人中心"
    description: "用户信息和功能入口"
    features:
      - "头像昵称"
      - "我的订单入口"
      - "收藏列表入口"
      - "地址管理入口"
      - "关注店铺入口"
      - "退出登录"

core_functions:
  - 商品浏览和搜索（关键词+筛选+排序）
  - 商品详情和规格选择
  - 购物车管理（增删改）
  - 下单结算（模拟支付）
  - 订单管理（列表/详情/状态流转）
  - 购后评价（评分+文字）
  - 收藏管理
  - 收货地址管理
  - 店铺关注

constraints:
  - 需使用真实的后端应用
  - 支付使用模拟流程（点击支付后直接显示成功，不涉及真实支付）
  - 系统预置至少10个示例商品（含不同分类、规格、价格）
  - 用户只能查看自己的订单和收藏（RLS隔离）
