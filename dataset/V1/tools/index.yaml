version: "1.0"
name: "工具类应用评测样本集"
description: |
  工具类应用评测样本集,专注于评估AI生成工具类应用的能力。
  覆盖天气、计算器、待办事项、日历、秒表计时等常用工具类型。
  用于评测工具逻辑正确性、数据持久化、系统集成(通知/定位)等专项能力。

