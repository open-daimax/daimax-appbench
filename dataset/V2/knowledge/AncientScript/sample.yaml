version: "2.0"
dataset_version: "V2"
sample_id: AncientScript
title: 古文字识读学习
app_type: 知识学习
requires_backend: false
requires_auth: false
complexity: high
status: active
data_mode: "frontend_only"

navigation:
  type: bottom_tab
  tabs:
    - { name: "学习大厅", icon: "home", page: "学习大厅" }
    - { name: "字形库", icon: "grid", page: "字形库" }
    - { name: "临写练习", icon: "edit-3", page: "临写练习" }
    - { name: "测验", icon: "check-circle", page: "测验中心" }
    - { name: "我的", icon: "user", page: "我的进度" }

requirement: |
  实现一个古文字识读学习应用，帮助用户系统学习甲骨文、金文、篆书等古文字的字形演变与识读：

  【学习大厅（首页Tab）】
  1. 顶部Banner展示学习推荐或每日一字
  2. 学习进度概览：已学字数/总字数、当前等级、连续学习天数
  3. 推荐学习字组入口（如"基础象形字""常用会意字"）
  4. 每日挑战入口：每天一组随机识读测验
  5. 学习路径入口：按难度分级的系统学习路线

  【字形库（Tab）】
  6. 以网格展示古文字卡片，每张显示楷书字形、对应甲骨文字形缩略图、难度标签
  7. 支持按字组分类筛选（象形字/指事字/会意字/形声字）
  8. 支持按难度筛选（初级/中级/高级）
  9. 搜索功能：输入楷书查找对应古文字
  10. 系统内置至少20个古文字数据

  【字形详情页】
  11. 展示字形演变序列：甲骨文→金文→篆书→隶书→楷书（每种字体配图）
  12. 字义解说：该字的本义、引申义
  13. 构字分析：象形/指事/会意/形声的构字逻辑说明
  14. 相关字组：与该字相关的其他古文字（可跳转）
  15. 标记已掌握按钮
  16. 进入临写练习按钮

  【字组列表页】
  17. 展示某分类下的所有字形列表
  18. 每个字显示学习状态（未学/学习中/已掌握）
  19. 点击进入字形详情

  【临写练习（Tab）】
  20. 展示可练习的字形列表，优先推荐未掌握的字
  21. 点击某字进入临写界面

  【练习详情页（对照书写）】
  22. 左侧/上方显示目标古文字字形（甲骨文或篆书）
  23. 右侧/下方提供书写画板区域
  24. 支持笔画清除和重写
  25. 完成后可对比查看效果
  26. 练习完成计入学习进度

  【测验中心（Tab）】
  27. 展示可参加的测验列表（按字组分类）
  28. 每个测验显示题目数、预计时间、已完成状态

  【测验详情页（选择题）】
  29. 显示一个古文字字形图片，四个楷书选项供选择
  30. 选择后即时反馈正确/错误，错误时显示正确答案
  31. 测验结束后显示得分统计（正确率/用时/错题回顾）

  【学习路径页】
  32. 展示分级学习路线图：初级→中级→高级
  33. 每级包含若干字组，显示完成进度
  34. 未解锁的高级字组显示锁定状态
  35. 完成上一级可解锁下一级

  【我的进度（Tab）】
  36. 学习统计：已学字数、已掌握字数、测验正确率、连续天数
  37. 等级展示：当前等级和升级进度条
  38. 学习记录：最近学习的字形列表
  39. 错题本入口：查看测验中答错的题目
  40. 设置学习计划：每日目标字数设定

  【设置学习计划】
  41. 设置每日学习目标（如每天5字/10字/15字）
  42. 设置提醒时间
  43. 保存设置到本地

pages:
  - name: "学习大厅"
    level: L1
    description: "首页进度概览与推荐入口"
    entry_from: "底部Tab"

  - name: "字形库"
    level: L1
    description: "古文字网格列表与分类筛选"
    entry_from: "底部Tab"

  - name: "字形详情"
    level: L2
    description: "字形演变序列与构字分析"
    entry_from: "字形库/字组列表/学习大厅"

  - name: "字组列表"
    level: L2
    description: "某分类下所有字形列表及学习状态"
    entry_from: "字形库分类筛选/学习路径"

  - name: "临写练习"
    level: L1
    description: "可练习的字形列表"
    entry_from: "底部Tab"

  - name: "练习详情"
    level: L2
    description: "对照古文字进行书写练习"
    entry_from: "临写练习/字形详情"

  - name: "测验中心"
    level: L1
    description: "测验列表展示"
    entry_from: "底部Tab"

  - name: "测验详情"
    level: L2
    description: "选择题测验与即时反馈"
    entry_from: "测验中心/学习大厅每日挑战"

  - name: "学习路径"
    level: L2
    description: "分级学习路线图与解锁机制"
    entry_from: "学习大厅"

  - name: "我的进度"
    level: L1
    description: "学习统计与等级展示"
    entry_from: "底部Tab"

  - name: "开始临写"
    level: L3
    description: "对照书写界面（画板+目标字形）"
    entry_from: "练习详情"

  - name: "开始测验"
    level: L3
    description: "答题界面（字形图+四选项）"
    entry_from: "测验详情"

  - name: "查看字形演变动画"
    level: L3
    description: "观看从甲骨文到楷书的演变过程"
    entry_from: "字形详情"

  - name: "设置学习计划"
    level: L3
    description: "每日目标与提醒时间设置"
    entry_from: "我的进度"

  - name: "标记已掌握"
    level: L3
    description: "将字形标记为已掌握状态"
    entry_from: "字形详情"

  - name: "错题本"
    level: L2
    description: "测验答错的题目回顾"
    entry_from: "我的进度"

core_functions:
  - 学习大厅进度概览与推荐
  - 字形库网格浏览与分类/难度筛选
  - 字形详情展示（演变序列/字义/构字分析）
  - 字形搜索（楷书查古文字）
  - 临写练习（对照书写/清除/重写）
  - 识读测验（选择题/即时反馈/得分统计）
  - 学习路径（分级路线/解锁机制）
  - 标记已掌握与学习状态管理
  - 学习进度统计（字数/正确率/等级/天数）
  - 错题本回顾
  - 学习计划设置（每日目标/提醒）

constraints:
  - 纯前端应用，所有数据硬编码在前端
  - 学习进度、已掌握状态、测验记录存储在localStorage
  - 临写练习使用Canvas画板，不做AI识别，仅提供对照书写体验
  - 字形演变图片使用mock图片模拟不同字体阶段
  - |
    内置古文字数据至少包含：
    象形字：日、月、山、水、火、木、人、手、目、口
    指事字：上、下、本、末、刃
    会意字：休、林、森、明、从
    形声字：河、湖、铜、松、梅
  - |
    学习等级设定：
    初级（1-10字掌握）：古文字新手
    中级（11-15字掌握）：识读进阶者
    高级（16-20字掌握）：古文字达人
  - |
    测验规则：
    每组测验5-10题
    每题显示一个古文字图片，提供4个楷书选项
    选择后即时显示正确/错误
    完成后统计正确率
