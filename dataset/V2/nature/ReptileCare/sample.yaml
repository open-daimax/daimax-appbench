      - "温湿度提醒开关"
      - "喂食提醒开关"
      - "环境报警通知开关"
      - "默认温湿度目标"
      - "默认报警阈值"
      - "关于信息"

core_functions:
  - 用户注册与登录
  - 爬宠个体档案管理（添加/编辑/删除）
  - 温湿度记录与目标对比（自动状态判定+超限报警）
  - 环境监测仪表板（趋势曲线+报警阈值+环境评分）
  - 环境对比分析（多爬宠/多时间段对比图表+改善建议）
  - 喂食日历管理（日历视图+颜色标记+拒食记录）
  - 蜕皮追踪（记录质量+计算间隔）
  - 健康档案总览（体重+蜕皮+评分）
  - 疾病档案库（疾病百科+症状匹配诊断）
  - 疾病记录管理（患病历程+用药方案+康复进度追踪）
  - 繁殖管理（配对记录+孵化日程+后代追踪+繁殖统计）
  - 社区求助（发帖/评论/医生推荐）
  - 饲养记录时间轴（多类型+多维筛选）

constraints:
  - 需使用真实的后端应用
  - 社区数据和繁殖数据使用后端存储
  - 个体档案、温湿度、喂食等基础数据本地存储
  - 系统预置2个示例爬宠（豹纹守宫"小花"、玉米蛇"阿黄"）及其基础数据
  - 温湿度状态判定规则：实际值在目标范围内为正常，超出为偏高，低于为偏低
  - 报警规则：超出报警阈值（严于目标范围）触发红色警报
  - 蜕皮间隔自动计算：当前蜕皮日期与上次蜕皮日期的差值
  - 健康评分基于最近温湿度稳定性、体重变化趋势、蜕皮周期规律性综合计算
  - 喂食日历颜色规则：已喂(绿色)/计划喂食(蓝色)/过期未喂(灰色)
  - 症状匹配诊断：预置至少15种常见爬宠疾病及其症状特征
  - 疾病档案按类别分组：呼吸系统/消化系统/皮肤/骨骼/寄生虫
  - 繁殖状态流转：准备中→已交配→已产卵→已孵化
  - 社区帖子分类：求助/分享经验/医生推荐/器材交流
  - 提醒使用页面内状态标识，不依赖系统通知
  - 底部Tab导航最多包含5个入口：我的爬宠、饲养记录、喂食日历、健康档案、社区求助；设置页必须通过我的爬宠页的设置入口进入，不作为底部Tab
