version: "2.0"
dataset_version: "V2"
sample_id: PoetryWorkshop
title: 诗歌创作坊
app_type: 知识学习
requires_backend: true
requires_auth: true
complexity: high
status: active

navigation:
  type: bottom_tab
  tabs:
    - { name: "诗歌广场", icon: "book-open", page: "诗歌广场" }
    - { name: "我的诗集", icon: "library", page: "我的诗集" }
    - { name: "主题挑战", icon: "trophy", page: "主题挑战" }
    - { name: "朗诵", icon: "mic", page: "朗诵广场" }
    - { name: "我的", icon: "user", page: "个人中心" }

requirement: |
  实现一个诗歌创作与分享社区应用，支持诗歌创作、诗集管理、投稿交流、主题挑战和朗诵记录：

  【诗歌广场（首页Tab）】
  1. 展示社区投稿的诗歌列表，每首显示标题、作者昵称、首行预览、点赞数、标签
  2. 支持按标签筛选（现代诗、古体诗、散文诗、儿童诗）
  3. 支持按热度/最新排序切换
  4. 系统预置至少5首示例诗歌供广场展示

  【诗歌详情页】
  5. 完整展示诗歌正文、标题、作者、创作时间、标签
  6. 点赞按钮与点赞计数
  7. 评论区：展示评论列表，可发表评论
  8. 跳转作者主页入口

  【我的诗集（Tab）】
  9. 展示用户创建的诗集列表，每个诗集显示封面、名称、诗歌数量
  10. 支持新建诗集（名称+描述+封面选择）
  11. 无诗集时显示空状态提示

  【诗集详情页】
  12. 展示诗集内所有诗歌列表
  13. 支持从诗集中移除诗歌
  14. 编辑诗集信息（名称、描述）

  【创作新诗（编辑器）】
  15. 诗歌标题输入
  16. 正文编辑区（支持换行排版）
  17. 选择标签（现代诗/古体诗/散文诗/儿童诗）
  18. 保存草稿 / 发布到我的诗歌
  19. 已保存的诗歌可编辑修改

  【投稿到广场】
  20. 从我的诗歌中选择一首投稿到诗歌广场
  21. 投稿后诗歌出现在广场列表中
  22. 可撤回投稿

  【主题挑战（Tab）】
  23. 展示当前进行中的主题挑战列表（如"春日主题""离别主题"）
  24. 每个挑战显示主题名、截止时间、参与人数、奖励说明
  25. 系统预置至少2个挑战活动

  【挑战详情页】
  26. 展示挑战规则、主题要求、截止日期
  27. 展示已参与作品列表
  28. 参加挑战入口（跳转创作页，自动关联挑战）

  【朗诵广场（Tab）】
  29. 展示社区朗诵录音列表，每条显示诗歌标题、朗诵者、时长、播放数
  30. 点击可播放朗诵录音

  【录制朗诵】
  31. 选择要朗诵的诗歌（从我的诗歌或广场诗歌选择）
  32. 录音界面：显示诗歌正文供朗诵参考，录制/暂停/完成按钮
  33. 录制完成后可预听、重录或发布

  【朗诵详情页】
  34. 播放朗诵录音，同步显示诗歌正文
  35. 显示朗诵者信息、播放次数

  【个人中心（Tab）】
  36. 显示用户头像、昵称、创作统计（诗歌数/诗集数/朗诵数）
  37. 我的诗歌入口：查看所有创作的诗歌
  38. 我的投稿入口：查看已投稿到广场的诗歌
  39. 我的朗诵入口：查看录制的朗诵
  40. 退出登录

  【他人主页】
  41. 展示他人的公开诗歌列表和基本信息
  42. 可查看其投稿到广场的作品

pages:
  - name: "注册登录"
    level: L3
    description: "用户注册与登录页面"
    entry_from: "应用启动/个人中心"

  - name: "诗歌广场"
    level: L1
    description: "社区投稿诗歌的信息流展示"
    entry_from: "底部Tab"

  - name: "诗歌详情"
    level: L2
    description: "诗歌完整内容与互动（点赞/评论）"
    entry_from: "诗歌广场/诗集详情/朗诵详情"

  - name: "我的诗集"
    level: L1
    description: "用户诗集列表管理"
    entry_from: "底部Tab"

  - name: "诗集详情"
    level: L2
    description: "诗集内诗歌列表与编辑"
    entry_from: "我的诗集"

  - name: "创作新诗"
    level: L3
    description: "诗歌创作编辑器（标题/正文/标签）"
    entry_from: "我的诗集/个人中心/挑战详情"

  - name: "投稿到广场"
    level: L3
    description: "选择诗歌投稿到诗歌广场"
    entry_from: "我的诗歌列表"

  - name: "主题挑战"
    level: L1
    description: "挑战活动列表展示"
    entry_from: "底部Tab"

  - name: "挑战详情"
    level: L2
    description: "挑战规则与参与作品展示"
    entry_from: "主题挑战"

  - name: "参加挑战"
    level: L3
    description: "关联挑战进行创作"
    entry_from: "挑战详情"

  - name: "朗诵广场"
    level: L1
    description: "社区朗诵录音列表与播放"
    entry_from: "底部Tab"

  - name: "录制朗诵"
    level: L3
    description: "选择诗歌并录制朗诵音频"
    entry_from: "朗诵广场/诗歌详情"

  - name: "朗诵详情"
    level: L2
    description: "播放朗诵并同步展示诗歌正文"
    entry_from: "朗诵广场"

  - name: "个人中心"
    level: L1
    description: "用户信息与创作数据统计"
    entry_from: "底部Tab"

  - name: "他人主页"
    level: L2
    description: "查看他人公开诗歌与基本信息"
    entry_from: "诗歌详情/朗诵详情"

  - name: "编辑诗集"
    level: L3
    description: "编辑诗集名称和描述"
    entry_from: "诗集详情"

core_functions:
  - 用户注册与登录
  - 诗歌广场信息流（标签筛选/排序）
  - 诗歌详情展示与点赞评论
  - 诗集创建与管理（新建/编辑/删除诗歌）
  - 诗歌创作编辑器（标题/正文/标签/草稿）
  - 投稿到广场与撤回投稿
  - 主题挑战浏览与参加
  - 朗诵录制与发布（录音/预听/重录）
  - 朗诵广场播放
  - 个人中心统计与作品管理
  - 他人主页浏览

constraints:
  - 需使用真实的后端应用
  - 朗诵录音采用模拟录制（界面展示录制流程，实际音频使用本地模拟数据）
  - 系统预置至少5首示例诗歌供广场展示（含不同标签类型）
  - 系统预置至少2个主题挑战活动（含参与人数和截止时间）
  - 用户只能编辑和删除自己创作的诗歌（RLS隔离）
  - 投稿到广场后，他人可在广场看到该诗歌
