version: "2.0"
dataset_version: "v1"
sample_id: BudgetTracker
title: 记账/预算追踪器
app_type: 金融
requires_backend: false
requires_auth: true
complexity: medium

data_source:
  type: localStorage
  description: "纯前端应用，账本、交易记录、预算设置等数据存储在localStorage中，用户自行创建CRUD数据"

requirement: |
  实现一个完整的个人记账和预算追踪应用，支持多账本管理、收支记录、预算追踪与统计分析。支持用户注册和登录，登录后进入应用主界面。

  【导航结构】
  底部Tab导航共4个入口：明细(主页)/统计/账本/我的。记账、预算设置、账本编辑等为二级页面。

  【登录/注册页】
  1. 支持用户注册和登录，提供邮箱+密码方式
  2. 登录成功后进入收支概览主页

  【主页-收支概览】
  3. 顶部账本选择器：下拉选择当前账本（默认"日常账本"）
  4. 当月收支卡片：总收入(绿色)+总支出(红色)+结余(蓝色)
  5. 最近交易列表：按时间倒序展示最近交易记录
  6. 每条记录显示：分类图标+分类名+备注+金额（收入绿色/支出红色）
  7. 底部浮动"+"按钮：点击进入记账页
  8. 日期范围切换：可查看本月/上月/自定义范围
  9. 搜索/筛选：支持按分类、收支类型、关键字筛选交易记录

  【记账页】
  10. 收入/支出切换Tab
  11. 金额输入：数字键盘，支持小数点（最多2位小数）
  12. 分类选择网格：
     - 支出分类：餐饮🍔/交通🚗/购物🛒/娱乐🎮/居住🏠/医疗💊/教育📚/其他
     - 收入分类：工资💰/奖金🎁/兼职💼/理财📈/其他
  13. 备注输入框（可选）
  14. 日期选择器（默认今天）
  15. 账本选择（默认当前账本）
  16. 保存按钮→保存后返回主页，列表顶部出现新记录
  17. 编辑已有交易记录（金额/分类/备注/日期），删除交易记录

  【统计报表页】
  18. 月度收支柱状图：横轴为日期（1-31日），纵轴为金额，收入向上/支出向下
  19. 分类饼图：展示支出各分类占比（餐饮30%/交通20%等）
  20. 月度趋势：近6个月的收入/支出折线图
  21. 月度预算设置：设定每月预算金额，显示已用/剩余进度条，超预算红色警告

  【账本管理页】
  22. 账本列表：名称+本月支出+记录数
  23. 新建账本：输入名称+选择图标/颜色
  24. 编辑账本名称
  25. 删除账本（需确认，删除后其下所有记录也删除）
  26. 默认"日常账本"不可删除
  27. 账本切换后各账本数据相互隔离

  【我的/设置页(个人中心)】
  28. 用户信息展示(头像/昵称/邮箱)
  29. 账本管理入口、预算设置入口
  30. 货币单位与主题偏好设置
  31. 退出登录

pages:
  - name: "登录/注册页"
    description: "用户注册与登录入口"
    features:
      - "支持用户注册和登录(邮箱+密码)"
      - "登录成功进入收支概览主页"

  - name: "主页-收支概览"
    description: "当月收支总览和最近交易"
    features:
      - "账本选择器"
      - "当月收支卡片(收入/支出/结余)"
      - "最近交易列表"
      - "快速记账按钮"
      - "日期范围切换与筛选"

  - name: "记账页"
    description: "新增/编辑收入或支出记录"
    features:
      - "收入/支出切换"
      - "金额输入(数字键盘,最多2位小数)"
      - "分类选择网格"
      - "备注和日期"
      - "账本选择、编辑与删除记录"

  - name: "统计报表"
    description: "收支数据可视化分析"
    features:
      - "月度收支柱状图"
      - "分类饼图"
      - "月度趋势折线图"
      - "预算设置、进度与超支警告"

  - name: "账本管理"
    description: "多账本创建和管理"
    features:
      - "账本列表"
      - "新建/编辑/删除账本"
      - "默认账本不可删"
      - "账本数据隔离"

  - name: "我的/设置页(个人中心)"
    description: "用户信息与偏好设置"
    features:
      - "用户信息展示(头像/昵称/邮箱)"
      - "账本管理、预算设置入口"
      - "货币单位与主题设置"
      - "退出登录"

core_functions:
  - 用户注册与登录
  - 多账本管理（创建/编辑/切换/删除+数据隔离）
  - 记账（收入/支出+分类+备注）与记录编辑删除
  - 交易筛选（分类/类型/关键字）
  - 收支统计（柱状图/饼图/趋势）
  - 月度预算追踪与超支警告
  - 个人中心与偏好设置

constraints:
  - 纯前端应用，账本与交易数据存localStorage
  - 金额最多2位小数
  - 默认"日常账本"不可删除
  - 分类为预设固定值，不可自定义
  - 支持用户注册和登录

notes: "测试个人财务管理场景：注册登录、多账本切换与隔离、记账CRUD流程、交易筛选、统计图表渲染、预算追踪、个人中心设置。重点验证多账本数据隔离、收支计算准确性、图表与实际数据一致性。"
