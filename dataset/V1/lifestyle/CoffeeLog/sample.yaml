version: "2.0"
sample_id: CoffeeLog
title: 咖啡品鉴记录
app_type: 生活
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的咖啡品鉴记录应用，帮助用户记录、管理、统计与回顾每次喝咖啡的体验，并管理自己的咖啡豆。

  【底部Tab导航】
  登录后应用底部固定4个Tab：品鉴、咖啡豆、统计、我的，点击可在四个主页面间切换，当前Tab高亮。

  【登录注册页】
  1. 支持用户注册和登录
  2. 登录后跳转品鉴列表页

  【品鉴列表页(主页Tab)】
  3. 按时间倒序展示我的咖啡品鉴记录
  4. 每条记录卡片：咖啡名称、产地国旗emoji、烘焙度标签(浅/中/深)、评分(1-5)、日期
  5. 顶部搜索框：按咖啡名称关键词搜索记录
  6. 支持按烘焙度筛选：全部/浅烘/中烘/深烘
  7. 底部浮动"+"按钮：新建品鉴记录

  【新建品鉴记录页】
  8. 咖啡名称输入（必填，如"埃塞俄比亚 耶加雪菲"）
  9. 产地选择：下拉选项（埃塞俄比亚🇪🇹/哥伦比亚🇨🇴/巴西🇧🇷/肯尼亚🇰🇪/危地马拉🇬🇹/其他）
  10. 烘焙度选择：浅烘/中烘/深烘
  11. 冲泡方式选择：手冲/意式/冷萃/法压/其他
  12. 评分：1-5颗星
  13. 风味标签多选（最多选3个）：花果香/坚果/巧克力/柑橘/莓果/焦糖/烟熏/草本
  14. 口感笔记：多行文本（如"酸质明亮，有柑橘和蜂蜜的甜感"）
  15. 保存 → 返回列表

  【记录详情页】
  16. 咖啡名称+产地+评分
  17. 烘焙度+冲泡方式
  18. 风味标签展示（彩色标签）
  19. 口感笔记
  20. 编辑/删除按钮（删除带确认弹窗）

  【咖啡豆管理页(Tab)】
  21. 展示我添加的咖啡豆列表（名称、产地、烘焙度）
  22. 底部"+"按钮：新增咖啡豆（名称、产地、烘焙度）
  23. 支持删除咖啡豆（带确认）
  24. 无咖啡豆时显示空状态提示

  【统计页(Tab)】
  25. 累计品鉴杯数
  26. 最爱产地Top3（按产地统计数量）
  27. 最爱烘焙度分布饼图
  28. 风味偏好雷达图（各风味标签出现频率）
  29. 平均评分

  【我的页(Tab)】
  30. 展示当前登录用户账号信息
  31. 展示品鉴总杯数等简单概览
  32. 退出登录按钮（带二次确认）
  33. 关于应用信息

core_functions:
  - 用户注册登录
  - 底部Tab导航(品鉴/咖啡豆/统计/我的)
  - 品鉴列表展示(时间倒序+产地emoji+烘焙度标签+评分)
  - 新建品鉴记录(名称/产地/烘焙度/冲泡方式/评分/风味标签/笔记)
  - 查看记录详情(完整信息+风味彩色标签)
  - 编辑和删除记录
  - 按名称搜索记录
  - 按烘焙度筛选(全部/浅烘/中烘/深烘)
  - 咖啡豆管理(新增/列表/删除/空状态)
  - 统计页(杯数/最爱产地Top3/烘焙度饼图/风味雷达图/平均评分)
  - 我的页(账号信息/概览/退出登录)

constraints: "用户数据完全自产；风味标签为预设固定选项（8种）；产地为预设选项（6个）；RLS隔离用户只能看到自己的记录和咖啡豆"

notes: "后端CRUD样本，用户自产数据。重点验证登录注册、底部Tab导航、品鉴记录CRUD完整性、多选风味标签、搜索与按烘焙度筛选、咖啡豆管理、统计聚合、我的页与RLS权限隔离。"
