version: "2.0"
sample_id: Snake
title: 贪吃蛇
app_type: 游戏
game_category: 经典类
dataset_version: "v2"
status: active

requirement: |
  实现一个功能完整的贪吃蛇游戏应用，采用方向按钮控制（禁止手势），具备完整的"主菜单→游戏→结束→查看成绩→重新开始"闭环体验，包含主菜单、游戏、设置、排行榜等页面。

  【页面结构】
  1. 主菜单页：
     - 显示游戏标题"贪吃蛇"
     - 四个按钮：[开始游戏] [排行榜] [设置] [操作说明]
     - 底部显示当前最高分（首次显示"暂无最高分"或 0）
     - 点击[开始游戏]进入游戏页；[排行榜]进入排行榜页；[设置]进入设置页；[操作说明]弹出方向按钮说明

  2. 游戏页面：
     - 游戏区域：20×20网格，四周边界为墙壁
     - 顶部信息栏：当前分数、当前蛇长度、[暂停]按钮
     - 方向按钮区（屏幕下方十字布局）：上方[上]，中间[左][右]，下方[下]
     - 食物以醒目颜色/图标显示在网格空白处

  3. 设置页：
     - 音效开关（吃食物/结束音效）
     - 初始速度选择（慢/中/快）
     - 穿墙模式开关（开启后撞墙从对侧穿出，默认关闭）
     - 网格线显示开关
     - 返回主菜单按钮

  4. 排行榜页：
     - 标题"排行榜"
     - Top 10 历史成绩列表：每行显示"排名 | 分数 | 蛇长度 | 日期"
     - 空状态：无记录时显示"暂无记录"
     - 返回主菜单按钮

  5. 暂停面板：
     - 点击[暂停]后蛇停止移动，弹出[继续][重新开始][返回主菜单]选项

  6. 游戏结束弹窗：
     - 显示"游戏结束"文字、本次得分、蛇最终长度
     - 若刷新最高分则显示"新纪录！"提示
     - 两个按钮：[重新开始] [返回主菜单]

  【游戏规则】
  - 蛇初始长度3格，从网格中心开始，默认向右移动
  - 食物随机出现在空白格子（不与蛇身重叠）
  - 蛇头碰到食物后：食物消失，蛇身增长1格，分数+10，新食物随机生成
  - 蛇按当前速度持续自动移动

  【得分规则】
  - 每吃一个食物 +10分

  【速度规则】
  - 初始速度由设置页决定
  - 每吃5个食物，移动速度加快一级，逐级递增难度

  【控制方式（仅按钮，禁止手势）】
  - 方向按钮十字布局：上方[上]，中间一排[左][右]，下方[下]
  - 点击方向按钮改变蛇的移动方向
  - 不能180度掉头（如蛇向右移动时，点击[左]不生效）

  【游戏结束条件】
  - 蛇头撞到墙壁（网格边界，穿墙模式关闭时）→ 游戏结束
  - 蛇头撞到自身（蛇身任意一格）→ 游戏结束

  【视觉与音效反馈】
  - 蛇头与蛇身颜色区分，食物有醒目颜色
  - 吃到食物时有短促音效与食物闪现动画
  - 游戏结束时有结束音效
  - 加速时可有轻微视觉提示（如速度等级显示）
  - 音效受设置页开关控制

  【数据持久化】
  - 最高分与 Top 10 排行榜使用 localStorage 本地持久化
  - 设置项（音效/初始速度/穿墙/网格线）本地持久化
  - 游戏结束时若成绩进入前10名则写入排行榜

core_functions:
  - 20×20 网格游戏区域渲染（含边界墙壁）
  - 蛇的渲染与自动移动
  - 方向按钮控制（十字布局：上/下/左/右）
  - 180度掉头禁止逻辑
  - 食物随机生成（不与蛇身重叠）
  - 食物碰撞检测与蛇身增长
  - 得分计算（每个食物+10分）
  - 速度递增（每5个食物加速一级）
  - 墙壁碰撞检测（游戏结束）
  - 自身碰撞检测（游戏结束）
  - 暂停面板（继续/重新开始/返回主菜单）
  - 游戏结束弹窗（得分/长度/新纪录）
  - 主菜单导航（开始/排行榜/设置/操作说明）
  - 设置页（音效/初始速度/穿墙/网格线）
  - 排行榜Top10记录与展示
  - 音效与动画反馈（吃食物/结束）
  - 最高分与排行榜本地持久化(localStorage)

constraints:
  - 纯单机游戏，无需网络
  - 无需用户登录
  - 仅使用按钮控制，禁止滑动/拖拽/手势操作
  - 最高分与排行榜使用localStorage本地持久化
  - 游戏区域固定为20×20网格
  - 方向按钮为十字布局

notes: "V2版本：扩展为完整游戏应用，新增设置页、排行榜页、暂停面板与穿墙模式等，统一十字布局按钮控制（可E2E自动化测试）。重点验证方向控制、碰撞检测（墙壁+自身）、180度掉头禁止、排行榜与最高分持久化。"
