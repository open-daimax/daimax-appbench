version: "2.0"
sample_id: Calculator
title: 计算器
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个标准计算器应用：

  【计算器主页】
  1. 顶部显示屏：显示当前输入的数字和计算结果，右对齐，大字体
  2. 数字按钮区：0-9 共10个数字按钮，网格布局
  3. 运算符按钮：+(加) -(减) ×(乘) ÷(除)
  4. 功能按钮：
     - C(清除所有)：重置为0
     - ←(退格)：删除最后一位
     - .(小数点)
     - =(等号)：计算结果
     - %(百分号)：当前值÷100
     - +/-(正负切换)
  5. 连续计算：计算结果可直接参与下一次运算
  6. 除以0：显示"错误"提示
  7. 结果超长：使用科学计数法显示

  【历史记录页】
  8. 最近10条计算记录：格式"12 + 8 = 20"
  9. 点击历史记录可将结果填入显示屏
  10. "清除历史"按钮

core_functions:
  - 数字输入和显示(0-9、小数点)
  - 四则运算(加减乘除)
  - 功能键(清除/退格/百分号/正负切换)
  - 连续计算
  - 除以零错误处理
  - 历史记录(最近10条/点击复用/清除)

constraints: "纯前端计算，本地存储历史记录；计算精度使用浮点数（显示时最多保留8位小数）"

notes: "纯前端计算器，无数据需求。重点验证四则运算正确性、连续计算逻辑、边界输入处理(除零/超长)、历史记录功能。"
