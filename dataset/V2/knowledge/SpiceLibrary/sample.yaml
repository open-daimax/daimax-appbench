version: "2.0"
dataset_version: "V2"
sample_id: SpiceLibrary
title: 香料百科与搭配
app_type: 知识学习
requires_backend: false
requires_auth: false
complexity: high
status: active
data_mode: "frontend_only"

navigation:
  type: bottom_tab
  tabs:
    - { name: "香料百科", icon: "leaf", page: "香料百科" }
    - { name: "搭配方案", icon: "layers", page: "搭配方案" }
    - { name: "菜谱关联", icon: "book", page: "菜谱关联" }
    - { name: "产地溯源", icon: "map-pin", page: "产地溯源" }
    - { name: "收藏", icon: "heart", page: "我的收藏" }

requirement: |
  实现一个香料知识百科与搭配推荐应用，帮助用户了解各类香料特性、搭配规则及关联菜谱：

  【香料百科（首页Tab）】
  1. 以卡片网格展示香料列表，每个卡片显示香料图片、名称、分类标签（辛香料/芳香料/复合香料/药食同源）
  2. 顶部搜索栏：输入关键词搜索香料
  3. 分类筛选标签（辛香料/芳香料/复合香料/药食同源）
  4. 系统内置至少12种香料数据

  【香料详情页】
  5. 香料图片、名称、拉丁学名
  6. 口感描述：辛度/香度/苦度雷达图或数值展示
  7. 最佳搭配推荐：列出3-5种推荐搭配的食材或其他香料
  8. 使用禁忌：列出不宜搭配的食材或注意事项
  9. 产地信息：原产地标签，点击可跳转产地详情
  10. 收藏按钮：收藏到我的笔记

  【搭配方案（Tab）】
  11. 展示经典搭配方案列表，每个方案显示名称、包含的香料组合图标、适用菜系标签
  12. 支持按菜系筛选（中式/西式/东南亚/印度）
  13. 系统内置至少8种经典搭配方案

  【搭配详情页】
  14. 展示搭配方案的完整信息：名称、描述、包含的香料列表（可点击跳转香料详情）
  15. 适用场景说明（如：炖肉/烘焙/腌制）
  16. 用量比例建议
  17. 关联菜谱列表

  【菜谱关联（Tab）】
  18. 展示与香料关联的菜谱列表，每个菜谱显示图片、名称、主要用到的香料标签
  19. 支持按香料类型筛选菜谱
  20. 系统内置至少6个菜谱

  【菜谱详情页】
  21. 菜谱图片、名称、简介
  22. 所需香料清单（每种香料可点击跳转详情）
  23. 用量说明和使用步骤
  24. 烹饪小贴士

  【产地溯源（Tab）】
  25. 以地图标注或列表展示香料产地，每个产地显示地区名称、代表香料、风土特色
  26. 系统内置至少5个产地信息

  【产地详情页】
  27. 产地地区描述、气候特点
  28. 该产地代表香料列表（可跳转香料详情）
  29. 风土故事或文化背景说明

  【搜索结果页】
  30. 展示搜索匹配的香料列表
  31. 无结果时显示空状态提示

  【创建自定义搭配】
  32. 用户可从香料库中选择多种香料创建个人搭配方案
  33. 输入搭配名称、适用场景描述
  34. 保存到本地收藏

  【我的收藏（Tab）】
  35. 展示用户收藏的香料和自定义搭配方案
  36. 支持记录使用心得（文字笔记）
  37. 可取消收藏
  38. 无收藏时显示空状态提示

  【编辑使用心得】
  39. 为收藏的香料或搭配方案添加个人使用心得
  40. 支持编辑和删除心得

  【设置口味偏好】
  41. 设置个人口味偏好（辣度接受度/香料偏好/忌口项）
  42. 偏好信息用于搭配推荐排序优化

pages:
  - name: "香料百科"
    level: L1
    description: "香料网格列表与分类筛选"
    entry_from: "底部Tab"

  - name: "香料详情"
    level: L2
    description: "香料口感、搭配、禁忌的完整信息"
    entry_from: "香料百科/搭配详情/菜谱详情/产地详情"

  - name: "搭配方案"
    level: L1
    description: "经典香料搭配方案列表"
    entry_from: "底部Tab"

  - name: "搭配详情"
    level: L2
    description: "搭配方案完整信息与关联菜谱"
    entry_from: "搭配方案/我的收藏"

  - name: "菜谱关联"
    level: L1
    description: "与香料相关的菜谱列表"
    entry_from: "底部Tab"

  - name: "菜谱详情"
    level: L2
    description: "菜谱用料、步骤与香料清单"
    entry_from: "菜谱关联/搭配详情"

  - name: "产地溯源"
    level: L1
    description: "香料产地地图或列表展示"
    entry_from: "底部Tab"

  - name: "产地详情"
    level: L2
    description: "产地风土特色与代表香料"
    entry_from: "产地溯源/香料详情"

  - name: "搜索结果"
    level: L2
    description: "关键词搜索匹配的香料列表"
    entry_from: "香料百科搜索栏"

  - name: "我的收藏"
    level: L1
    description: "收藏的香料与自定义搭配方案"
    entry_from: "底部Tab"

  - name: "搜索香料"
    level: L3
    description: "输入关键词搜索香料库"
    entry_from: "香料百科顶部搜索栏"

  - name: "创建自定义搭配"
    level: L3
    description: "选择香料组合创建个人搭配方案"
    entry_from: "我的收藏/搭配方案"

  - name: "收藏到笔记"
    level: L3
    description: "将香料或搭配方案收藏到个人笔记"
    entry_from: "香料详情/搭配详情"

  - name: "编辑使用心得"
    level: L3
    description: "为收藏项添加或编辑使用心得"
    entry_from: "我的收藏"

  - name: "设置口味偏好"
    level: L3
    description: "设置辣度接受度/香料偏好/忌口项"
    entry_from: "我的收藏/设置入口"

core_functions:
  - 香料百科网格浏览与分类筛选（辛香料/芳香料/复合香料/药食同源）
  - 香料详情展示（口感/搭配/禁忌/产地）
  - 关键词搜索香料
  - 经典搭配方案浏览与菜系筛选
  - 搭配详情（香料组合/用量比例/适用场景）
  - 菜谱关联与详情展示
  - 产地溯源与风土故事
  - 创建自定义搭配方案
  - 收藏管理（香料/搭配方案）
  - 使用心得记录与编辑
  - 口味偏好设置

constraints:
  - 纯前端应用，所有数据硬编码在前端
  - 收藏和自定义搭配方案存储在localStorage
  - 口味偏好存储在localStorage
  - |
    内置香料数据至少包含：
    辛香料：花椒、八角、桂皮、丁香、白胡椒
    芳香料：迷迭香、百里香、薄荷、罗勒、月桂叶
    复合香料：五香粉、咖喱粉、十三香
    药食同源：肉桂、砂仁、草果
  - |
    内置搭配方案至少包含：
    卤肉香料包（八角+桂皮+花椒+丁香）
    意式烤鸡（迷迭香+百里香+黑胡椒）
    印度咖喱底（咖喱粉+丁香+肉桂+小茴香）
    东南亚冬阴功（香茅+南姜+柠檬叶+辣椒）
    中式红烧（八角+桂皮+花椒+冰糖）
    地中海烤蔬菜（迷迭香+百里香+牛至+橄榄油）
    日式七味粉（辣椒+花椒+芝麻+陈皮+紫苏+海苔+姜）
    法式香草束（百里香+月桂叶+欧芹+迷迭香）
