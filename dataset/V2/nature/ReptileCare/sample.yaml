    entry_from: "底部Tab-我的爬宠"
    description: "爬宠个体列表主页"
    features:
      - "个体卡片列表（照片+昵称+品种+年龄+体重）"
      - "添加个体入口"
      - "预置示例爬宠"
      - "设置入口"

  - name: "个体详情"
    level: "L2"
    entry_from: "我的爬宠-点击个体卡片"
    description: "单个爬宠完整信息"
    features:
      - "爬宠大图+基本信息"
      - "环境状态（温湿度对比）"
      - "最近喂食摘要"
      - "蜕皮记录摘要"
