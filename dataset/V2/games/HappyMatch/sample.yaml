version: "2.0"
sample_id: HappyMatch
title: 开心消消乐
app_type: 游戏
game_category: 消除类
dataset_version: "v2"
status: active

requirement: |
  实现一个功能完整的三消游戏应用，采用"点击选中→点击相邻交换"的按钮式交互（禁止拖拽手势），具备完整的"主菜单→关卡→游戏→结算→下一关"闭环体验，包含主菜单、关卡选择、游戏、设置、排行榜等页面。

  【页面结构】
  1. 主菜单页：
     - 游戏标题"开心消消乐"与装饰
     - 四个按钮：[开始游戏] [排行榜] [设置] [玩法说明]
     - 底部显示已解锁最高关卡与历史最高分
     - 点击[开始游戏]进入关卡选择页

  2. 关卡选择页：
     - 关卡列表（至少 5 关），已通过关卡显示星级，未解锁关卡显示锁定
     - 点击已解锁关卡进入对应游戏关卡
     - 返回主菜单按钮

  3. 游戏页面：
     - 顶部信息栏：当前关卡编号、关卡目标（如"消除 20 个红色动物"）、当前得分、剩余步数
     - 8×8游戏棋盘，随机分布 5 种不同颜色/造型的动物图标
     - [暂停]按钮：弹出[继续][重新开始][返回关卡选择]面板

  4. 设置页：
     - 音效开关（消除/交换音效）
     - 背景音乐开关
     - 动画速度选择（普通/快速）
     - 返回主菜单按钮

  5. 排行榜页：
     - 标题"排行榜"
     - Top 10 历史最高分列表：每行显示"排名 | 分数 | 通关关卡 | 日期"
     - 空状态：无记录时显示"暂无记录"
     - 返回主菜单按钮

  6. 关卡结算弹窗：
     - 胜利：显示"关卡通过"、本关得分、获得星级，按钮[下一关][重玩][返回关卡选择]
     - 失败：显示"步数用完，未达成目标"，按钮[重玩][返回关卡选择]

  【游戏规则】
  - 棋盘上每格随机放置 5 种动物之一
  - 玩家点击一个动物将其选中（高亮），再点击相邻（上下左右）动物完成交换
  - 交换后若横向或纵向形成 3 个及以上相同动物则消除；否则两个动物短暂交换后自动返回原位（无效交换，不扣步数）
  - 有效交换扣减 1 步
  - 消除后上方动物下落填充空位，顶部生成新动物补充
  - 下落填充后若再次形成 3 连，则连锁消除（连击）

  【得分规则】
  - 每消除 1 个动物 +基础分
  - 一次操作消除越多（4连/5连/连锁连击）得分越高，有连击倍率加成

  【特效动物】
  - 一线连续消除 4 个：在交换位置生成直线特效动物，激活可消除整行或整列
  - 一线连续消除 5 个：生成魔力鸟特效动物，激活可消除棋盘上所有同色动物

  【关卡与胜负】
  - 内置至少 5 个关卡，目标逐关提升（消除数量增加或步数减少）
  - 胜利条件：在步数用完前达成关卡目标
  - 失败条件：步数用完仍未达成目标
  - 通关后解锁下一关，可在关卡选择页进入

  【视觉与音效反馈】
  - 选中动物有高亮/放大提示
  - 消除时动物有闪烁与消失动画，伴随消除音效
  - 连锁连击时有连击提示文字与递进音效
  - 特效动物有独特外观与激活特效动画
  - 音效/背景音乐受设置页开关控制

  【数据持久化】
  - 关卡解锁进度、星级、最高分与 Top 10 排行榜使用 localStorage 本地持久化
  - 设置项（音效/音乐/动画速度）本地持久化

core_functions:
  - 8×8 游戏棋盘渲染与初始化
  - 点击选中并交换相邻动物（按钮式交互）
  - 无效交换自动回退且不扣步数
  - 三消检测与消除动画
  - 动物下落填充与新动物生成
  - 连锁连击检测与倍率加分
  - 关卡目标跟踪(得分/消除数量/剩余步数)
  - 特效动物生成(四连直线特效/五连魔力鸟)与激活
  - 关卡胜负判定与星级评定
  - 关卡选择与解锁进度
  - 主菜单导航（开始/排行榜/设置/玩法说明）
  - 设置页（音效/音乐/动画速度）
  - 排行榜Top10记录与展示
  - 关卡进度/最高分/排行榜本地持久化(localStorage)

constraints:
  - 内置 ≥5 个关卡配置(目标逐步提升)
  - 纯单机游戏，无需网络
  - 无需用户登录
  - 仅使用点击/按钮控制，禁止滑动/拖拽/手势操作
  - 使用本地资源或色块表示动物
  - 关卡进度与最高分使用localStorage本地持久化

notes: "V2版本：改为点击选中交换的按钮式交互（可E2E自动化测试），扩展为完整游戏应用，新增主菜单、关卡选择、设置、排行榜与结算弹窗。重点验证棋盘状态管理、消除与连锁算法、关卡配置、特效动物、进度持久化。"
