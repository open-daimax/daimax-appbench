version: "2.0"
sample_id: FoodOrder
title: 外卖点餐
app_type: 餐饮
dataset_version: "v1"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个完整的外卖点餐应用，用户可浏览餐厅菜单、搜索筛选、加入购物车、下单、跟踪订单、评价与收藏。支持用户注册和登录，登录后进入应用主界面。

  【导航结构】
  底部Tab导航共4个入口：首页(餐厅列表)/订单/收藏/我的。菜单、购物车、订单确认、订单详情等为二级页面。

  【登录/注册页】
  1. 支持用户注册和登录，提供邮箱+密码方式
  2. 登录成功后进入首页餐厅列表

  【首页-餐厅列表】
  3. 展示5家预置餐厅（中餐/西餐/日料/快餐/甜品）
  4. 每家显示：名称、评分(4.0-5.0)、配送时间(20-45分钟)、封面图、菜系分类
  5. 顶部搜索框：按餐厅名或菜品名搜索
  6. 筛选/排序：按评分、配送时间、菜系分类筛选排序
  7. 点击餐厅进入菜单页

  【菜单页】
  8. 选中餐厅后展示分类菜品（主食/小吃/饮品/套餐）
  9. 每道菜显示：图片、名称、价格、月销量
  10. 点击菜品旁的"+"按钮添加到购物车
  11. 底部悬浮购物车入口，显示已选数量和总价
  12. 餐厅收藏按钮

  【购物车页】
  13. 已选菜品列表，每项显示名称、单价、数量
  14. 数量加减按钮（范围1-99），减至0移除
  15. 小计金额、配送费(固定5元)、总计金额
  16. 清空购物车按钮
  17. 去下单按钮

  【订单确认页】
  18. 配送地址(预填默认地址，可修改)
  19. 备注输入框
  20. 支付方式选择(微信支付/支付宝，模拟)
  21. 确认下单按钮

  【订单列表页】
  22. 历史订单列表，每条显示：餐厅名、总价、下单时间、订单状态
  23. 订单状态：待接单/配送中/已完成
  24. 点击订单查看订单详情(菜品明细、金额、地址、状态)
  25. 已完成订单可对餐厅发表评价(评分+文字)，可再来一单

  【我的收藏页】
  26. 已收藏餐厅列表
  27. 点击进入菜单，支持取消收藏

  【我的/个人中心页】
  28. 用户信息展示(头像/昵称/邮箱)
  29. 收货地址管理(增改删)
  30. 我的订单、我的收藏入口
  31. 退出登录

core_functions:
  - 用户注册与登录
  - 餐厅列表浏览(5家餐厅)与搜索筛选排序
  - 分类菜单展示(主食/小吃/饮品/套餐)
  - 购物车管理(添加/修改数量/清空)
  - 价格计算(小计+配送费=总计)
  - 下单流程(地址/备注/支付方式)
  - 订单列表、订单详情与状态展示
  - 订单评价与再来一单
  - 餐厅收藏与取消收藏
  - 个人中心与地址管理

constraints: |
  支持用户注册和登录。
  餐厅和菜品为预置种子数据，订单、收藏、地址等用户数据存储在后端。
  配送费固定5元。
  单个菜品数量范围1-99。
  购物车清空后显示空状态引导。
  内置数据：
  - 中餐馆：宫保鸡丁(28元)、麻婆豆腐(22元)、鱼香肉丝(26元)、米饭(3元)、可乐(5元)
  - 西餐厅：牛排(88元)、意面(42元)、沙拉(28元)、面包(12元)、红酒(68元)
  - 日料店：寿司拼盘(58元)、拉面(35元)、天妇罗(32元)、味噌汤(12元)、抹茶(18元)
  - 快餐店：汉堡(22元)、薯条(12元)、炸鸡(18元)、套餐A(35元)、可乐(6元)
  - 甜品店：提拉米苏(28元)、芝士蛋糕(32元)、马卡龙(18元)、奶茶(15元)、冰淇淋(12元)

notes: "后端CRUD外卖点餐应用。重点验证注册登录、餐厅搜索筛选、菜品选购、购物车管理、价格计算、下单流程、订单详情与状态、订单评价、收藏管理、个人中心地址管理等功能。"
