version: "2.0"
sample_id: LotteryWheel
title: 随机抽奖转盘
app_type: 工具
dataset_version: "v2"
requires_backend: false
requires_auth: false
complexity: low
status: active

requirement: |
  实现一个功能完整的随机抽奖转盘应用，包含以下页面与功能：

  【抽奖主页（Tab1·主页）】
  - 顶部标题"随机抽奖转盘"
  - 参与者名单输入区：多行文本框，每行一个名字，支持粘贴
  - 参与者标签展示区：输入确认后以标签/胶囊形式展示，每个标签有"×"删除按钮
  - 转盘可视化区域：根据参与者名单动态生成扇形色块转盘，每人一个扇区（不同颜色）
  - "开始抽奖"按钮（参与者少于2人时按钮置灰禁用）
  - 点击开始后转盘旋转动画（3-5秒逐渐减速），停在随机扇区
  - 结果弹窗（覆盖层）：展示中奖者名字 + 祝贺文案 + "确定"关闭按钮
  - "排除已中奖者"开关：开启后已中奖者自动从转盘移除不参与下轮

  【抽奖历史页（Tab2）】
  - 按时间倒序展示历史抽奖记录列表
  - 每条记录卡片：中奖者名字 + 抽奖时间 + 参与人数
  - 点击记录卡片 → 进入【记录详情页】
  - 顶部"清空历史"按钮（需确认弹窗）
  - 无记录时显示空状态引导"还没有抽奖记录"

  【记录详情页（子页面，从历史页点击进入）】
  - 顶部返回按钮 → 返回历史页
  - 展示该轮完整信息：中奖者（高亮）、全部参与者名单、抽奖时间

  【设置页（Tab3）】
  - "排除已中奖者"全局开关
  - 转盘动画速度选择：快 / 中 / 慢
  - 关于应用

  底部Tab导航：抽奖 / 历史 / 设置

core_functions:
  - 参与者名单输入与标签展示
  - 动态生成扇形转盘
  - 转盘旋转动画与随机停止
  - 中奖结果弹窗展示
  - 排除已中奖者功能
  - 抽奖历史记录列表
  - 历史记录详情查看
  - 清空历史记录
  - 动画速度设置

constraints: "纯前端本地应用；转盘颜色随机分配不同色；动画需流畅减速效果；历史记录使用本地存储"

notes: "无后端纯前端样本。重点验证转盘动画效果、随机性、输入交互、历史记录CRUD。"
