version: "2.0"
dataset_version: "v2"
sample_id: ReptileCare
title: 爬行动物养护
app_type: 自然观察
requires_backend: true
requires_auth: true
complexity: high
status: active
data_mode: "backend_crud"

requirement: |
  实现一个爬行动物养护应用，帮助用户管理爬宠个体档案、记录温湿度、管理喂食日历、追踪蜕皮、监测环境参数、管理疾病档案、繁殖追踪以及社区求助。支持用户注册和登录（邮箱+密码），登录后进入应用主界面：

  【导航结构】
  底部Tab导航共5个入口：我的爬宠(主页)/饲养记录/喂食日历/健康档案/社区求助

  【我的爬宠页(主页)】
  1. 爬宠列表：以卡片形式展示所有个体，每张卡片显示照片、昵称、品种、年龄、体重
  2. 右上角"+"按钮进入添加个体页
  3. 系统预置2个示例爬宠（豹纹守宫"小花"、玉米蛇"阿黄"）供展示
  4. 空状态：无个体时显示"还没有爬宠，快来添加第一只吧"；设置入口按钮（设置页不占用底部Tab）

  【个体详情页】
  5. 爬宠大图展示
  6. 基本信息：昵称、品种、性别、年龄、当前体重、入手日期
  7. 环境状态：最近温湿度数据和目标范围对比
  8. 最近喂食记录摘要
  9. 蜕皮记录摘要：上次蜕皮日期、蜕皮间隔
  10. 编辑和删除按钮
  11. 快捷入口：环境监测、疾病记录、繁殖管理

  【添加个体页】
  12. 上传爬宠照片
  13. 填写昵称（必填）
  14. 选择品种分类（守宫/蛇类/蜥蜴/龟类/其他）
  15. 选择性别（公/母/未知）
  16. 输入年龄（月）
  17. 输入体重（g）
  18. 选择入手日期
  19. 设置温湿度目标范围及报警阈值
  20. 保存后个体出现在我的爬宠列表

  【饲养记录页(Tab)】
  21. 时间轴展示所有爬宠的饲养记录
  22. 每条记录显示：爬宠昵称、记录类型(温湿度/喂食/蜕皮/称重/疾病)、日期、关键数据
  23. 支持按个体筛选记录
  24. 支持按类型筛选记录

  【记录温湿度页】
  25. 选择目标爬宠
  26. 输入温度（热区/冷区）
  27. 输入湿度（%）
  28. 自动对比目标范围显示状态（正常/偏高/偏低）
  29. 超出报警阈值时显示红色警报标识
  30. 保存后记录出现在饲养记录

  【环境监测仪表板页】
  31. 选择查看的爬宠个体
  32. 温度实时趋势曲线图（近7天/30天切换）
  33. 湿度实时趋势曲线图（近7天/30天切换）
  34. 当前值与目标范围的仪表盘展示
  35. 报警阈值设置：温度上下限、湿度上下限
  36. 报警历史列表：超限事件的时间和持续时长
  37. 环境评分：基于温湿度稳定性的综合评分

  【环境对比分析页】
  38. 支持选择多个爬宠进行环境参数对比
  39. 支持选择不同时间段进行对比（本周vs上周、本月vs上月）
  40. 多线叠加对比图表（温度曲线叠加展示）
  41. 湿度对比柱状图
  42. 异常频率对比表格
  43. 环境改善建议（基于对比结果）

  【喂食日历页(Tab)】
  44. 日历视图展示喂食安排
  45. 每天格子标记：已喂(绿色)/计划喂食(蓝色)/未喂(灰色)
  46. 点击某天查看当天喂食详情
  47. 右上角"+"进入添加喂食记录页

  【添加喂食记录页】
  48. 选择目标爬宠
  49. 选择食物类型（活体/冻鼠/昆虫/蔬果/人工饲料）
  50. 输入食物大小/数量
  51. 选择喂食日期
  52. 记录是否拒食
  53. 保存后记录出现在日历和饲养记录

  【喂食详情页】
  54. 某次喂食的完整信息
  55. 爬宠昵称、食物类型、数量、日期
  56. 是否拒食状态
  57. 备注

  【健康档案页(Tab)】
  58. 健康总览：所有爬宠的健康状态卡片
  59. 每张卡片显示：爬宠昵称、最近体重、蜕皮状态、健康评分
  60. 点击进入该爬宠的健康详情
  61. 疾病档案库入口按钮

  【蜕皮记录页】
  62. 某个体的蜕皮历史记录
  63. 每条显示：蜕皮日期、蜕皮质量（完整/不完整）、间隔天数
  64. 右上角"+"进入记录蜕皮页

  【记录蜕皮页】
  65. 选择目标爬宠
  66. 选择蜕皮日期
  67. 选择蜕皮质量：完整蜕皮/不完整蜕皮
  68. 填写备注（可选）
  69. 保存后记录出现在蜕皮历史和饲养记录

  【疾病档案库页】
  70. 常见爬宠疾病百科列表（按类别分组：呼吸系统/消化系统/皮肤/骨骼/寄生虫）
  71. 搜索疾病名称
  72. 每条显示：疾病名称、常见症状摘要、危险等级（低/中/高）
  73. 点击进入疾病详情：完整症状描述、可能原因、建议处理方式、就医建议
  74. 症状匹配诊断功能：勾选爬宠当前症状，系统匹配可能疾病列表并按匹配度排序

  【疾病记录页】
  75. 某个体的患病历程记录列表
  76. 新增疾病记录：选择爬宠、选择/输入疾病名称、记录发现日期
  77. 用药方案管理：药物名称、剂量、频次、用药周期
  78. 康复进度追踪：症状严重度评分（1-5）随时间变化的趋势图
  79. 每条记录可标记状态：治疗中/已康复/慢性管理
  80. 就诊记录：医院/医生/诊断结果/费用

  【繁殖管理页】
  81. 繁殖配对记录列表：公母个体配对、配对日期、状态（准备中/已交配/已产卵/已孵化）
  82. 新增配对记录：选择公母个体、记录配对日期
  83. 孵化日程管理：预计孵化日期倒计时、当前孵化温度记录、孵化天数追踪
  84. 后代追踪：每窝后代数量、存活率、后代去向记录（自留/送人/出售）
  85. 繁殖统计：总繁殖次数、成功率、后代数量

  【社区求助页(Tab)】
  86. 帖子列表：标题、摘要、作者、时间、回复数
  87. 帖子分类标签：求助/分享经验/医生推荐/器材交流
  88. 发帖功能：标题+内容+图片（最多3张）+选择分类
  89. 帖子详情：完整内容+评论列表
  90. 评论回复功能
  91. 医生推荐专区：推荐爬宠医生（名称+地址+擅长品种+评分）

  【编辑个体信息页】
  92. 预填原有信息
  93. 支持修改所有字段
  94. 支持更新体重（同时记录称重历史）

  【设置页】
  95. 温湿度提醒开关
  96. 喂食提醒开关
  97. 环境报警通知开关
  98. 默认温湿度目标范围
  99. 默认报警阈值设置
  100. 关于应用信息

