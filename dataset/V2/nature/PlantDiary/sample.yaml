version: "2.0"
dataset_version: "v2"
sample_id: PlantDiary
title: 多肉植物养护日志
app_type: 自然观察
requires_backend: true
requires_auth: true
complexity: high
status: active
data_mode: "backend_crud"

requirement: |
  实现一个多肉植物养护日志应用，帮助用户管理植物档案、记录养护过程、设置浇水提醒、查阅品种百科、评估植物健康、分享养护心得并进行对比分析：

  【导航结构】
  底部Tab导航共5个入口：我的花园(主页)/养护日志/浇水提醒/社区/百科

  【我的花园页(主页)】
  1. 植物列表：以卡片形式展示所有已添加植物，每张卡片显示植物照片、名称、品种、上次浇水时间
  2. 顶部搜索栏：支持按植物名称搜索
  3. 右上角"+"按钮进入添加植物页
  4. 系统预置3个示例植物供展示（石莲花、玉露、仙人掌）
  5. 空状态：无植物时显示"还没有植物，快来添加第一盆吧"；设置入口按钮（设置页不占用底部Tab）

  【植物详情页】
  6. 植物大图展示
  7. 植物基本信息：名称、品种、购入日期、养护天数
  8. 浇水状态：距下次浇水天数、浇水周期
  9. 成长相册入口：查看该植物的历史照片
  10. 养护记录列表：最近的养护操作（浇水/施肥/换盆等）
  11. 健康评分入口：进入该植物的健康评估
  12. 编辑和删除按钮

  【添加植物页】
  13. 上传植物照片（或从相册选择）
  14. 填写植物名称（必填）
  15. 选择品种分类（多肉/仙人掌/其他）
  16. 选择购入日期
  17. 设置浇水周期（默认7天）
  18. 保存后植物出现在我的花园列表

  【养护日志页(Tab)】
  19. 时间轴展示所有植物的养护记录
  20. 每条记录显示：植物名、操作类型(浇水/施肥/换盆/修剪)、日期、备注
  21. 支持按植物筛选日志
  22. 点击进入日志详情

  【记录养护页】
  23. 选择目标植物
  24. 选择操作类型：浇水/施肥/换盆/修剪
  25. 填写备注（可选）
  26. 拍照记录（可选）
  27. 保存后记录出现在养护日志列表

  【浇水提醒页(Tab)】
  28. 展示所有植物的浇水计划列表
  29. 每项显示：植物名、浇水周期、下次浇水日期、状态（已浇/待浇/逾期）
  30. 点击"已浇水"按钮更新状态
  31. 逾期未浇水的植物高亮提醒（红色标识）

  【养护日历页】
  32. 月视图日历展示，标记每天的养护事件
  33. 按植物生成养护提醒：浇水/施肥/换盆日程
  34. 点击日期查看当天待办养护任务列表
  35. 支持添加自定义养护提醒
  36. 不同操作类型用不同颜色标记

  【设置浇水周期页】
  37. 选择目标植物
  38. 设置浇水间隔天数（滑块或输入框）
  39. 设置提醒时间
  40. 保存后更新浇水计划

  【社区分享页(Tab)】
  41. 信息流展示其他用户分享的养护心得
  42. 每条动态显示：用户头像/昵称、内容文字、配图、植物标签、点赞数、评论数
  43. 支持点赞和评论互动
  44. 右上角发布按钮进入发布页

  【发布心得页】
  45. 输入分享内容（文字）
  46. 添加配图（最多9张）
  47. 选择关联植物标签
  48. 发布后出现在社区信息流

  【百科页(Tab)】
  49. 品种百科：按科属分类浏览植物品种（景天科/仙人掌科/百合科等）
  50. 搜索栏：支持按品种名称搜索
  51. 每项显示：品种名、科属、缩略图、收藏状态
  52. 支持收藏品种
  53. 病虫害百科入口

  【品种详情页】
  54. 品种大图和名称
  55. 科属分类信息
  56. 养护要点（光照/浇水/温度/土壤建议）
  57. 常见病虫害列表
  58. 收藏/取消收藏按钮

  【病虫害百科页】
  59. 病虫害列表：展示常见病虫害（如蚧壳虫、黑腐病、白粉病等）
  60. 每项显示：名称、缩略图、危害等级标签
  61. 系统预置至少5种常见病虫害

  【病虫害详情页】
  62. 病虫害大图和名称
  63. 症状描述
  64. 防治方法
  65. 常见受害植物

  【健康评分页】
  66. 选择目标植物（或从植物详情进入已预选）
  67. 填写评估表单：土壤湿度(1-5)/光照充足度(1-5)/叶色健康度(1-5)/虫害情况(无/轻微/严重)
  68. 系统自动计算综合健康评分（满分100）
  69. 健康趋势图：展示该植物历史健康评分变化曲线
  70. 给出养护建议（根据各项得分）

  【对比分析页】
  71. 选择2-4个植物进行对比
  72. 生长曲线对比图（养护天数 vs 相册照片数/养护记录数）
  73. 健康度对比：各植物最近健康评分雷达图
  74. 浇水频率对比
  75. 综合排名展示

  【成长相册页】
  76. 按时间线展示某植物的历史照片
  77. 每张照片显示拍摄日期
  78. 支持上传新照片

  【设置页】
  79. 提醒开关：全局开启/关闭浇水提醒
  80. 默认浇水周期设置
  81. 个人信息编辑（昵称/头像）
  82. 数据导出（模拟）
  83. 关于应用信息

pages:
  - name: "我的花园"
    level: "L1"
    entry_from: "底部Tab-我的花园"
    description: "植物列表主页"
    features:
      - "植物卡片列表（照片+名称+品种+上次浇水时间）"
      - "搜索栏"
      - "添加植物入口"
      - "预置示例植物"
      - "设置入口"

  - name: "植物详情"
    level: "L2"
    entry_from: "我的花园-点击植物卡片"
    description: "单个植物的完整信息和操作"
    features:
      - "植物大图和基本信息"
      - "浇水状态和周期"
      - "成长相册入口"
      - "养护记录列表"
      - "健康评分入口"
      - "编辑/删除按钮"

  - name: "添加植物"
    level: "L3"
    entry_from: "我的花园-右上角+按钮"
    description: "新增植物信息录入"
    features:
      - "上传照片"
      - "名称+品种+购入日期"
      - "浇水周期设置"

  - name: "养护日志"
    level: "L1"
    entry_from: "底部Tab-养护日志"
    description: "所有养护记录时间轴"
    features:
      - "时间轴展示"
      - "操作类型标签"
      - "按植物筛选"

  - name: "日志详情"
    level: "L2"
    entry_from: "养护日志-点击记录"
    description: "单条养护记录详情"
    features:
      - "植物名+操作类型+日期+备注+照片"

  - name: "记录养护"
    level: "L3"
    entry_from: "养护日志页-添加按钮/植物详情页"
    description: "新增养护操作记录"
    features:
      - "选择植物"
      - "选择操作类型"
      - "备注+拍照"

  - name: "浇水提醒"
    level: "L1"
    entry_from: "底部Tab-浇水提醒"
    description: "浇水计划列表和状态管理"
    features:
      - "浇水计划列表"
      - "状态标签（已浇/待浇/逾期）"
      - "已浇水按钮"
      - "逾期高亮提醒"

  - name: "养护日历"
    level: "L2"
    entry_from: "浇水提醒-日历视图按钮"
    description: "月视图养护日程与提醒管理"
    features:
      - "月视图日历展示"
      - "养护事件标记（浇水/施肥/换盆）"
      - "点击日期查看待办任务"
      - "添加自定义提醒"
      - "不同操作类型颜色区分"

  - name: "设置浇水周期"
    level: "L3"
    entry_from: "浇水提醒-设置按钮/植物详情页"
    description: "调整植物浇水周期"
    features:
      - "选择植物"
      - "浇水间隔天数"
      - "提醒时间"

  - name: "社区分享"
    level: "L1"
    entry_from: "底部Tab-社区"
    description: "养护心得社区信息流"
    features:
      - "动态信息流（头像+昵称+内容+配图+标签）"
      - "点赞和评论互动"
      - "发布入口"

  - name: "发布心得"
    level: "L2"
    entry_from: "社区分享-右上角发布按钮"
    description: "发布养护心得到社区"
    features:
      - "输入文字内容"
      - "添加配图（最多9张）"
      - "选择关联植物标签"

  - name: "百科"
    level: "L1"
    entry_from: "底部Tab-百科"
    description: "品种百科与病虫害百科入口"
    features:
      - "品种分类浏览（按科属）"
      - "搜索栏"
      - "收藏状态标识"
      - "病虫害百科入口"

  - name: "品种详情"
    level: "L2"
    entry_from: "百科-点击品种条目"
    description: "植物品种详细信息与养护要点"
    features:
      - "品种大图+名称+科属"
      - "养护要点（光照/浇水/温度/土壤）"
      - "常见病虫害列表"
      - "收藏/取消收藏"

  - name: "病虫害百科"
    level: "L2"
    entry_from: "百科-病虫害百科入口"
    description: "病虫害百科列表"
    features:
      - "病虫害列表（名称+缩略图+危害等级）"
      - "预置常见病虫害"

  - name: "病虫害详情"
    level: "L3"
    entry_from: "病虫害百科-点击病虫害条目"
    description: "病虫害详细信息"
    features:
      - "大图+名称"
      - "症状描述"
      - "防治方法"
      - "常见受害植物"

  - name: "健康评分"
    level: "L3"
    entry_from: "植物详情-健康评分入口"
    description: "植物健康评估与趋势分析"
    features:
      - "评估表单（土壤湿度/光照/叶色/虫害）"
      - "综合健康评分计算（满分100）"
      - "健康趋势图（历史评分曲线）"
      - "养护建议生成"

  - name: "对比分析"
    level: "L3"
    entry_from: "我的花园-对比按钮"
    description: "多植物对比分析"
    features:
      - "选择2-4个植物"
      - "生长曲线对比图"
      - "健康度雷达图对比"
      - "浇水频率对比"
      - "综合排名"

  - name: "成长相册"
    level: "L2"
    entry_from: "植物详情-成长相册入口"
    description: "植物历史照片时间线"
    features:
      - "照片时间线"
      - "拍摄日期标注"
      - "上传新照片"

  - name: "设置"
    level: "L2"
    entry_from: "我的花园-设置入口"
    description: "应用偏好设置"
    features:
      - "提醒开关"
      - "默认浇水周期"
      - "个人信息编辑（昵称/头像）"
      - "数据导出"
      - "关于信息"

core_functions:
  - 植物档案管理（添加/编辑/删除植物信息）
  - 养护日志记录（浇水/施肥/换盆/修剪+时间轴展示）
  - 浇水提醒与周期管理（状态追踪+逾期提醒）
  - 养护日历（月视图+养护日程+自定义提醒）
  - 品种百科（按科属分类+搜索+收藏）
  - 植物健康评估（多维度表单+评分+趋势图+建议）
  - 多植物对比分析（生长曲线+健康度+浇水频率对比）
  - 社区分享（发布心得+浏览+点赞+评论）
  - 成长相册（按时间线管理植物照片）
  - 病虫害百科查阅（症状+防治方法）
  - 植物搜索与筛选

constraints:
  - 需使用真实的后端应用
  - 社区数据（动态/点赞/评论）和健康评分历史使用 后端存储
  - 用户需登录后才能使用社区发布和评论功能
  - 系统预置3个示例植物（石莲花、玉露、仙人掌）供首页展示
  - 系统预置至少5种常见病虫害百科数据
  - 系统预置至少10个植物品种百科数据（含科属分类和养护要点）
  - 浇水提醒使用页面内状态标识，不依赖系统通知
  - 逾期计算规则：当前日期超过下次浇水日期时标记为逾期
  - 健康评分计算规则：土壤湿度(20%)+光照充足度(25%)+叶色健康度(30%)+虫害情况(25%)，各项1-5分映射到对应百分比
  - 对比分析至少需要选择2个植物才能生成对比图表
  - 照片功能使用模拟方式（照片由模型根据主题自动生成）
  - 底部Tab导航最多包含5个入口：我的花园、养护日志、浇水提醒、社区、百科；设置页必须通过我的花园页的设置入口进入，不作为底部Tab
