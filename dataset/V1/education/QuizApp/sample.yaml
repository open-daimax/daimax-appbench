version: "2.0"
sample_id: QuizApp
title: 答题测验
app_type: 教育
dataset_version: "v2"
complexity: medium
requires_backend: false
requires_auth: false

requirement: |
  实现一个功能完整的知识竞赛答题应用，内置丰富题库，覆盖分类选题、答题反馈、结果统计、错题本、排行榜与个人成绩中心的完整闭环。

  【数据说明】
  1. 内置至少50道题目，覆盖4个分类：历史、科学、地理、文学
  2. 题目类型包含：单选题和多选题；同一分类下单选与多选混合编排，确保每轮答题过程中至少出现一道多选题
  3. 每道题包含：题目文本、选项列表（4个选项）、正确答案、题目类型标识（单选/多选）、难度、所属分类
  4. 难度分为：简单、中等、困难（3个难度级别）
  5. 题库数据硬编码在前端；历史成绩、错题、答题统计本地持久化

  【导航结构】
  6. 底部为3个Tab：首页（开始答题）、成绩（排行榜/错题本）、我的（统计中心）
  7. 答题页、结果页为从首页进入的层级页面
  8. 各Tab切换保持各自状态

  【首页Tab-分类选择】
  9. 展示4个分类卡片：历史、科学、地理、文学，每个卡片显示分类名称与题目数量
  10. 难度选择：提供简单/中等/困难三个难度选项
  11. 开始答题按钮：选择分类和难度后点击开始
  12. 快捷入口：显示历史最高分/最近成绩概览

  【答题页】
  13. 顶部显示倒计时：整套题15分钟总时限，格式为 MM:SS，实时递减
  14. 显示当前进度：第X/N题（如"第3/10题"）
  15. 题目区域：显示题目文本，多选题明确标注"多选题"
  16. 选项区域：单选题点击选项即选中；多选题可选择多个选项，需点击提交按钮
  17. 即时反馈：选择/提交后立即显示对/错标记（绿色正确/红色错误）
  18. 错误时显示正确答案高亮
  19. 自动进入下一题或手动点击"下一题"按钮
  20. 支持中途退出答题（二次确认后返回首页）

  【多选题评分规则】
  21. 全对得满分（选对所有正确选项且无多选）
  22. 部分对不得分（少选或多选均不得分）

  【结果页】
  23. 总分展示：X/总分
  24. 用时展示：实际答题用时
  25. 正确率：正确题数/总题数 百分比
  26. 成绩评价：根据正确率给出评价文案（如优秀/良好/继续加油）
  27. 错题回顾入口：点击可查看本次答错的题目列表
  28. 再来一局与返回首页入口

  【成绩Tab-排行榜/错题本】
  29. 排行榜Tab：本地历史排行Top10，按分数降序排列，显示分数、用时、日期
  30. 排行榜为空时显示"还没有记录"提示
  31. 错题本Tab：所有历史答错的题目列表，显示题目和正确答案，可按分类筛选
  32. 错题本为空时显示"还没有错题"提示
  33. 错题本支持重做：点击重做按钮，仅对错题重新答题；重做答对后可从错题本移除

  【我的Tab-统计中心】
  34. 累计答题统计：累计答题局数、累计答题数、平均正确率
  35. 分类正确率：各分类（历史/科学/地理/文学）的正确率对比（图表或列表）
  36. 成就/连续答题记录展示
  37. 无任何答题记录时显示空状态提示

pages:
  - name: 首页Tab-分类选择
    description: 4个分类卡片+难度选择+开始答题按钮+历史成绩概览
  - name: 答题页
    description: 题目+选项+倒计时+进度(第X/N题)+即时反馈+中途退出
  - name: 结果页
    description: 总分+用时+正确率+成绩评价+错题回顾入口+再来一局
  - name: 成绩Tab-排行榜/错题本
    description: 排行榜Top10（Tab）+错题列表可筛选可重做（Tab）+空状态
  - name: 我的Tab-统计中心
    description: 累计答题统计+分类正确率图表+成就+空状态

navigation:
  type: bottom_tab
  tabs:
    - 首页Tab-分类选择
    - 成绩Tab-排行榜/错题本
    - 我的Tab-统计中心
  stacked_pages:
    - 答题页
    - 结果页

core_functions:
  - 底部Tab导航（首页/成绩/我的）
  - 分类选择与难度选择
  - 单选题答题与即时反馈
  - 多选题答题与评分（全对得分，部分对不得分）
  - 15分钟总倒计时（MM:SS格式递减）
  - 中途退出答题
  - 答题结果统计（总分/用时/正确率/成绩评价）
  - 错题自动收录到错题本（可按分类筛选）
  - 错题重做功能（答对后可移除）
  - 本地历史排行榜Top10（按分数降序）
  - 个人统计中心（累计统计/分类正确率图表/成就）
  - 空状态处理（排行榜/错题本/统计为空）

constraints:
  - 纯本地存储，无需网络
  - 无需用户登录
  - 内置至少50道题目，覆盖4个分类（历史/科学/地理/文学）
  - 题目类型包含单选和多选，每轮答题中确保出现多选题
  - 历史分数、错题和答题统计本地持久化
  - 倒计时为整套题15分钟总时限，非单题限时

notes: "测试知识竞赛答题完整闭环：Tab导航、分类答题、即时反馈、多选题评分、倒计时、结果统计、排行榜、错题本与个人统计中心。重点验证多选题评分规则的正确性（全对得分/部分对不得分）、倒计时递减准确性与错题收录/重做逻辑。"
