      - "水质警告阈值"
      - "投喂提醒开关"
      - "告警通知开关"
      - "设备维护提醒开关"
      - "温度单位切换"
      - "个人信息编辑（昵称/头像）"
      - "关于信息"

core_functions:
  - 鱼缸档案管理（添加/编辑/删除鱼缸）
  - 水质监测（记录pH/温度/氨氮/亚硝酸盐+自动判定状态）
  - 水质多维度搜索筛选（按鱼缸/缸体/参数范围/状态组合筛选）
  - 统计仪表板（水温/pH/亚硝酸盐趋势图+多指标联合图表）
  - 异常告警（水质超标自动告警+历史告警统计+状态管理）
  - 生物管理（添加/编辑/删除+按鱼缸筛选）
  - 投喂计划（设置频率/时间+状态追踪）
  - 设备管理（设备列表+维护日程+维护历史+倒计时提醒）
  - 社区鱼市（发布/浏览交易+品种筛选+评价系统）
  - 水质状态预警（正常/警告/危险）

constraints:
  - 需使用真实的后端应用
  - 社区鱼市数据（帖子/评价）使用 后端存储
  - 用户需登录后才能发布交易和评价
  - 系统预置1个示例鱼缸（60cm草缸）及其生物和水质数据
  - 水质状态自动判定规则：pH 6.5-7.5且氨氮<0.5mg/L为正常，pH超出范围或氨氮≥0.5为警告，氨氮≥1.0为危险
  - 异常告警触发规则：水质记录保存时自动检测是否超标，超标则生成告警记录
  - 设备维护提醒规则：距下次维护日期≤3天时高亮提醒
  - 投喂提醒使用页面内状态标识，不依赖系统通知
  - 温度默认使用摄氏度，可在设置中切换华氏度
  - 统计图表默认展示近30天数据，支持切换时间范围
  - 底部Tab导航最多包含5个入口：我的鱼缸、水质监测、生物档案、投喂计划、社区鱼市；设置页必须通过我的鱼缸页的设置入口进入，不作为底部Tab
