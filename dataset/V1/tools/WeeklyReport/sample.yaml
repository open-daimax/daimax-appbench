version: "2.0"
sample_id: WeeklyReport
title: 团队周报收集器
app_type: 工具
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true
complexity: medium
status: active

requirement: |
  实现一个功能完整的团队周报收集器应用，包含以下页面与功能：

  【登录注册页】
  - 支持用户注册和登录
  - 登录成功后进入填写周报页

  【填写周报页（Tab1·主页）】
  - 顶部标题"本周周报" + 当前周次（如"第28周 7.8-7.14"）
  - 三个多行文本输入区域：
    - "本周完成"（placeholder：列出本周完成的工作…）
    - "下周计划"（placeholder：列出下周的工作计划…）
    - "遇到的问题"（placeholder：描述遇到的困难或需要的支持…，可留空）
  - "提交周报"按钮
  - 若本周已提交：显示"已提交"绿色状态标签，按钮变为"修改周报"
  - 提交/修改成功后toast提示"提交成功"

  【我的周报页（Tab2）】
  - 按周次倒序列表展示历史周报
  - 每条记录卡片：周次标题（如"第27周"）+ 提交时间 + "本周完成"前20字摘要
  - 点击记录卡片 → 进入【周报详情页】
  - 无记录时显示空状态"还没有提交过周报"

  【周报详情页（子页面，从"我的周报"或"团队汇总"点击进入）】
  - 顶部返回按钮 → 返回来源页
  - 完整展示：周次 + 提交者 + 提交时间
  - 三个内容区块：本周完成、下周计划、遇到的问题
  - 若是自己的周报，底部提供"编辑"按钮 → 跳转填写页进入编辑模式

  【团队汇总页（Tab3）】
  - 顶部周次选择器（下拉切换不同周次）
  - 统计摘要："本周已提交 X/Y 人"
  - 成员列表：每人显示头像/昵称 + 提交状态标签（绿色"已提交" / 灰色"未提交"）
  - 已提交成员 → 点击进入【周报详情页】（展示该成员的周报）
  - 未提交成员点击无响应或提示"该成员尚未提交"

  【我的/设置页（Tab4）】
  - 当前用户信息（头像+昵称+邮箱）
  - 提醒设置：周五提醒填写周报开关
  - 退出登录按钮

  底部Tab导航：填写周报 / 我的周报 / 团队汇总 / 我的

core_functions:
  - 用户注册登录
  - 填写周报（本周完成/下周计划/遇到的问题）
  - 提交周报与状态切换
  - 修改已提交周报
  - 我的历史周报列表
  - 周报详情查看
  - 团队成员提交状态汇总
  - 按周次切换查看团队汇总
  - 点击成员查看其周报
  - 退出登录

constraints: "用户只能编辑自己的周报；RLS确保数据隔离；团队汇总所有登录用户可查看；周次自动计算"

notes: "后端CRUD样本，多用户协作场景。重点验证周报CRUD完整性、团队汇总视图、RLS权限隔离、提交状态管理。"
