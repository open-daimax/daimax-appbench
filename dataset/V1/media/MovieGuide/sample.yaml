version: "2.0"
sample_id: MovieGuide
title: 电影指南
app_type: 资讯
dataset_version: "v2"
data_mode: "frontend_local"

requirement: |
  实现一个功能完整的电影指南应用，用户可浏览热映与分类电影、查看详情、搜索、收藏与评分，并管理个人中心：

  【数据与存储】
  1. 无需用户注册和登录，打开应用直接使用；片单、评分等个人数据本地存储

  【导航结构】
  2. 底部Tab导航：热映 / 分类 / 搜索 / 片单 / 我的

  【首页-热门电影】
  3. 展示预置电影，网格布局(每行2-3部)
  4. 每部显示：海报图、片名、评分(x.x/10)、年份
  5. 支持按评分/年份排序切换
  6. 点击电影进入详情页

  【分类页】
  7. 按类型筛选：动作/喜剧/科幻/爱情/悬疑
  8. 点击类型标签筛选对应电影，支持多类型同时筛选

  【搜索页】
  9. 顶部搜索输入框，实时匹配片名与主演
  10. 搜索结果列表，显示海报、片名、评分
  11. 无结果时显示空状态提示

  【电影详情页】
  12. 海报大图
  13. 基本信息：片名、导演、主演(2-3人)、时长(分钟)、年份、类型
  14. 评分与简介(3-5句话)
  15. 用户评分显示
  16. "想看"/"已看"按钮；"去评分"入口

  【我的片单页】
  17. 想看/已看两个列表Tab切换
  18. 每项显示海报缩略图、片名、评分
  19. 从片单移除功能；空片单时显示空状态提示

  【评分页】
  20. 打分(1-10分，点击选择)
  21. 一句话短评输入(最多50字)
  22. 提交评分，提交后详情页同步显示

  【我的/个人中心】
  23. 展示个人资料（本地昵称/头像）与片单/评分数量统计
  24. 快捷进入我的评分列表与片单
  25. 设置项：清除本地缓存、关于页面入口

core_functions:
  - 电影网格列表浏览
  - 按评分/年份排序
  - 按类型筛选(动作/喜剧/科幻/爱情/悬疑)
  - 关键词搜索(片名/主演)与空状态
  - 电影详情展示(海报/导演/演员/时长/评分/简介)
  - 想看/已看片单管理与空状态
  - 打分与短评(1-10分)
  - 我的/个人中心(个人资料/统计/设置)

constraints: |
  纯前端应用，电影数据硬编码(12部)，含完整信息。
  片单和评分存localStorage。
  评分为整数1-10。
  短评最多50字。
  同一电影不可重复加入想看/已看（已在想看中则不可再加想看，但可标记已看）。
  内置数据：
  - 星际穿越(科幻/2014/169分钟/诺兰/9.4)
  - 肖申克的救赎(悬疑/1994/142分钟/达拉邦特/9.7)
  - 泰坦尼克号(爱情/1997/194分钟/卡梅隆/9.4)
  - 盗梦空间(科幻/2010/148分钟/诺兰/9.3)
  - 疯狂动物城(喜剧/2016/108分钟/霍华德/9.2)
  - 速度与激情7(动作/2015/137分钟/温子仁/8.3)
  - 复仇者联盟(动作/2012/143分钟/惠顿/8.2)
  - 你的名字(爱情/2016/106分钟/新海诚/8.4)
  - 寄生虫(悬疑/2019/132分钟/奉俊昊/8.7)
  - 头号玩家(科幻/2018/140分钟/斯皮尔伯格/8.7)
  - 摔跤吧爸爸(喜剧/2016/161分钟/提瓦里/9.0)
  - 看不见的客人(悬疑/2016/106分钟/奥里奥尔/8.8)

notes: "纯前端电影指南应用。重点验证列表排序与类型筛选、详情展示、片单管理(想看/已看)、评分短评等功能。"
