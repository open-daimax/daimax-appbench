version: "1.0"
sample_id: SubwaySurfers
title: 地铁跑酷
app_type: 游戏
game_category: 跑酷类
dataset_version: "v1"
status: deprecated
deprecated_reason: "复杂连续手势(实时滑动操控)，自动化测试无法模拟"

requirement: |
  实现一个地铁跑酷游戏应用:
  1. 主界面展示 3D 跑酷场景,角色在铁轨上自动向前奔跑
  2. 玩家可通过左右滑动切换跑道(左/中/右三条跑道)
  3. 上滑跳跃避开低障碍物,下滑滑行避开高障碍物
  4. 场景中随机生成障碍物(火车、栏杆、路障等)
  5. 跑道上随机出现金币,玩家可收集获得分数
  6. 游戏速度随时间逐渐加快,增加难度
  7. 碰撞障碍物游戏结束,显示最终得分和最高分

core_functions:
  - 3 跑道场景渲染与角色动画
  - 左右滑动切换跑道
  - 上滑跳跃/下滑滑行动作
  - 障碍物随机生成与碰撞检测
  - 金币收集与计分系统
  - 游戏速度递增机制
  - 游戏结束判定与得分展示

constraints:
  - 纯单机游戏,无需网络
  - 无需用户登录
  - 使用简单色块或基础 3D 模型表示场景元素
  - 至少 3 种障碍物类型

notes: "测试跑酷游戏核心机制:跑道切换、碰撞检测、分数计算、难度递增。需要实时渲染和流畅交互。"
