version: "2.0"
dataset_version: "v1"
sample_id: FlashSale
title: 限时秒杀
app_type: 电商
requires_backend: true
requires_auth: true
complexity: high
status: deprecated
deprecated_reason: "确定拦截"

requirement: |
  实现一个限时秒杀购物应用，支持多场次秒杀、商品抢购和预约提醒：

  【秒杀首页-场次列表】
  1. 展示多个秒杀场次卡片，每个场次显示时间标签和状态（已结束/进行中/即将开始）
  2. 进行中场次：显示"抢购中"状态标识，可直接点击进入
  3. 即将开始场次：显示倒计时（格式"距开始还有XX:XX:XX"），提供"预约提醒"按钮
  4. 已结束场次：显示"已结束"灰色标识
  5. 系统预置3个场次（1个已结束、1个进行中、1个即将开始）供展示

  【场次商品列表页】
  6. 展示该场次所有秒杀商品，每个商品显示：商品图、名称、原价（划线）、秒杀价
  7. 库存进度条：显示已售百分比（如"已售78%"），进度条填充对应比例
  8. 商品按库存剩余排序（库存少的在前）
  9. 已售罄商品显示灰色"已售罄"标识，不可点击

  【秒杀商品详情页】
  10. 商品大图展示
  11. 显示秒杀价、原价（划线对比）、节省金额
  12. 限购数量提示（如"每人限购1件"）
  13. 库存剩余数量显示
  14. 本场次倒计时（距结束还有XX:XX:XX）
  15. "立即抢购"按钮（库存为0时变为"已售罄"不可点击）

  【订单确认页】
  16. 显示收货地址（选择或新增）
  17. 显示商品信息：商品名、秒杀价、数量
  18. "确认支付"按钮 → 模拟支付成功 → 显示成功提示 → 跳转订单列表

  【抢购结果反馈】
  19. 抢购成功：显示成功页面，包含订单摘要和"查看订单"按钮
  20. 抢购失败（库存为0）：点击抢购时显示"已售罄，手慢了"提示

  【我的预约页】
  21. 展示已预约的秒杀商品列表：商品名、秒杀价、场次开始时间
  22. 支持取消预约操作
  23. 无预约时显示空状态提示（如"暂无预约提醒"）

  【订单列表页(Tab)】
  24. 展示用户所有秒杀订单：订单状态（待支付/待收货/已完成）、商品缩略图、金额
  25. 点击订单进入订单详情页
  26. 无订单时显示空状态提示

  【订单详情页】
  27. 显示订单商品信息、秒杀价、数量、收货地址、订单总额、订单状态
  28. 状态流转：待支付 -> 待收货 -> 已完成（模拟支付后进入待收货，确认收货后已完成）
  29. 已完成订单提供评价入口

  【评价系统】
  30. 订单完成后可对秒杀商品进行评价
  31. 评价包含评分（星级）和文字评价
  32. 已评价商品显示评价内容，不可重复评价

  【收货地址管理】
  33. 个人中心提供地址管理入口
  34. 新增收货地址（姓名、手机号、详细地址）
  35. 编辑/删除地址，支持设为默认地址

  【个人中心(Tab)】
  36. 显示用户头像和昵称
  37. 我的预约入口
  38. 我的订单入口
  39. 收货地址管理入口
  40. 退出登录

pages:
  - name: "秒杀首页"
    description: "秒杀场次列表和倒计时展示"
    features:
      - "多场次展示（已结束/进行中/即将开始）"
      - "倒计时显示（距开始还有XX:XX:XX）"
      - "预约提醒按钮"
      - "场次状态标识"

  - name: "场次商品列表"
    description: "某场次下的秒杀商品展示"
    features:
      - "商品图+名称+原价+秒杀价"
      - "库存进度条（已售XX%）"
      - "已售罄标识"

  - name: "秒杀商品详情"
    description: "秒杀商品完整信息和抢购入口"
    features:
      - "商品大图"
      - "秒杀价与原价对比"
      - "限购数量提示"
      - "库存剩余"
      - "场次倒计时"
      - "立即抢购/已售罄按钮"

  - name: "订单确认"
    description: "抢购后确认收货和支付"
    features:
      - "收货地址选择/新增"
      - "商品信息确认"
      - "模拟支付"

  - name: "我的预约"
    description: "已预约的秒杀商品管理"
    features:
      - "预约商品列表"
      - "取消预约"
      - "空状态提示"

  - name: "订单列表"
    description: "秒杀订单历史"
    features:
      - "订单状态展示（待支付/待收货/已完成）"
      - "点击进入订单详情"
      - "空状态提示"

  - name: "订单详情"
    description: "单个秒杀订单详情与状态流转"
    features:
      - "商品+秒杀价+数量+总额"
      - "收货地址+订单状态"
      - "状态流转（待支付->待收货->已完成）"
      - "已完成订单评价入口"

  - name: "商品评价"
    description: "订单完成后的商品评价"
    features:
      - "评分（星级）+文字评价"
      - "不可重复评价"

  - name: "收货地址管理"
    description: "收货地址的新增与维护"
    features:
      - "新增地址（姓名+手机号+详细地址）"
      - "编辑/删除地址"
      - "设为默认地址"

  - name: "个人中心"
    description: "用户信息和功能入口"
    features:
      - "头像昵称"
      - "我的预约入口"
      - "我的订单入口"
      - "收货地址管理入口"
      - "退出登录"

core_functions:
  - 秒杀场次展示与倒计时
  - 商品秒杀价和库存进度展示
  - 场次预约提醒
  - 秒杀抢购流程（成功/失败）
  - 订单确认与模拟支付
  - 预约管理（查看/取消）
  - 订单管理（列表/详情/状态流转）
  - 购后评价（评分+文字）
  - 收货地址管理

constraints:
  - 需使用真实的后端应用
  - 支付使用模拟流程（点击支付后直接显示成功，不涉及真实支付）
  - 倒计时使用相对时间显示（距开始/结束还有XX:XX:XX）
  - 系统预置3个秒杀场次（已结束1个、进行中1个、即将开始1个）
  - 每个场次预置3-5个秒杀商品（含不同库存状态）
  - |
  - 用户只能查看自己的订单和预约（RLS隔离）
