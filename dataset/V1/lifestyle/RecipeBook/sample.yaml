version: "2.0"
sample_id: RecipeBook
title: 家常菜谱
app_type: 生活
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的家常菜谱应用，提供菜谱浏览、分类、搜索、详情查看、个人收藏管理的完整体验。

  【底部Tab导航】
  应用底部固定4个Tab：首页、分类、收藏、我的，点击可在四个主页面间切换，当前Tab高亮。

  【首页（Tab）】
  1. 顶部搜索入口（点击进入搜索页）
  2. 推荐菜谱区：横向或卡片展示若干精选/热门菜谱（含菜名、图片占位符、难度、用时）
  3. 菜系分类快捷入口：川菜🌶️/粤菜🥢/江浙菜🍜/家常小炒🥗
  4. 点击推荐菜谱直接进入详情，点击菜系进入菜谱列表

  【分类页（Tab）】
  5. 4个菜系分类卡片：川菜/粤菜/江浙菜/家常小炒
  6. 每张卡片显示：菜系名、代表菜品图（占位符）、菜谱数量
  7. 点击进入该菜系菜谱列表

  【菜谱列表页】
  8. 该菜系下的菜谱列表（每菜系至少3道菜）
  9. 每项显示：菜名、难度（简单/中等/困难）、烹饪时间、食材数量
  10. 支持按难度筛选（全部/简单/中等/困难）
  11. 支持按烹饪时间排序（短到长/长到短）

  【菜谱详情页】
  12. 菜名和图片（占位符）
  13. 基本信息：烹饪时间、份数（2-3人份）、难度
  14. 食材清单：每项食材名+用量（如“五花肉 300g”）
  15. 分步骤做法：每步有序号+文字描述
  16. 收藏按钮（点击切换收藏/取消收藏，状态高亮）

  【搜索页】
  17. 顶部搜索输入框，支持按菜名或食材关键词搜索
  18. 实时过滤显示匹配菜谱列表
  19. 无匹配时显示空状态提示
  20. 点击结果进入菜谱详情

  【收藏页（Tab）】
  21. 展示已收藏菜谱列表，每项显示菜名、难度、用时
  22. 点击进入菜谱详情
  23. 无收藏时显示友好的空状态提示

  【我的页（Tab）】
  24. 顶部展示收藏数量、已浏览菜谱数等简单统计
  25. 设置项：主题切换（浅色/深色）、清空收藏（带二次确认）
  26. 关于应用信息（版本号、简介）

core_functions:
  - 底部Tab导航(首页/分类/收藏/我的)
  - 首页推荐菜谱与菜系快捷入口
  - 菜系分类卡片浏览(4个菜系)
  - 菜谱列表展示(菜名/难度/时间/食材数)
  - 难度筛选(简单/中等/困难)与按烹饪时间排序
  - 菜谱详情(食材清单+分步做法+基本信息)
  - 菜谱搜索(按菜名和食材本地过滤)与无结果空状态
  - 收藏与取消收藏(本地存储)
  - 收藏页列表与空状态
  - 我的页(统计/主题切换/清空收藏/关于)

constraints: |
  纯前端应用，数据硬编码；收藏状态存localStorage。
  内置数据（每菜系3道）：
  - 川菜：麻婆豆腐(简单/20min)、回锅肉(中等/30min)、水煮鱼(困难/45min)
  - 粤菜：白切鸡(中等/60min)、蒸排骨(简单/40min)、煲仔饭(中等/50min)
  - 江浙：西湖醋鱼(困难/40min)、东坡肉(中等/90min)、龙井虾仁(中等/20min)
  - 家常：番茄炒蛋(简单/10min)、红烧排骨(中等/50min)、可乐鸡翅(简单/30min)

notes: "纯前端菜谱应用。重点验证底部Tab导航、首页推荐、菜系分类浏览、难度筛选与排序、食材清单与步骤详情展示、搜索、收藏交互与我的页等功能。"
