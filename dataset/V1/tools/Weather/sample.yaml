version: "1.0"
sample_id: Weather
title: 天气
app_type: 工具

requirement: |
  实现一个天气预报应用:
  1. 首页展示当前城市的实时天气信息,包括温度、湿度、风速、空气质量
  2. 显示24小时逐小时天气预报,支持左右滑动查看
  3. 显示未来7天天气预报,包含最高/最低温度、天气状况
  4. 支持城市搜索,可添加多个城市并切换查看
  5. 城市管理:可添加、删除、排序城市列表
  6. 显示天气预警信息(如暴雨、台风、高温预警等)
  7. 展示生活指数(穿衣指数、洗车指数、运动指数、紫外线指数等)
  8. 支持GPS自动定位当前城市
  9. 支持温度单位切换(摄氏度/华氏度)

core_functions:
  - 实时天气数据展示(温度/湿度/风速/气压/空气质量)
  - 24小时逐小时天气预报
  - 7天天气预报
  - 城市搜索与添加
  - 城市列表管理(添加/删除/排序/切换)
  - GPS自动定位城市
  - 天气预警信息展示
  - 生活指数展示(穿衣/洗车/运动/紫外线等)
  - 温度单位切换(℃/℉)
  - 数据手动刷新
  - 天气图标与动画效果

constraints:
  - 可使用模拟天气数据(无需真实天气API)
  - 定位可使用模拟位置
  - 支持离线查看缓存数据
  - UI美观,天气图标清晰易懂
  - 支持深色/浅色主题

notes: "测试工具类应用核心功能:数据展示、搜索、城市管理、多数据维度呈现。重点验证天气数据的完整性和UI展示效果。"
