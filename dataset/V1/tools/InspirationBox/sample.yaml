version: "2.0"
sample_id: InspirationBox
title: 灵感收集器
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个灵感收集器应用，帮助用户随时记录和管理灵感想法：

  1. 首页-灵感流：
     - 瀑布流/卡片列表展示所有灵感卡片
     - 每张卡片显示标题、正文摘要、标签、创建时间
     - 星标卡片置顶显示，带星标图标
     - 右下角浮动"+"按钮用于新建灵感
     - 顶部搜索框支持按标题和正文内容搜索

  2. 新建/编辑灵感：
     - 标题输入框（必填，最多30字）
     - 正文输入框（支持多行，最多500字）
     - 标签选择（预设标签：创意、感悟、金句、待办想法；支持多选）
     - 保存按钮

  3. 灵感详情页：
     - 完整展示标题、正文、标签、创建时间
     - 顶部操作栏：编辑、星标/取消星标、删除
     - 删除需二次确认弹窗

  4. 分类Tab/筛选：
     - 顶部Tab切换：全部、创意、感悟、金句、待办想法
     - 点击Tab仅显示该分类下的灵感卡片

  5. 搜索功能：
     - 实时过滤标题和正文中包含关键词的卡片
     - 无匹配时显示"暂无相关灵感"空状态

  6. 统计页（我的Tab）：
     - 显示灵感总数、各分类数量
     - 本周新增灵感数
     - 近7天灵感趋势柱状图（X轴为日期，Y轴为数量）

  7. 空状态：
     - 首次使用无灵感时显示引导文案："记录你的第一个灵感吧！"

constraints: |
  - 纯前端应用，所有数据使用 localStorage 本地存储
  - 无需登录注册功能
  - 预设4个标签分类：创意、感悟、金句、待办想法
  - 标题必填校验，为空时阻止保存并提示
  - 星标卡片在列表中置顶显示
  - 删除操作需弹窗二次确认
  - 图片资源使用 mock_resources 中的图片作为空状态或装饰图
