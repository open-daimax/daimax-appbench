version: "2.0"
sample_id: VotingApp
title: 在线投票平台
app_type: 社交
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true
complexity: high
status: active

requirement: |
  实现一个功能完整的在线投票平台应用，包含以下页面与功能：

  【登录注册页】
  - 支持用户注册和登录
  - 登录成功后进入投票列表页

  【投票列表页（Tab1·主页）】
  - 顶部分段控件：进行中 / 已结束
  - 投票卡片列表：每张卡片显示标题 + 创建者昵称 + 参与人数 + 截止时间（倒计时或日期）
  - "已结束"的卡片灰色 + 锁定图标标记
  - 点击卡片 → 进入【投票详情页】
  - 右上角"+"按钮 → 进入【创建投票页】
  - 支持下拉刷新
  - 无投票时显示空状态"暂无投票，点击右上角+创建第一个投票"

  【创建投票页（子页面，从列表页"+"进入）】
  - 顶部返回按钮 → 返回列表页
  - 投票标题输入框（必填）
  - 选项区域：初始2个选项输入框，"添加选项"按钮可动态新增（最多10个）
  - 每个选项输入框右侧有"×"删除按钮（至少保留2个不可删除）
  - 截止时间选择器（日期+时间选择）
  - 匿名/实名切换开关（默认实名，标注说明文案）
  - 单选/多选切换开关
  - "发布投票"按钮（标题+至少2个非空选项才可点击，否则置灰）
  - 发布成功 → toast提示 + 自动返回列表页

  【投票详情页（子页面，从列表页或我的投票页点击进入）】
  - 顶部返回按钮 → 返回来源页
  - 投票标题 + 创建者 + 截止时间
  - 状态标签：匿名/实名 + 单选/多选 + 进行中/已结束
  - 选项列表区：
    - 未投票状态：每个选项可点击选择（单选radio/多选checkbox），底部"提交投票"按钮
    - 已投票状态：选项不可操作，显示"已投票"标签，自己选过的选项有标记
    - 已结束状态：选项灰色不可操作，顶部显示"投票已结束"
  - 每个选项后显示：已投票数 + 占比百分比 + 进度条
  - 实时饼图区域：展示各选项投票比例的饼图可视化
  - 参与人数统计（底部显示"共X人参与"）

  【我的投票页（Tab2）】
  - 顶部分段控件：我创建的 / 我参与的
  - "我创建的"：自己发起的投票列表，每张卡片显示标题+状态+参与人数
  - "我参与的"：自己投过票的列表，卡片额外标注"已投票"
  - 点击卡片 → 进入【投票详情页】
  - 无数据时分别显示对应空状态

  【我的/设置页（Tab3）】
  - 当前用户信息（头像+昵称+邮箱）
  - 通知设置：投票到期提醒开关
  - 退出登录按钮

  底部Tab导航：投票广场 / 我的投票 / 我的

core_functions:
  - 用户注册登录
  - 投票列表展示（进行中/已结束分类）
  - 创建投票（标题/多选项/截止时间/匿名开关/单多选）
  - 动态添加删除选项（2-10个）
  - 发布投票（必填校验）
  - 参与投票（选择选项提交）
  - 已投票状态锁定（不可重复投票）
  - 投票结果饼图可视化
  - 到期自动锁定
  - 我的投票管理（创建的/参与的）
  - 退出登录

constraints: "每人每个投票只能投一次票；RLS确保投票记录权限；到期后选项不可操作；饼图实时反映投票比例；最少2个选项最多10个"

notes: "后端CRUD样本，多用户投票场景。重点验证投票创建完整性、投票交互、结果可视化（饼图）、到期锁定机制、防重复投票。"
