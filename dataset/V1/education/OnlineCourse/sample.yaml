version: "2.0"
sample_id: OnlineCourse
title: 在线课程
app_type: 教育
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
complexity: medium
requires_backend: true
requires_auth: true

mock_resources:
  videos:
    - url: "https://www.w3schools.com/html/mov_bbb.mp4"
      title: "示例课程视频1"
    - url: "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4"
      title: "示例课程视频2"
    - url: "https://www.w3schools.com/html/movie.mp4"
      title: "示例课程视频3"

requirement: |
  实现一个功能完整的在线课程学习平台，覆盖课程发现、购买、视频学习、进度追踪、笔记收藏与个人学习中心的完整闭环。

  【数据说明】
  1. 系统预置至少6门示例课程，由"系统讲师"账户发布，分布在4个分类中
  2. 每门课程包含：标题、封面图、课程简介、讲师信息（头像/姓名/简介）、综合评分、学员数、价格、章节列表（每章含多个课时，课时含标题与时长）
  3. 课程分类：编程、设计、语言、商业（4个分类）
  4. 视频使用 mock_resources 中提供的3个免费视频URL循环分配给各课时
  5. 课程数据由后端数据库存储；用户的购买记录、学习进度、笔记、收藏均与账户绑定持久化

  【导航结构】
  6. 登录成功后进入主界面，底部为3个Tab：课程（首页）、我的学习、个人中心
  7. 课程详情页、视频播放页为从Tab页面进入的层级页面（非Tab）
  8. 各Tab间切换保持各自的滚动位置与状态

  【登录注册页】
  9. 支持用户注册和登录
  10. 提供注册与登录两个入口的切换；输入校验（邮箱格式、密码长度）
  11. 登录成功后跳转到课程首页Tab

  【课程首页Tab】
  12. 顶部搜索栏：输入关键词实时搜索课程（按标题/讲师匹配）
  13. 分类筛选栏：展示"全部"+4个课程分类（编程/设计/语言/商业），点击切换筛选对应分类课程
  14. 推荐课程区：横向滚动的精选课程卡片
  15. 课程列表：展示课程卡片，每个显示封面、标题、讲师名、评分（星级）、学员数、价格
  16. 点击课程卡片进入课程详情页
  17. 搜索无结果时显示空状态提示"没有找到相关课程"

  【课程详情页】
  18. 顶部课程封面图 + 标题
  19. 课程简介文字描述、综合评分（星级展示）、学员数
  20. 讲师信息卡：讲师头像、姓名、简介
  21. 章节列表：展示所有章节与课时标题，显示每个课时时长；已学课时显示已完成标记
  22. 收藏按钮：点击可收藏/取消收藏该课程，状态即时切换并持久化
  23. 购买按钮：未购买时显示价格与"立即购买"按钮；点击后弹出确认，确认即完成模拟支付并加入"我的学习"
  24. 已购买状态：按钮变为"开始学习"，点击进入视频播放页继续上次进度

  【视频播放页】
  25. 嵌入式视频播放器：播放 mock_resources 中的视频URL
  26. 播放/暂停控制按钮
  27. 进度条：显示播放进度，可拖动跳转
  28. 倍速控件：提供 0.5x/1x/1.5x/2x 倍速选择，控件可见且可交互，切换后显示当前倍速
  29. 课时切换：可在当前课程的课时间前后切换
  30. 笔记按钮：点击弹出笔记输入框，用户手动输入时间点标记+笔记内容，保存后加入该课程笔记列表
  31. 笔记列表：查看该课程已保存的所有笔记（时间标记+内容），支持删除笔记
  32. 完成课时后自动更新学习进度

  【我的学习Tab】
  33. 已购买课程列表：展示所有已购买课程的封面、标题
  34. 学习进度：每门课程显示进度百分比（已完成课时/总课时）与进度条
  35. 点击课程进入继续学习（跳转到最近学习的课时）
  36. 未购买任何课程时显示空状态提示"还没有购买课程"，并提供"去逛逛"入口

  【个人中心Tab】
  37. 用户信息区：头像、昵称、注册邮箱
  38. 学习统计：累计学习课时数、累计学习时长、已完成课程数（数据卡片展示）
  39. 我的收藏入口：进入后展示已收藏的课程列表，收藏为空时显示空状态提示
  40. 我的笔记入口：进入后汇总展示所有课程的笔记
  41. 设置区：账号信息、清除缓存（UI模拟）、退出登录（返回登录页）

pages:
  - name: 登录注册页
    description: 注册/登录入口切换，输入校验，登录成功跳转首页Tab
  - name: 课程首页Tab
    description: 搜索栏+分类筛选+推荐课程横滑+课程列表卡片+搜索空状态
  - name: 课程详情页
    description: 封面+简介+评分+讲师信息+章节列表+收藏按钮+购买/开始学习按钮
  - name: 视频播放页
    description: 嵌入式播放器+播放暂停+进度条+倍速控件+课时切换+笔记按钮与笔记列表
  - name: 我的学习Tab
    description: 已购买课程列表+学习进度百分比与进度条+继续学习+空状态
  - name: 个人中心Tab
    description: 用户信息+学习统计卡片+我的收藏+我的笔记+设置与退出登录

navigation:
  type: bottom_tab
  tabs:
    - 课程首页Tab
    - 我的学习Tab
    - 个人中心Tab
  stacked_pages:
    - 课程详情页
    - 视频播放页

core_functions:
  - 用户注册与登录
  - 底部Tab导航（课程/我的学习/个人中心）
  - 课程分类筛选、搜索与推荐展示
  - 课程详情展示（章节/讲师/评分/学员数）
  - 课程收藏与取消收藏
  - 课程购买流程（模拟支付）
  - 嵌入式视频播放（播放/暂停/进度条/课时切换）
  - 倍速播放控件（0.5x/1x/1.5x/2x）
  - 课程笔记（手动输入时间标记+内容、查看、删除）
  - 学习进度追踪（已完成课时/总课时百分比）
  - 个人学习中心（学习统计、我的收藏、我的笔记）
  - 空状态处理（搜索无结果/未购买课程/收藏为空）

constraints:
  - 需要使用真实的后端服务存储课程、用户、购买、进度、笔记、收藏数据
  - 视频使用 mock_resources 中提供的免费视频URL
  - 需要用户登录注册功能
  - 支付流程为模拟（无需真实支付系统）
  - 系统预置至少6门示例课程，分布于4个分类
  - 学习进度、收藏、笔记与用户账户绑定并持久化

notes: "测试在线教育平台完整闭环：Tab导航、课程发现、购买、视频播放控制、学习进度、笔记与收藏、个人学习中心。重点验证视频倍速控件的可交互性、学习进度计算准确性、购买流程完整性以及收藏/笔记的持久化。"
