version: "2.0"
sample_id: FlashCards
title: 单词闪卡
app_type: 教育
dataset_version: "v2"
complexity: medium
requires_backend: false
requires_auth: false

requirement: |
  实现一个功能完整的单词闪卡记忆应用（类似Anki），通过间隔重复算法帮助用户高效记忆单词，覆盖卡组管理、闪卡学习、复习计划、统计进度与分享的完整闭环。

  【数据说明】
  1. 内置1个默认单词本（英语四级高频词），包含100+单词
  2. 每个单词包含：英文单词、中文释义、音标（文字展示，如 /əˈbaʊt/，无需真实音频）、例句、记忆等级
  3. 用户可创建自定义单词本并手动添加单词
  4. 所有数据本地持久化（单词本、单词、学习记录、复习计划、连续天数）

  【导航结构】
  5. 底部为3个Tab：卡组（首页）、复习、统计
  6. 学习页、单词管理页为从卡组Tab进入的层级页面
  7. 各Tab切换保持各自状态

  【卡组Tab-单词本列表】
  8. 展示所有单词本（预置+自定义），每个显示名称、单词总数、已掌握数/学习进度百分比、今日待复习数
  9. 点击单词本进入该本的学习页
  10. 提供"新建单词本"按钮，输入名称即可创建空单词本
  11. 每个单词本提供"管理"入口进入单词管理页
  12. 预置单词本不可删除，自定义单词本可删除（长按或删除按钮，需二次确认）

  【学习页】
  13. 学习模式切换：翻转模式（默认）与选择模式
  14. 翻转模式-卡片正面：英文单词 + 音标（文字形式）
  15. 翻转模式-点击卡片翻转，反面显示：中文释义 + 英文例句
  16. 翻转模式-翻转后底部显示4个记忆评估按钮：不认识、模糊、认识、很熟
  17. 选择模式：给出英文单词与4个中文释义选项，选对/选错即时反馈（绿色对/红色错）后进入下一张
  18. 点击评估按钮或完成选择后自动进入下一张卡片
  19. 学习页顶部显示当前进度（如"第3/20张"）
  20. 完成本轮学习后显示本轮小结（学习数量、正确/掌握数）并可返回卡组

  【间隔重复算法与复习计划】
  21. 不认识：该卡片立即重新加入当前学习队列（当次学习中会再次出现）
  22. 模糊：该卡片安排在1天后复习
  23. 认识：该卡片安排在3天后复习
  24. 很熟：该卡片安排在7天后复习
  25. 复习Tab：按到期时间汇总今日待复习单词，展示待复习总数与"开始复习"按钮
  26. 复习Tab显示未来复习计划分布（如明日/3天后/7天后各多少张）
  27. 无待复习内容时显示空状态提示"今天没有需要复习的单词"

  【统计Tab】
  28. 今日学习数：今天学习的单词总数
  29. 总掌握数：标记为"认识"或"很熟"的单词总数
  30. 各等级分布饼图：展示不认识/模糊/认识/很熟四个等级的单词数量占比
  31. 连续学习天数：连续每天有学习记录的天数
  32. 近7天学习趋势：柱状图或折线图展示每天学习单词数

  【单词管理页】
  33. 单词本内支持搜索：输入英文或中文关键词，实时过滤匹配的单词
  34. 添加自定义单词：填写英文单词、中文释义、音标、例句，保存后出现在当前单词本中
  35. 可删除自定义添加的单词
  36. 单词本为空时显示空状态提示并引导添加单词

  【分享】
  37. 单词本提供分享入口：点击后弹出分享选项或生成分享文本/图片（UI模拟，无需真实分享渠道）

pages:
  - name: 卡组Tab-单词本列表
    description: 展示所有单词本（名称/单词数/学习进度/待复习数）+新建+管理+删除+分享入口
  - name: 学习页
    description: 翻转/选择两种学习模式，卡片正反面、评估按钮、进度、本轮小结
  - name: 复习Tab
    description: 今日待复习汇总+开始复习+未来复习计划分布+空状态
  - name: 统计Tab
    description: 今日学习数+总掌握数+等级分布饼图+连续天数+近7天趋势图
  - name: 单词管理页
    description: 搜索单词+添加自定义单词（英文/中文/音标/例句）+删除单词+空状态

navigation:
  type: bottom_tab
  tabs:
    - 卡组Tab-单词本列表
    - 复习Tab
    - 统计Tab
  stacked_pages:
    - 学习页
    - 单词管理页

core_functions:
  - 底部Tab导航（卡组/复习/统计）
  - 单词本列表展示（预置+自定义，含进度与待复习数）
  - 新建/删除自定义单词本
  - 闪卡翻转模式（正面单词+音标，反面释义+例句）
  - 闪卡选择模式（英文对中文释义选择+即时反馈）
  - 记忆程度评估（不认识/模糊/认识/很熟 4个等级）
  - 间隔重复调度算法（不认识立即重复、模糊1天、认识3天、很熟7天）
  - 复习计划（今日待复习汇总+未来复习分布）
  - 添加自定义单词（英文+中文+音标+例句）与删除
  - 单词搜索（英文/中文关键词过滤）
  - 学习统计（今日学习数/总掌握数/等级分布饼图/连续天数/近7天趋势）
  - 单词本分享（UI模拟）
  - 空状态处理（无待复习/空单词本）

constraints:
  - 纯本地存储，无需网络
  - 无需用户登录
  - 内置1个预置单词本（英语四级高频词，100+单词）
  - 发音使用文字音标展示（无需真实音频播放）
  - 数据本地持久化（学习记录、复习计划、自定义单词、连续天数）
  - 分享为UI模拟（无需真实分享渠道）

notes: "测试单词记忆学习完整闭环：Tab导航、卡组管理、翻转/选择两种学习模式、间隔重复调度、复习计划、学习统计图表与分享。重点验证间隔重复算法的调度逻辑正确性、复习计划到期汇总与统计数据的准确性。"
