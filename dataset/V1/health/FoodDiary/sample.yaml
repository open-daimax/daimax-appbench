version: "2.0"
dataset_version: "v2"
sample_id: FoodDiary
title: 饮食记录
app_type: 健康
data_mode: "frontend_mock"

requirement: |
  实现一个完整的饮食记录应用，帮助用户追踪每日营养摄入、管理饮食历史并设定健康目标。无需用户注册和登录，打开应用直接进入应用主界面。

  【导航结构】
  底部Tab导航共4个入口：今日(主页)/营养/历史/我的。添加食物、体重记录、设置等为二级页面。

  【启动与数据】
  1. 无需用户注册和登录，打开应用直接进入今日饮食主页
  2. 所有数据本地存储，重进应用后数据保留

  【今日饮食页(主页)】
  3. 顶部卡路里环：已摄入/目标卡路里（默认目标2000kcal），显示剩余可摄入
  4. 三餐分区列表：早餐/午餐/晚餐/加餐，每区显示已记录食物和小计卡路里
  5. 每餐区域有"+"按钮添加食物
  6. 已添加食物项：食物名+份量+卡路里，左滑可删除，点击可编辑份量
  7. 顶部日期切换：可查看今日或往日的饮食记录

  【添加食物页】
  8. 搜索框：输入食物名搜索内置食物库（实时匹配）
  9. 搜索结果列表：食物名+每100g卡路里
  10. 点击食物→设置份量（克数输入框，默认100g）→自动计算卡路里
  11. 确认添加→返回主页，对应餐次更新
  12. 内置食物库至少100种常见食物，每种含：名称、每100g卡路里、蛋白质g、碳水g、脂肪g
  13. 支持添加自定义食物（输入名称+卡路里+三大营养素每100g含量），可编辑和删除自定义食物

  【营养详情页】
  14. 今日三大营养素摄入量：蛋白质Xg/碳水Xg/脂肪Xg
  15. 饼图展示三大营养素占比
  16. 推荐比例参考线：蛋白质20%/碳水50%/脂肪30%
  17. 按餐次维度的营养素分布

  【历史记录页】
  18. 历史日期列表：按日期倒序展示每日总摄入卡路里及是否达标
  19. 日报表：选择某日查看当天三餐明细、总卡路里、三大营养素
  20. 周报表：近7日卡路里柱状图 + 日均摄入 + 达标天数统计
  21. 支持按日期范围筛选历史记录

  【体重记录页】
  22. 当日体重输入框+记录按钮
  23. 近30天体重折线图
  24. 内置过去7天的示例体重数据（如70.5/70.3/70.1/69.8/70.0/69.7/69.5kg）

  【我的/设置页(个人中心)】
  25. 个人资料展示（头像/昵称，本地保存，昵称可编辑）
  26. 每日卡路里目标设置
  27. 性别/年龄/身高选择（影响推荐目标）
  28. 自定义食物管理入口、体重记录入口
  29. 关于页面入口

pages:
  - name: "今日饮食页(主页)"
    description: "今日已摄入卡路里进度和三餐食物列表"
    features:
      - "卡路里环：已摄入/目标(默认2000kcal)+剩余"
      - "三餐分区列表：早餐/午餐/晚餐/加餐"
      - "每餐显示已记录食物和小计卡路里"
      - "每餐+按钮添加食物"
      - "左滑删除、点击编辑食物份量"
      - "日期切换查看往日记录"

  - name: "添加食物页"
    description: "搜索内置食物库并添加到对应餐次"
    features:
      - "搜索框实时匹配食物库"
      - "搜索结果列表：食物名+每100g卡路里"
      - "份量设置（克数输入，默认100g）"
      - "自动计算卡路里"
      - "自定义食物添加/编辑/删除"

  - name: "营养详情页"
    description: "今日三大营养素摄入分析"
    features:
      - "蛋白质/碳水/脂肪摄入量显示"
      - "三大营养素占比饼图"
      - "推荐比例参考线(20%/50%/30%)"
      - "按餐次营养素分布"

  - name: "历史记录页"
    description: "饮食历史查询与日/周报表"
    features:
      - "历史日期列表(倒序+是否达标)"
      - "日报表：某日三餐明细与营养素"
      - "周报表：近7日卡路里柱状图+日均+达标天数"
      - "按日期范围筛选"

  - name: "体重记录页"
    description: "体重记录和历史折线图"
    features:
      - "当日体重输入+记录"
      - "近30天体重折线图"
      - "内置7天示例体重数据"

  - name: "我的/设置页(个人中心)"
    description: "个人资料、目标与个人设置"
    features:
      - "个人资料展示(头像/昵称，本地保存)"
      - "每日卡路里目标设置"
      - "性别/年龄/身高选择"
      - "自定义食物管理、体重记录入口"
      - "关于页面入口"

core_functions:
  - 今日卡路里进度环展示(已摄入/目标/剩余)
  - 三餐饮食记录(早餐/午餐/晚餐/加餐)
  - 食物搜索(内置100+食物库实时匹配)
  - 份量设置与卡路里自动计算
  - 食物记录编辑与删除(左滑)
  - 自定义食物管理(增改删)
  - 三大营养素饼图分析(蛋白质/碳水/脂肪)
  - 历史记录查询与日/周报表统计
  - 体重记录与折线图
  - 个人中心与目标设置

constraints: "内置食物库包含100+常见中国食物及营养数据；体重历史数据内置7天示例；三餐饮食、体重、自定义食物等数据本地存储；无需用户注册和登录，打开应用直接进入主界面。"

notes: "前端饮食追踪样本。重点验证：食物搜索与卡路里计算准确性、三餐分区记录管理(增改删)、营养素饼图渲染、历史日/周报表统计、体重折线图数据完整性、个人中心目标设置。"
