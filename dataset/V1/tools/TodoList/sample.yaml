version: "2.0"
sample_id: TodoList
title: 待办事项
app_type: 工具
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的待办事项管理应用，包含以下页面与功能：

  【登录注册页】
  - 支持用户注册和登录
  - 登录成功后进入今日待办页

  【今日待办页（Tab1·主页）】
  - 顶部标题栏"今日待办"，展示统计文案"今日 X 项待办，已完成 Y 项"
  - 顶部筛选分段控件：全部 / 未完成 / 已完成
  - 待办列表：未完成项排在前面，已完成项排在后面（标题划线+灰色）
  - 每个待办项：左侧复选框 + 标题 + 截止日期 + 优先级标签（高红/中黄/低绿）
  - 列表按优先级与截止日期排序
  - 点击复选框：标记完成（完成动画）并移入已完成区域，统计同步更新
  - 支持下拉刷新重新拉取列表
  - 左滑待办项显示删除按钮，确认后删除
  - 点击待办项进入待办详情页
  - 右下角浮动"+"按钮进入添加待办页
  - 列表为空时显示空状态引导文案

  【添加/编辑待办页】
  - 标题输入框（必填）、描述输入框（可选）
  - 截止日期选择器
  - 优先级选择：高（红）/中（黄）/低（绿）
  - 分类选择：从已有分类中选择
  - 底部保存按钮；编辑模式回显已有内容

  【待办详情页】
  - 展示待办完整信息：标题、描述、截止日期、优先级、分类、完成状态
  - 提供编辑与删除入口

  【分类管理页（Tab2）】
  - 分类列表：名称 + 该分类待办数量
  - 新增分类：输入名称 + 选择颜色
  - 编辑 / 删除分类
  - 无分类时显示空状态引导

  【统计页（Tab3）】
  - 待办完成情况汇总：总数 / 已完成 / 未完成
  - 按分类统计各分类待办数量（柱状图或占比展示）
  - 完成率展示

  【我的/设置页（Tab4）】
  - 展示当前登录用户信息
  - 主题切换（浅色/深色）
  - 数据导出
  - 关于应用
  - 退出登录

  底部Tab导航：今日待办 / 分类 / 统计 / 我的

core_functions:
  - 用户注册登录
  - 待办列表展示(未完成/已完成分区+排序+下拉刷新)
  - 添加待办(标题/描述/截止日期/优先级/分类)
  - 待办详情查看
  - 完成状态切换(动画+移至已完成区域)
  - 编辑和删除待办(左滑删除)
  - 筛选功能(全部/未完成/已完成)
  - 待办数量与完成率统计
  - 分类管理(创建/编辑/删除)
  - 统计页(汇总+分类统计)
  - 我的/设置页(用户信息/主题切换/数据导出/关于/退出登录)

constraints: "用户数据完全自产CRUD；优先级用颜色区分(红/黄/绿)；RLS确保用户只能看到自己的待办；分类颜色可自定义"

notes: "后端CRUD样本，用户自产数据。重点验证待办CRUD完整性、状态切换、筛选逻辑、分类管理、RLS权限隔离。"
