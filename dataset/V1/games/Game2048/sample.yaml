version: "2.0"
sample_id: Game2048
title: "2048"
app_type: 游戏
game_category: 数字益智类
dataset_version: "v2"
status: active

requirement: |
  实现一个功能完整的2048数字益智游戏应用，采用方向按钮控制（禁止手势），具备完整的"主菜单→游戏→胜利/结束→查看成绩→重新开始"闭环体验，包含主菜单、游戏、设置、排行榜等页面。

  【页面结构】
  1. 主菜单页：
     - 游戏标题"2048"
     - 三个主按钮：[开始游戏] [排行榜] [设置]
     - 底部显示当前最高分（首次为 0）

  2. 游戏主页：
     - 顶部信息栏：当前分数、最高分、[新游戏]按钮
     - 4×4方格棋盘（核心游戏区域），方块带圆角
     - 方向按钮区（棋盘下方）：[上] [下] [左] [右] 四个方向按钮
     - 顶部返回主菜单入口

  3. 设置页：
     - 音效开关（合并/移动音效）
     - 棋盘尺寸选择（4×4 / 5×5，默认 4×4）
     - 主题/配色切换（经典/暗色）
     - 撤销一步开关（是否允许撤销）
     - 返回主菜单按钮

  4. 排行榜页：
     - 标题"排行榜"
     - Top 10 历史成绩列表：每行显示"排名 | 分数 | 最大方块 | 日期"
     - 空状态：无记录时显示"暂无记录"
     - 返回主菜单按钮

  5. 游戏胜利弹窗（首次出现2048时）：
     - 显示"恭喜达成2048！"与当前分数
     - 两个按钮：[继续游戏] [重新开始]

  6. 游戏结束弹窗（无法移动时）：
     - 显示"游戏结束"与最终得分、最大方块
     - 若刷新最高分显示"新纪录！"
     - 两个按钮：[重新开始] [返回主菜单]

  【游戏规则】
  - 初始状态：4×4网格中随机2个位置生成数字方块（值为2或4）
  - 每次操作：点击方向按钮，所有方块向该方向滑动到尽头
  - 合并规则：滑动方向上相邻的相同数字合并为两倍（如2+2=4，4+4=8）
  - 同方向一次操作中，合并产生的新方块不能再次合并
  - 每次有效操作后：在空白位置随机生成一个新方块（2或4）
  - 无效操作（方块位置和值均不变）不生成新方块

  【得分规则】
  - 分数 = 所有合并产生的值之和（两个2合并得4分，两个4合并得8分）
  - 达成更大数字方块获得更高累计分数

  【胜利与结束条件】
  - 任意格子首次出现2048方块时弹出胜利提示，可选择[继续游戏]挑战更高数字
  - 所有16个格子填满且相邻格子（水平/垂直）无相同数字，无法合并时游戏结束

  【控制方式（仅按钮，禁止手势）】
  - 方向按钮[上][下][左][右]排列在棋盘下方
  - 点击方向按钮执行对应方向的移动与合并操作
  - 若开启撤销，可点击[撤销]回退到上一步

  【视觉与音效反馈】
  - 不同数字使用不同颜色背景（逐级加深），数字方块圆角样式
  - 新方块生成有弹出缩放动画
  - 方块合并时有放大回弹动画与合并音效
  - 达成2048时有庆祝动画
  - 音效受设置页开关控制

  【数据持久化】
  - 最高分与 Top 10 排行榜使用 localStorage 本地持久化
  - 设置项（音效/棋盘尺寸/主题/撤销）本地持久化
  - 每次合并后实时比较并更新最高分；游戏结束时若进入前10名写入排行榜

core_functions:
  - 4×4 网格棋盘渲染
  - 数字方块显示（不同数字不同颜色）
  - 方向按钮控制（上/下/左/右）
  - 方块滑动移动逻辑
  - 相同数字合并规则（同方向一次只合并一次）
  - 每次有效操作后随机生成新方块（2或4）
  - 得分计算（合并值累加）
  - 最高分实时更新与显示
  - 2048达成胜利提示（可继续游戏）
  - 游戏结束判定（无法移动）
  - 新游戏重置功能
  - 主菜单导航（开始/排行榜/设置）
  - 设置页（音效/棋盘尺寸/主题/撤销）
  - 排行榜Top10记录与展示
  - 合并与生成动画及音效反馈
  - 最高分与排行榜本地持久化(localStorage)

constraints:
  - 纯单机游戏，无需网络
  - 无需用户登录
  - 仅使用按钮控制，禁止滑动/拖拽/手势操作
  - 最高分与排行榜使用localStorage本地持久化
  - 默认棋盘为4×4格
  - 同方向一次操作中合并只能发生一次

notes: "V2版本：扩展为完整游戏应用，改用方向按钮控制（可E2E自动化测试），新增主菜单、设置页、排行榜与动画音效反馈。重点验证合并逻辑（同方向只合并一次）、方向移动正确性、游戏结束判定、排行榜与最高分持久化。"
