version: "1.0"
sample_id: BankApp
title: 手机银行
app_type: 金融
dataset_version: "v1"
status: deprecated
deprecated_reason: "涉及金融合规，不可模拟"
requires_backend: true
requires_auth: true

requirement: |
  实现一个手机银行应用:
  1. 登录:支持账号密码登录和生物识别(指纹/面容)登录
  2. 首页:显示账户余额(支持隐藏/显示)、常用功能快捷入口(转账/充值/还款)
  3. 账户详情:账户信息、卡号(隐藏中间数字)、可用余额、近期交易记录
  4. 转账汇款:输入收款账号、姓名、金额,选择到账时间(实时/普通),确认转账
  5. 交易记录:按月查看收入/支出明细,可按类型筛选
  6. 生活缴费:水电燃气费、话费充值、交通违章缴纳等
  7. 理财产品:展示可购买的理财产品列表(利率/期限/起购金额)
  8. 安全设置:修改密码、设置生物识别

core_functions:
  - 账号密码/生物识别登录
  - 账户余额展示(可隐藏)
  - 近期交易记录列表
  - 转账流程(输账号/金额/确认)
  - 交易记录查询与筛选
  - 生活缴费功能
  - 理财产品展示
  - 安全设置管理

constraints:
  - 需要使用真实的后端服务
  - 转账使用模拟流程(无需真实转账)
  - 需要用户登录注册功能
  - 账号和卡号需要脱敏处理

notes: "测试银行金融场景:账户信息展示、转账流程、缴费、理财。重点验证敏感信息脱敏展示和转账流程的步骤完整性。"
