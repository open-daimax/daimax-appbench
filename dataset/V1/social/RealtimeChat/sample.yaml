version: "2.0"
sample_id: RealtimeChat
title: 即时聊天
app_type: 社交
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的即时聊天应用，采用底部Tab导航（消息/联系人/我的），包含以下核心页面与能力：

  【登录注册页】
  - 支持用户注册和登录
  - 注册成功后自动登录并进入会话列表
  - 提供登录/注册切换入口

  【页面1：会话列表（首页）】
  - 展示所有聊天会话
  - 每条会话显示：对方头像+昵称+最后一条消息+时间+未读数红点
  - 系统预置1个"客服小助手"联系人及若干示例会话消息
  - 未读消息以红色数字角标显示
  - 点击会话进入聊天详情

  【页面2：聊天界面】
  - 消息气泡列表：自己发送的消息在右侧（蓝色气泡），对方消息在左侧（灰色气泡）
  - 支持多种消息类型：文字消息、图片消息
  - 每条消息显示时间
  - 消息状态标识：发送中（转圈/时钟）→ 已发送（✓）→ 已读（✓✓）
  - 底部输入框+发送按钮，并提供发送图片入口（使用占位符URL）
  - 输入文字或选择图片点击发送→消息出现在右侧气泡中

  【页面3：联系人列表】
  - 展示所有联系人，每个显示：头像+昵称+在线状态圆点（绿色=在线，灰色=离线）
  - 使用后端实时服务的 Presence 功能实现在线状态；预置联系人默认显示为离线（灰色圆点）
  - 点击联系人可发起新会话并进入聊天界面

  【页面4：个人设置（我的）】
  - 展示当前用户头像、昵称、账号等个人信息
  - 支持编辑个人资料（如修改昵称）
  - 展示自身在线状态
  - 提供退出登录入口

constraints: "系统预置1个客服联系人及若干示例消息；消息状态与在线状态验证仅检查UI展示（气泡/状态标识/绿点/灰点），不要求真实多设备同时在线"

notes: "后端CRUD样本+Realtime。测试用例为单用户可验证的视角，不要求2个设备同时操作。消息类型（文字/图片）、消息状态与在线状态仅验证UI展示。"
