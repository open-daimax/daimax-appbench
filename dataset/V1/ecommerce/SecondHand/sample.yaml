version: "2.0"
dataset_version: "v2"
sample_id: SecondHand
title: 二手交易
app_type: 电商
requires_backend: true
requires_auth: true
complexity: high
status: active

requirement: |
  实现一个二手交易平台应用，支持商品浏览、发布、议价和私信沟通：

  【首页-信息流】
  1. 推荐二手商品信息流：每个商品卡片显示商品图片、标题、价格、发布者昵称和所在地
  2. 下拉加载更多商品
  3. 顶部搜索栏：点击进入搜索页
  4. 分类筛选标签（如数码、服饰、家具、图书等）
  5. 系统预置至少5个二手商品供首页展示

  【搜索页】
  6. 输入关键词搜索商品
  7. 支持分类筛选（选择某分类后仅显示该分类商品）
  8. 支持按价格范围筛选
  9. 搜索无结果时显示提示

  【商品详情页】
  10. 商品图片展示（可左右滑动多图）
  11. 商品标题、描述、价格
  12. 卖家信息：头像、昵称、所在地
  13. 想要人数和发布时间
  14. 底部操作栏：[我想要]按钮、[议价]按钮、[私信卖家]按钮
  15. 收藏按钮：点击收藏/取消收藏

  【议价功能】
  16. 点击[议价]按钮弹出议价输入框
  17. 输入期望价格并提交 -> 显示议价已发送状态（等待卖家回复）
  18. 议价记录显示在商品详情的议价区域
  19. 卖家回复后状态更新为：已接受/已拒绝（单用户视角，卖家回复用模拟数据）

  【发布商品页】
  20. 选择或拍摄商品图片（至少1张）
  21. 填写商品标题和详细描述
  22. 设定价格
  23. 选择商品分类
  24. 填写所在地
  25. 点击发布 -> 发布成功提示 -> 商品出现在首页和我的发布中

  【私信列表页(Tab)】
  26. 展示所有私信对话列表：对方头像、昵称、最后一条消息摘要、时间
  27. 系统预置1个demo卖家账户和3条模拟消息供展示
  28. 无消息时显示空状态提示（如：暂无消息）

  【私信对话页】
  29. 显示与某用户的聊天记录（包含模拟的卖家回复）
  30. 底部输入框可发送文字消息
  31. 发送后消息立即显示在对话中

  【个人中心(Tab)】
  32. 显示用户头像和昵称
  33. 我的发布入口：查看出售中的商品列表
  34. 已售出入口：查看已标记售出的商品
  35. 已买到入口：查看通过议价成功购买的商品
  36. 收藏列表入口
  37. 我的订单入口：查看已买到的交易订单
  38. 收货地址管理入口
  39. 关注的卖家入口
  40. 退出登录

  【我的发布页】
  41. 展示当前用户发布的所有商品（出售中状态）
  42. 每个商品可操作：标记已售出、编辑、删除
  43. 无发布商品时显示空状态提示（如：还没有发布任何商品哦）

  【收货地址管理】
  44. 个人中心提供地址管理入口
  45. 新增收货地址（姓名、手机号、详细地址）
  46. 编辑/删除已有地址，支持设为默认地址
  47. 无地址时显示空状态提示

  【下单购买闭环】
  48. 议价被卖家接受后（或点击[我想要]确认购买）进入订单确认页
  49. 订单确认页显示商品信息、成交价、选择收货地址
  50. 提交订单 -> 生成交易订单 -> 该商品出现在"已买到"和订单列表

  【订单管理】
  51. 订单列表：展示我买到的订单，显示商品缩略图、成交价、订单状态
  52. 订单详情：显示商品信息、成交价、卖家、收货地址、订单状态
  53. 状态流转：待收货 -> 确认收货 -> 已完成
  54. 无订单时显示空状态提示

  【评价系统】
  55. 交易完成（确认收货）后，买家可对该笔交易进行评价
  56. 评价包含评分（如星级）和文字评价
  57. 已评价的交易显示评价内容，不可重复评价

  【关注卖家】
  58. 商品详情页可关注/取消关注卖家
  59. 个人中心查看已关注的卖家列表

pages:
  - name: "首页-信息流"
    description: "二手商品推荐信息流展示"
    features:
      - "商品卡片：图片+标题+价格+发布者"
      - "下拉加载更多"
      - "搜索入口"
      - "分类筛选标签"

  - name: "搜索页"
    description: "商品搜索和分类筛选"
    features:
      - "关键词搜索"
      - "分类筛选"
      - "价格范围筛选"
      - "无结果提示"

  - name: "商品详情页"
    description: "二手商品完整信息和互动操作"
    features:
      - "商品图片多图展示"
      - "标题+描述+价格"
      - "卖家信息"
      - "议价按钮"
      - "私信卖家按钮"
      - "收藏/取消收藏"

  - name: "发布商品"
    description: "发布闲置商品"
    features:
      - "图片选择/拍摄"
      - "标题+描述+价格"
      - "分类选择"
      - "发布提交"

  - name: "私信列表"
    description: "私信对话列表"
    features:
      - "对话列表：头像+昵称+摘要+时间"
      - "预置模拟消息"
      - "空状态提示"

  - name: "私信对话"
    description: "与某用户的聊天界面"
    features:
      - "聊天记录展示"
      - "发送文字消息"

  - name: "个人中心"
    description: "用户信息和功能入口"
    features:
      - "头像昵称"
      - "我的发布入口"
      - "已售出入口"
      - "已买到入口"
      - "我的订单入口"
      - "收藏列表入口"
      - "收货地址管理入口"
      - "关注卖家入口"
      - "退出登录"

  - name: "我的发布"
    description: "当前用户发布的商品管理"
    features:
      - "出售中商品列表"
      - "标记已售出"
      - "空状态提示"

  - name: "收货地址管理"
    description: "收货地址的新增与维护"
    features:
      - "新增地址（姓名+手机号+详细地址）"
      - "编辑/删除地址"
      - "设为默认地址"
      - "空状态提示"

  - name: "订单确认"
    description: "议价成功后确认购买"
    features:
      - "商品信息+成交价"
      - "选择收货地址"
      - "提交订单生成交易"

  - name: "订单列表"
    description: "我买到的交易订单"
    features:
      - "订单缩略图+成交价+状态"
      - "空状态提示"

  - name: "订单详情"
    description: "单笔交易订单详情与状态流转"
    features:
      - "商品+成交价+卖家+收货地址"
      - "状态流转（待收货->确认收货->已完成）"
      - "确认收货后可评价"

  - name: "交易评价"
    description: "交易完成后的评价"
    features:
      - "评分（星级）+文字评价"
      - "不可重复评价"

core_functions:
  - 商品信息流浏览和搜索
  - 发布闲置商品（图片+描述+定价+分类）
  - 商品详情展示
  - 议价功能（发起→等待回复→状态更新）
  - 私信沟通（含模拟卖家回复）
  - 个人主页（我的发布/已售出/已买到）
  - 商品收藏
  - 标记已售出
  - 收货地址管理（新增/编辑/默认）
  - 下单购买闭环（确认地址→生成订单）
  - 订单管理（列表/详情/状态流转）
  - 交易评价（评分+文字）
  - 关注卖家

constraints:
  - 议价采用单用户视角（发出议价后显示等待回复状态，卖家回复用模拟数据）
  - 私信使用模拟数据（系统预置1个demo卖家账户和3条模拟消息）
  - 系统预置至少5个二手商品供首页展示（含不同分类和价格）
  - 用户只能查看自己的发布、议价和私信（RLS隔离）
  - |
  - 标记已售出由卖家在我的发布中手动操作
  - 交易订单在议价成功或确认购买后生成，支付/物流使用模拟流程
  - 评价在确认收货后可进行，每笔交易仅可评价一次
