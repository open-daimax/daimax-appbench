version: "2.0"
sample_id: TeamPhotoUpload
title: 团队相册
app_type: 社交
dataset_version: "v2"
status: active
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的团队活动相册应用，采用底部Tab导航（活动/我的），包含以下核心页面与能力：

  【登录注册页】
  - 支持用户注册和登录
  - 注册成功后自动登录并进入首页
  - 提供登录/注册切换入口

  【页面1：活动列表（首页）】
  - 展示我参与的活动列表，每个活动显示：活动名称+日期+参与人数+照片数
  - 提供"创建活动"入口（右上角或浮动按钮）
  - 点击活动进入活动详情/相册页

  【页面2：创建活动页】
  - 输入活动名称+日期+描述
  - 保存后活动出现在活动列表中

  【页面3：活动详情/相册页】
  - 顶部展示活动名称、日期、描述等信息
  - 网格展示活动内的照片缩略图
  - 提供"上传照片"按钮
  - 活动设置入口：查看参与者列表+邀请新参与者
  - 点击缩略图进入照片浏览（全屏查看）

  【页面4：上传照片页】
  - 选择图片（使用占位符URL输入）
  - 添加照片描述（可选）
  - 点击上传→上传成功→照片出现在活动相册网格中

  【页面5：照片浏览/详情页】
  - 全屏查看照片大图+描述+上传者信息+上传时间
  - 照片管理：上传者可删除自己上传的照片

  【页面6：个人中心（我的）】
  - 展示当前用户信息
  - 我的上传：当前用户上传过的照片记录
  - 提供退出登录入口

  邀请机制：
  - 活动创建者可邀请其他用户加入
  - 被邀请用户自动加入活动参与者列表
  - 仅活动参与者可查看和上传照片（RLS权限控制）

constraints: |
  单用户视角测试，不要求多设备；RLS策略确保仅参与者可访问；仅上传者可删除自己上传的照片。
  相册照片与头像使用 mock_resources 中的占位符图片URL作为示例数据。

notes: "后端CRUD样本+Storage。重点验证活动创建、照片上传/浏览/删除、邀请与参与者管理、个人上传记录以及RLS权限控制。单用户视角测试邀请功能。"
