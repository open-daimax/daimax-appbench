version: "2.0"
dataset_version: "v2"
sample_id: AquariumManager
title: 水族箱管理
app_type: 自然观察
requires_backend: true
requires_auth: true
complexity: high
status: active
data_mode: "backend_crud"

requirement: |
  实现一个水族箱管理应用，帮助用户管理鱼缸档案、监测水质、管理生物、设置投喂计划、管理设备维护、查看统计分析并参与社区鱼市交易：

  【导航结构】
  底部Tab导航共5个入口：我的鱼缸(主页)/水质监测/生物档案/投喂计划/社区鱼市

  【我的鱼缸页(主页)】
  1. 鱼缸列表：以卡片形式展示所有鱼缸，每张卡片显示鱼缸名称、容量、生物数量、最近水质状态指示
  2. 右上角"+"按钮进入添加鱼缸页
  3. 系统预置1个示例鱼缸（60cm草缸）供展示
  4. 空状态：无鱼缸时显示"还没有鱼缸，快来创建第一个吧"
  5. 统计仪表板入口按钮；设置入口按钮（设置页不占用底部Tab）

  【鱼缸详情页】
  6. 鱼缸基本信息：名称、类型（淡水/海水）、容量(升)、开缸日期、运行天数
  7. 水质概览：最近一次检测的pH/温度/氨氮数据及状态（正常/警告/危险）
  8. 生物列表：该鱼缸内的所有生物摘要
  9. 设备管理入口：查看该鱼缸的设备及维护日程
  10. 异常告警入口：查看该鱼缸的历史告警
  11. 编辑和删除按钮

  【添加鱼缸页】
  12. 填写鱼缸名称（必填）
  13. 选择类型：淡水/海水
  14. 输入容量（升）
  15. 选择开缸日期
  16. 保存后鱼缸出现在列表

  【水质监测页(Tab)】
  17. 所有鱼缸的水质记录列表（按时间倒序）
  18. 每条记录显示：鱼缸名、检测日期、pH值、温度、氨氮浓度、状态标签
  19. 状态标签：正常(绿色)/警告(黄色)/危险(红色)
  20. 右上角"+"进入记录水质页
  21. 搜索筛选入口按钮

  【水质搜索筛选页】
  22. 按鱼种筛选：选择特定鱼缸
  23. 按缸体类型筛选：淡水/海水/全部
  24. 按水质参数范围筛选：pH范围/温度范围/氨氮范围
  25. 按状态筛选：正常/警告/危险
  26. 组合筛选结果列表展示
  27. 支持保存常用筛选条件

  【记录水质页】
  28. 选择目标鱼缸
  29. 输入pH值（范围6.0-9.0）
  30. 输入温度（℃）
  31. 输入氨氮浓度（mg/L）
  32. 输入亚硝酸盐浓度（mg/L）
  33. 自动判定状态（pH 6.5-7.5且氨氮<0.5为正常，否则警告/危险）
  34. 保存后记录出现在水质监测列表

  【水质记录列表页】
  35. 某个鱼缸的历史水质记录（从鱼缸详情进入）
  36. 按时间倒序展示
  37. 每条显示检测日期、各项数据、状态

  【统计仪表板页】
  38. 水温趋势图：折线图展示所有鱼缸近30天水温变化
  39. pH趋势图：折线图展示近30天pH变化
  40. 亚硝酸盐趋势图：展示近30天亚硝酸盐浓度变化
  41. 多指标联合对比图表：支持选择多个指标叠加展示
  42. 鱼缸维度切换：选择查看单个鱼缸或所有鱼缸汇总
  43. 时间范围选择：7天/30天/90天

  【异常告警页】
  44. 告警列表：水质超标自动触发的告警记录
  45. 每条告警显示：鱼缸名、告警时间、超标指标、当前值、阈值、严重等级
  46. 告警状态：未处理/已处理/已忽略
  47. 历史告警统计：按月统计告警次数柱状图
  48. 按鱼缸/指标/等级筛选告警

  【生物档案页(Tab)】
  49. 所有生物列表：展示所有鱼缸中的生物
  50. 每项显示：生物名称、种类（鱼类/虾类/螺类/水草）、所属鱼缸、数量
  51. 支持按鱼缸筛选
  52. 右上角"+"进入添加生物页

  【生物详情页】
  53. 生物名称和种类
  54. 所属鱼缸
  55. 数量、入缸日期
  56. 饲养备注
  57. 编辑和删除按钮

  【添加生物页】
  58. 选择所属鱼缸
  59. 填写生物名称
  60. 选择种类：鱼类/虾类/螺类/水草
  61. 输入数量
  62. 选择入缸日期
  63. 填写饲养备注（可选）
  64. 保存后生物出现在档案列表

  【投喂计划页(Tab)】
  65. 投喂计划列表：展示所有鱼缸的投喂安排
  66. 每项显示：鱼缸名、饲料类型、投喂频率、下次投喂时间、状态（已喂/待喂）
  67. 点击"已投喂"按钮更新状态
  68. 右上角"+"进入设置投喂时间页

  【投喂记录页】
  69. 某个鱼缸的历史投喂记录
  70. 按时间倒序展示
  71. 每条显示投喂日期、饲料类型、投喂量

  【设置投喂时间页】
  72. 选择目标鱼缸
  73. 选择饲料类型（颗粒料/活饵/冷冻饲料）
  74. 设置投喂频率（每天1次/每天2次/隔天1次）
  75. 设置投喂时间
  76. 保存后出现在投喂计划列表

  【设备管理页】
  77. 某个鱼缸的设备列表
  78. 每项显示：设备名称、类型（过滤器/加热棒/灯具/气泵）、状态（运行中/已关闭）、下次维护日期
  79. 维护日程提醒：即将到期的维护高亮显示
  80. 点击设备查看维护历史记录
  81. 支持添加新设备
  82. 维护倒计时：距下次维护天数

  【添加设备页】
  83. 选择设备类型
  84. 填写设备名称
  85. 设置初始状态
  86. 设置维护周期（天）
  87. 设置上次维护日期
  88. 保存后出现在设备列表

  【社区鱼市页(Tab)】
  89. 交易信息流：展示鱼苗交换/转让帖子
  90. 每条帖子显示：发布者头像/昵称、标题、品种、价格/交换条件、图片、发布时间
  91. 筛选：按品种类型/交易方式(出售/交换/赠送)/价格区间
  92. 点击进入帖子详情

  【发布交易页】
  93. 选择交易方式：出售/交换/赠送
  94. 填写标题和描述
  95. 选择品种类型
  96. 设置价格（出售时）或交换条件
  97. 上传图片（最多6张）
  98. 发布后出现在鱼市信息流

  【交易详情页】
  99. 帖子完整信息
  100. 发布者信息和评价星级
  101. 联系发布者按钮
  102. 评价列表：历史交易评价

  【设置页】
  103. 水质警告阈值设置
  104. 投喂提醒开关
  105. 告警通知开关
  106. 设备维护提醒开关
  107. 温度单位切换（℃/℉）
  108. 个人信息编辑（昵称/头像）
  109. 关于应用信息

