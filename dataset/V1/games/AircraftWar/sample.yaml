version: "2.0"
sample_id: AircraftWar
title: 飞机大战
app_type: 游戏
game_category: 射击类
dataset_version: "v1"
status: active

requirement: |
  实现一个完整的竖版飞机大战射击游戏应用，提供从主菜单到对局、暂停、结算、排行榜的完整游戏体验，包含以下页面和功能：

  【页面结构】
  1. 主菜单页：
     - 显示游戏标题"飞机大战"
     - 三个按钮：开始游戏、排行榜、操作说明
     - 点击"开始游戏"进入游戏页面
     - 点击"排行榜"进入排行榜页面
     - 点击"操作说明"显示控制方式与规则说明（左右移动、自动射击、生命/道具规则）

  2. 游戏页面：
     - 游戏区域：竖版滚动背景（星空/地图效果）
     - 玩家飞机：固定在屏幕底部区域，只能左右移动
     - 敌机：从屏幕顶部随机位置出现，匀速向下移动
     - 子弹：玩家飞机自动发射，向上飞行
     - 顶部信息栏：当前分数 + 生命值显示（如3颗心）+ 暂停按钮
     - 控制按钮区（屏幕底部）：[左移] [右移]

  3. 暂停弹窗：
     - 点击顶部暂停按钮，游戏暂停，敌机/子弹/道具停止运动
     - 显示"游戏暂停"文字
     - 三个按钮：继续游戏、重新开始、返回主菜单
     - 点击"继续游戏"从暂停处恢复对局

  4. 游戏结束弹窗：
     - 显示"游戏结束"文字
     - 显示本次得分
     - 显示击落敌机总数
     - 如果刷新最高分则显示"新纪录！"提示
     - 两个按钮：重新开始、返回主菜单

  5. 排行榜页面：
     - 展示历史最高分榜单（按分数从高到低排序，至少保留前若干名）
     - 每条记录显示排名和分数
     - 首次无记录时显示空状态提示（如"暂无记录"）
     - 提供返回主菜单入口

  【游戏规则】
  - 玩家飞机固定在底部区域，通过左移/右移按钮水平移动
  - 玩家飞机不能移出屏幕左右边界
  - 自动射击：飞机每0.3秒自动发射一颗子弹向上飞行
  - 敌机从顶部随机水平位置出现，匀速向下移动
  - 子弹碰到敌机：敌机扣血，血量归零时敌机消失
  - 敌机碰到玩家飞机：玩家扣1条命，短暂无敌闪烁2秒

  【敌机类型】
  - 小型敌机：1颗子弹击落，+10分
  - 中型敌机：3颗子弹击落，+30分
  - Boss敌机：出现频率低，击落+100分

  【道具系统】
  - 击落敌机有概率掉落道具
  - 增强子弹道具：拾取后持续5秒双倍射速（每0.15秒发射一颗）
  - 道具从敌机消失位置向下掉落，玩家飞机碰到即拾取

  【生命系统】
  - 玩家初始3条命
  - 被敌机碰撞减1条命
  - 被撞后短暂无敌（闪烁2秒，期间不受伤害）
  - 生命归零时游戏结束

  【难度递增】
  - 分数每达到500分，敌机下落速度加快一级
  - 敌机生成频率随分数逐渐增加

  【控制方式】
  - 左移按钮：玩家飞机向左移动
  - 右移按钮：玩家飞机向右移动
  - 无需手动射击按钮，自动射击

  【数据存储】
  - 排行榜历史分数使用localStorage本地存储
  - 游戏结束时将本次得分写入排行榜，并按分数从高到低排序展示
  - 若当前分数超过历史最高分则标记为新纪录

core_functions:
  - 竖版滚动背景渲染
  - 玩家飞机渲染与左右移动（按钮控制）
  - 自动子弹发射（每0.3秒）与飞行
  - 敌机多类型生成（小型/中型/Boss）
  - 敌机从顶部随机位置匀速向下移动
  - 子弹与敌机碰撞检测
  - 敌机血量系统（小型1血/中型3血）
  - 敌机与玩家碰撞检测
  - 玩家生命系统（3条命）
  - 被撞后无敌闪烁（2秒）
  - 道具掉落与拾取（增强子弹）
  - 得分计算（小型+10/中型+30/Boss+100）
  - 难度递增（每500分敌机加速）
  - 暂停与恢复对局（暂停弹窗：继续/重新开始/返回主菜单）
  - 游戏结束弹窗（得分/击落数/新纪录）
  - 排行榜展示与排序（历史分数榜单）
  - 排行榜分数本地持久化存储(localStorage)
  - 主菜单导航（开始游戏/排行榜/操作说明）

constraints:
  - 纯单机游戏，无需网络
  - 无需用户登录
  - 仅使用按钮控制（左移/右移），禁止拖拽/手势操作
  - 自动射击，无需手动射击按钮
  - 最高分/排行榜使用localStorage本地持久化
  - 至少2种敌机类型（小型和中型）

notes: "V2版本：使用左移/右移按钮代替拖拽控制，自动射击无需手动，明确敌机类型和得分规则。重点验证按钮移动、自动射击、碰撞检测、生命系统、最高分持久化。"
