version: "2.0"
sample_id: CoffeeGuide
title: 咖啡制作指南
app_type: 生活
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的咖啡制作指南应用，帮助咖啡爱好者系统学习各种咖啡冲泡方式，并管理个人收藏与冲煮笔记：

  【数据与存储】
  1. 无需用户注册和登录，打开应用直接使用；收藏、笔记等个人数据本地存储

  【导航结构】
  2. 底部Tab导航：首页 / 分类 / 搜索 / 收藏 / 我的

  【首页】
  3. 顶部展示应用标题与搜索入口
  4. 推荐区：以横向卡片展示精选/热门制作方法，显示名称、难度标签、预计耗时、封面图
  5. 咖啡分类快捷入口（手冲、意式、冷萃、虹吸），点击进入对应分类列表

  【分类页】
  6. 以卡片展示咖啡大类（手冲、意式、冷萃、虹吸），每类显示名称、封面图、一句话简介、方法数量
  7. 点击分类进入该分类的制作方法列表

  【制作方法列表页】
  8. 展示该分类下所有制作方法，列表形式，每项显示名称、难度标签(初学🟢/进阶🟡/专业🔴)、预计耗时(分钟)、缩略图
  9. 顶部难度筛选按钮：全部/初学/进阶/专业
  10. 支持排序切换：按难度 / 按耗时
  11. 点击进入制作详情

  【制作详情页】
  12. 顶部显示方法名称、封面图、难度标签、预计耗时
  13. 器具清单区域：列出所需咖啡器具（如V60滤杯、手摇磨豆机、滤纸等）
  14. 参数区域：推荐研磨度(粗/中/细)、水温(°C)、粉水比(如1:15)
  15. 分步骤指引：每步有序号+文字描述（至少5步）
  16. 内嵌计时器：点击"开始萃取"后按萃取时长倒计时，可暂停/重置
  17. 收藏按钮：点击收藏/取消收藏（本地存储）
  18. 个人笔记：可为该方法记录一句冲煮心得并本地保存

  【搜索页】
  19. 顶部搜索输入框，实时匹配方法名称与所属分类
  20. 搜索结果列表，样式与方法列表一致
  21. 无结果时显示空状态提示

  【收藏页(个人收藏管理)】
  22. 展示用户收藏的制作方法列表，每项显示名称、分类、难度
  23. 点击进入详情；支持在收藏页取消收藏
  24. 无收藏时显示空状态提示"还没有收藏，去发现喜欢的冲泡方式吧"

  【我的/设置页】
  25. 展示个人资料（本地昵称/头像）与收藏数量统计
  26. 设置项：计时提示音开关、研磨度单位说明、清除本地缓存
  27. 关于页面入口

core_functions:
  - 首页推荐与分类快捷入口
  - 咖啡分类卡片浏览(4个分类)
  - 制作方法列表展示(名称/难度/耗时)与排序(难度/耗时)
  - 难度筛选(全部/初学/进阶/专业)
  - 关键词搜索(方法名称/分类)与空状态
  - 制作详情(器具清单/参数/步骤指引)
  - 内嵌倒计时计时器(开始/暂停/重置)
  - 个人笔记记录(本地存储)
  - 收藏与取消收藏(本地存储)
  - 收藏页管理与空状态
  - 我的/设置页(个人资料/偏好设置)

constraints: |
  纯前端应用，数据硬编码；收藏状态存localStorage；计时器精度±500ms。
  内置数据：
  - 手冲类：V60手冲(初学/4min)、Chemex(进阶/5min)、Kalita(初学/4min)
  - 意式类：浓缩咖啡(进阶/1min)、拿铁(初学/3min)、卡布奇诺(进阶/3min)
  - 冷萃类：冷泡咖啡(初学/720min)、日式冰咖啡(进阶/5min)、氮气冷萃(专业/360min)
  - 虹吸类：虹吸壶(专业/6min)、比利时壶(专业/8min)

notes: "纯前端咖啡百科应用。重点验证分类浏览、难度筛选、制作步骤详情展示、内嵌计时器、收藏交互等功能。"
