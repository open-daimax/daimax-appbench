version: "2.0"
sample_id: CoffeeRoastLog
title: 咖啡烘焙日志
app_type: 饮品酿造
dataset_version: "V2"
complexity: high
requires_backend: false
requires_auth: false

requirement: |
  实现一个咖啡烘焙日志应用，为咖啡烘焙爱好者提供烘焙曲线记录、豆种百科、杯测笔记与库存管理功能：

  【烘焙记录Tab】
  1. 烘焙记录列表：按时间倒序展示烘焙日志，每条显示日期、豆种名称、烘焙度、总时长
  2. 支持按烘焙度筛选（浅烘/中烘/中深/深烘）
  3. 点击进入烘焙详情
  4. 系统预置至少5条示例烘焙记录

  【豆种百科Tab】
  5. 豆种卡片列表：显示产地、品种、处理法、风味描述
  6. 按产区分类浏览（非洲/中南美/亚太）
  7. 点击进入豆种详情：完整信息+推荐烘焙参数
  8. 预置至少8种咖啡豆数据

  【杯测笔记Tab】
  9. 杯测记录列表：显示豆种名称、杯测日期、总分
  10. 支持按总分排序
  11. 点击进入杯测详情

  【库存Tab】
  12. 库存列表：显示豆种名称、剩余量(g)、入库日期、状态标签(充足/即将耗尽/已耗尽)
  13. 支持按状态筛选
  14. 入库/出库操作记录

  【设置Tab】
  15. 烘焙设备管理列表
  16. 数据导出入口
  17. 偏好设置（温度单位℃/℉、重量单位g/oz）

  【烘焙详情页(含曲线)】
  18. 烘焙基本信息：日期、豆种、投豆量、烘焙度
  19. 烘焙曲线图表：时间-温度折线图（标记一爆/二爆点）
  20. 关键节点记录：转黄点、一爆开始、一爆结束、出豆温度
  21. 烘焙笔记文字

  【新建烘焙记录】
  22. 选择豆种（从百科中选择）
  23. 填写投豆量、目标烘焙度
  24. 记录时间-温度数据点（手动添加节点）
  25. 标记一爆/二爆时间点
  26. 保存烘焙记录

  【新建杯测】
  27. 选择杯测豆种
  28. 杯测评分：干香/湿香/酸质/醇厚度/风味/余韵/均衡度/干净度（各1-10分）
  29. 总分自动计算
  30. 风味描述标签选择（花香/果香/坚果/巧克力/焦糖等）
  31. 杯测笔记文字

pages:
  - name: "烘焙记录列表"
    level: "L1"
    description: "烘焙日志时间线展示与筛选"
    entry_from: "底部Tab-烘焙"
  - name: "豆种百科"
    level: "L1"
    description: "咖啡豆种分类浏览"
    entry_from: "底部Tab-豆种"
  - name: "杯测笔记列表"
    level: "L1"
    description: "杯测记录列表与排序"
    entry_from: "底部Tab-杯测"
  - name: "库存管理"
    level: "L1"
    description: "咖啡豆库存状态与操作"
    entry_from: "底部Tab-库存"
  - name: "设置"
    level: "L1"
    description: "设备管理与偏好设置"
    entry_from: "底部Tab-设置"
  - name: "烘焙详情"
    level: "L2"
    description: "烘焙曲线图表与关键节点"
    entry_from: "烘焙记录列表-点击记录"
  - name: "豆种详情"
    level: "L2"
    description: "豆种完整信息与推荐参数"
    entry_from: "豆种百科-点击豆种卡片"
  - name: "杯测详情"
    level: "L2"
    description: "杯测评分与风味详情"
    entry_from: "杯测笔记列表-点击记录"
  - name: "库存详情"
    level: "L2"
    description: "单个豆种库存变动记录"
    entry_from: "库存管理-点击库存项"
  - name: "设备列表"
    level: "L2"
    description: "烘焙设备档案管理"
    entry_from: "设置-设备管理入口"
  - name: "新建烘焙记录"
    level: "L3"
    description: "录入烘焙数据与曲线"
    entry_from: "烘焙记录列表-新建按钮"
  - name: "编辑烘焙曲线"
    level: "L3"
    description: "添加时间-温度数据点"
    entry_from: "新建烘焙记录-曲线编辑步骤"
  - name: "新建杯测"
    level: "L3"
    description: "杯测评分表单"
    entry_from: "杯测笔记列表-新建按钮"
  - name: "入库出库操作"
    level: "L3"
    description: "库存入库/出库操作表单"
    entry_from: "库存管理-入库/出库按钮"

navigation:
  type: bottom_tab
  tabs:
    - { name: "烘焙", icon: "flame", page: "烘焙记录列表" }
    - { name: "豆种", icon: "coffee", page: "豆种百科" }
    - { name: "杯测", icon: "clipboard", page: "杯测笔记列表" }
    - { name: "库存", icon: "package", page: "库存管理" }
    - { name: "设置", icon: "settings", page: "设置" }

core_functions:
  - 烘焙记录管理（含曲线图表与关键节点）
  - 豆种百科浏览与分类
  - 杯测评分（8维度+风味标签）
  - 库存入库/出库管理
  - 烘焙度筛选
  - 设备档案管理

constraints:
  - 纯前端应用，数据存储使用localStorage
  - 烘焙曲线使用折线图展示，至少支持10个数据点
  - 杯测评分使用1-10分制，总分为各项平均值
  - 库存状态自动计算：≥500g充足、100-499g即将耗尽、<100g已耗尽
  - 预置至少5条烘焙记录和8种豆种数据

notes: "纯前端咖啡烘焙应用。重点验证：选豆种→设定烘焙参数→记录曲线数据点→杯测评分→库存管理的完整闭环。"
