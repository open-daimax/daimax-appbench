version: "2.0"
sample_id: ShortVideo
title: 短视频
app_type: 社交
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
requires_backend: true
requires_auth: true

requirement: |
  实现一个抖音风格的短视频应用，是一个功能完整的真实社交产品。
  应用采用底部Tab导航，包含首页（视频流）、发现、发布、消息、我的五个主入口，
  覆盖内容创建闭环、互动体系（点赞/评论/分享）、用户体系、内容发现与通知系统。

  【页面1：登录注册页】
  - 支持用户注册和登录
  - 注册表单：邮箱、密码、昵称（注册时可填）
  - 登录表单：邮箱、密码
  - 提供登录/注册切换入口
  - 注册成功后自动登录并跳转视频流主页
  - 表单校验：邮箱格式、密码长度，错误时给出提示

  【页面2：视频流主页（Tab-首页）】
  - 全屏单视频播放界面，上下滑动切换视频（或提供上/下切换按钮）
  - 顶部频道切换：如"关注""推荐"两个标签
  - 应用内置以上5个mock视频源作为展示内容，视频自动播放
  - 右侧交互栏：
    - 作者头像（圆形，含关注按钮）
    - 点赞按钮❤️（点击变红+计数+1，再次点击取消-1）
    - 评论按钮💬（点击弹出底部评论区，显示评论数）
    - 分享按钮↗️
  - 底部显示视频标题、作者名和描述
  - "关注"标签展示已关注作者的视频，无关注时显示空状态引导

  【页面3：发现/搜索页（Tab-发现）】
  - 顶部搜索栏：输入关键词搜索视频标题和作者
  - 热门视频榜：以网格或列表展示热门视频缩略图 + 标题 + 播放/点赞量
  - 分类/话题入口：如风景、美食、动画、技术等分类
  - 搜索历史记录：展示最近搜索词，可清空
  - 搜索结果以网格展示匹配视频，点击可播放；无结果时显示空状态提示

  【页面4：发布视频页（Tab-发布）】
  - 输入视频URL（文本输入框，模拟发布，不真实上传文件）
  - 输入视频标题（必填）
  - 输入视频描述
  - 添加话题标签（可选）
  - 点击发布按钮完成发布，成功后视频出现在个人主页
  - 表单校验：URL和标题必填，缺失时给出提示

  【页面5：视频评论区（底部弹层）】
  - 在视频流点击评论按钮弹出底部评论区
  - 评论列表：显示评论者头像 + 昵称 + 内容 + 时间，支持点赞评论
  - 评论输入框：输入文字发送评论，新评论即时出现在列表
  - 无评论时显示空状态提示

  【页面6：消息/通知页（Tab-消息）】
  - 通知分类入口：点赞、评论、新增粉丝（关注）
  - 互动通知列表：展示谁点赞/评论了我的视频（头像+昵称+动作描述+时间+视频缩略图）
  - 点击通知可跳转到对应视频
  - 无通知时显示空状态提示

  【页面7：个人主页/我的（Tab-我的）】
  - 顶部资料区：头像、昵称、简介、粉丝数、关注数、获赞总数
  - "编辑资料"入口：可修改昵称、简介、头像
  - 我的视频网格：缩略图列表展示已发布的视频，点击可进入播放
  - 视频支持长按或菜单删除（仅删除自己发布的）
  - 设置/退出登录入口

constraints: |
  应用必须内置以上5个视频URL作为预置内容；发布视频为输入URL模拟，不真实上传文件。

notes: "后端CRUD样本，用户上传短视频。必须提供mock_resources中的视频URL，否则应用为空壳无法测试。"
