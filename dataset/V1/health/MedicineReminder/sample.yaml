version: "2.0"
dataset_version: "v2"
sample_id: MedicineReminder
title: 用药提醒
app_type: 健康
data_mode: "frontend_mock"

requirement: |
  实现一个完整的用药提醒管理应用，帮助用户管理日常服药、记录服药历史并管理家人用药。无需用户注册和登录，打开应用直接进入应用主界面。

  【导航结构】
  底部Tab导航共4个入口：今日(主页)/日历/统计/我的。添加药品、家人管理、设置等为二级页面。

  【启动与数据】
  1. 无需用户注册和登录，打开应用直接进入今日用药主页
  2. 所有数据本地存储，重进应用后数据保留

  【今日用药页(主页)】
  3. 顶部成员切换：在"我"和已添加家人之间切换，查看对应成员的今日服药任务
  4. 今日服药任务列表：每项显示药品名称+服药时间+状态标签
  5. 状态标签：待服(蓝色)、已服(绿色✓)、跳过(灰色)、漏服(红色，超过时间未操作)
  6. 点击"已服药"按钮→状态变为已服+记录时间
  7. 点击"跳过"按钮→状态变为跳过+记录原因(可选)
  8. 页面内提醒：当到达服药时间时，对应药品行高亮闪烁+顶部显示红色提醒横幅"该吃药了：{药品名}"
  9. 时间点推荐：每天1次默认08:00，每天2次默认08:00和20:00，每天3次默认08:00、14:00、20:00

  【药品管理】
  10. 药品列表：展示所有已添加药品(名称/频次/库存/周期进度)，支持编辑和删除
  11. 添加/编辑药品：药品名称、服药频次(每天1次/2次/3次/自定义)、服药时间(自动推荐+手动修改)、当前库存(整数)、用药周期(连续N天，从今天开始)、所属成员
  12. 保存后自动生成今日及未来的服药计划
  13. 删除药品需二次确认，同时移除其未来服药计划

  【用药日历页】
  14. 月度日历视图：每天格子内用圆点标记（绿色=全部完成，黄色=部分完成，红色=全部漏服，灰色=无任务）
  15. 点击某天→查看当天各药品服药详情
  16. 支持切换查看不同月份

  【统计页】
  17. 服药依从率：已服次数 ÷ (已服+跳过+漏服) × 100%
  18. 近7天依从率折线图
  19. 库存预警：剩余库存≤3天用量时显示红色警告
  20. 各药品周期进度条：已服天数/总周期天数
  21. 支持按成员筛选统计数据

  【家人管理页】
  22. 家人成员列表：显示姓名、关系、名下药品数量
  23. 添加/编辑/删除家人成员(姓名+关系，如父母/子女)
  24. 每个成员拥有独立的药品与服药记录

  【我的/设置页(个人中心)】
  25. 个人资料展示(头像/昵称，本地保存，昵称可编辑)
  26. 家人管理入口、药品管理入口
  27. 提醒开关与默认服药时间偏好设置
  28. 关于页面入口

  库存递减规则：仅当点击"已服药"时库存-1，跳过不减库存

pages:
  - name: "今日用药页(主页)"
    description: "今日服药任务列表和页面内提醒"
    features:
      - "成员切换查看对应服药任务"
      - "服药任务列表：药品名+时间+状态标签"
      - "状态标签：待服(蓝)/已服(绿✓)/跳过(灰)/漏服(红)"
      - "已服药/跳过按钮"
      - "页面内提醒：到时间高亮闪烁+红色横幅"

  - name: "药品管理页"
    description: "药品信息和服药计划的增改删"
    features:
      - "药品列表(名称/频次/库存/周期进度)"
      - "添加/编辑药品(名称/频次/时间/库存/周期/成员)"
      - "频次选择(1次/2次/3次/自定义)+时间自动推荐"
      - "删除药品需二次确认"

  - name: "用药日历页"
    description: "月度日历展示每日服药完成情况"
    features:
      - "月度日历视图+月份切换"
      - "圆点标记(绿=全完成/黄=部分/红=全漏/灰=无任务)"
      - "点击某天查看服药详情"

  - name: "统计页"
    description: "依从率统计和库存预警"
    features:
      - "服药依从率百分比"
      - "近7天依从率折线图"
      - "库存预警(≤3天用量红色警告)"
      - "各药品周期进度条"
      - "按成员筛选统计"

  - name: "家人管理页"
    description: "家人成员及其用药管理"
    features:
      - "家人成员列表(姓名/关系/药品数)"
      - "添加/编辑/删除家人成员"
      - "各成员独立药品与记录"

  - name: "我的/设置页(个人中心)"
    description: "个人资料与偏好设置"
    features:
      - "个人资料展示(头像/昵称，本地保存)"
      - "家人管理、药品管理入口"
      - "提醒开关与默认服药时间设置"
      - "关于页面入口"

core_functions:
  - 今日服药任务列表(药品名/时间/状态)
  - 服药确认(已服→库存-1)和跳过(库存不变)
  - 页面内到时提醒(高亮闪烁+红色横幅)
  - 药品管理(添加/编辑/删除+频次/时间/库存/周期)
  - 月度用药日历(颜色圆点标记完成情况)
  - 服药依从率统计和折线图
  - 库存预警(≤3天用量)与周期进度条
  - 家人成员管理(增改删)与多成员数据隔离
  - 个人中心与提醒偏好设置

constraints: "提醒使用页面内倒计时和高亮方式实现，不依赖系统本地通知；库存仅在点击已服药时递减，跳过不减库存；药品、服药记录、家人成员等数据本地存储；无需用户注册和登录，打开应用直接进入主界面。"

notes: "前端用药管理样本。重点验证：服药状态流转准确性、页面内提醒触发、库存递减逻辑(仅已服减库存)、依从率计算公式、日历颜色标记正确性、药品增改删、家人成员多数据隔离、个人中心设置。"
