version: "2.0"
sample_id: SkiResort
title: 滑雪场指南
app_type: 生活
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的滑雪场指南应用，帮助用户浏览雪场信息、查看雪道与天气、获取装备建议并管理个人收藏：

  【数据与存储】
  1. 无需用户注册和登录，打开应用直接使用；收藏等个人数据本地存储

  【导航结构】
  2. 底部Tab导航：首页 / 搜索 / 收藏 / 我的

  【首页-雪场列表】
  3. 以卡片形式展示滑雪场列表（内置多个雪场数据）
  4. 每张卡片：雪场名称、位置、封面图、当前雪况标签(优良🟢/一般🟡/差🔴)、开放状态
  5. 顶部筛选：按雪况/开放状态筛选
  6. 支持排序切换：按海拔 / 按雪道数量

  【雪场详情页】
  7. 雪场名称+位置+海拔+封面图
  8. 基本信息：雪道数量、缆车数量、最长雪道长度、适合级别
  9. 营业时间和价格信息（日场/夜场价格）
  10. 实时天气与雪情区域：气温、天气状况、积雪厚度、风力
  11. 设施列表：餐厅/休息区/租赁店/急救站
  12. 收藏按钮：收藏/取消收藏该雪场（本地存储）
  13. "查看雪道"按钮 → 进入雪道信息页；"装备建议"按钮 → 进入装备建议页

  【雪道信息页】
  14. 按难度分级展示雪道列表：
     - 绿色初级道(🟢)：坡度<15°，适合新手
     - 蓝色中级道(🔵)：坡度15-25°，需要基础技术
     - 黑色高级道(⚫)：坡度>25°，需要熟练技术
  15. 每条雪道：名称、长度(m)、坡度、当前状态(开放/关闭/整修)；关闭/整修雪道有明显视觉标记

  【装备建议页】
  16. 按滑雪水平推荐装备清单（初学者/中级/高级），可切换水平查看
  17. 每件装备：名称+用途说明+租赁参考价格
  18. 安全提示列表

  【搜索页】
  19. 顶部搜索输入框，实时匹配雪场名称与位置
  20. 搜索结果列表，样式与首页列表一致
  21. 无结果时显示空状态提示

  【收藏页(个人管理)】
  22. 展示用户收藏的雪场列表，每项显示名称、位置、雪况
  23. 点击进入详情；支持在收藏页取消收藏
  24. 无收藏时显示空状态提示

  【我的/设置页】
  25. 展示个人资料（本地昵称/头像）与收藏数量统计
  26. 设置项：温度单位切换(°C/°F)、雪道坡度单位说明、清除本地缓存
  27. 关于页面入口

core_functions:
  - 雪场卡片列表浏览与排序(海拔/雪道数量)
  - 雪况/开放状态筛选
  - 关键词搜索(雪场名称/位置)与空状态
  - 雪场详情(基本信息/价格/设施/天气)
  - 雪道按难度分级展示(初级/中级/高级)
  - 雪道状态标记(开放/关闭/整修)
  - 装备建议(按水平推荐)与安全提示
  - 雪场收藏与取消收藏(本地存储)
  - 收藏页管理与空状态
  - 我的/设置页(个人资料/偏好设置)

constraints: |
  纯前端应用，数据硬编码。
  内置数据：
  - 万龙滑雪场(崇礼/海拔2110m/雪况优良/开放)：5条初级+3条中级+2条高级
  - 北大壶滑雪场(吉林/海拔1408m/雪况优良/开放)：4条初级+4条中级+3条高级
  - 松花湖滑雪场(吉林/海拔1032m/雪况一般/开放)：6条初级+2条中级+1条高级

notes: "纯前端滑雪场指南应用。重点验证雪场信息展示、雪况筛选、雪道难度分级、装备建议等功能。"
