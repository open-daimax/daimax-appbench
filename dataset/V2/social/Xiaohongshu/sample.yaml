version: "2.0"
sample_id: Xiaohongshu
title: 小红书
app_type: 社交
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
requires_backend: true
requires_auth: true

requirement: |
  实现一个小红书风格的图文种草社区应用，是一个功能完整的真实社交产品。
  应用采用底部Tab导航，包含首页、发现、发布、消息、我的五个主入口，覆盖内容创建闭环、
  互动体系、用户体系、内容发现与通知系统。

  【页面1：登录注册页】
  - 支持用户注册和登录
  - 注册表单：邮箱、密码、昵称（注册时可填）
  - 登录表单：邮箱、密码
  - 提供登录/注册切换入口
  - 注册成功后自动登录并跳转首页
  - 表单校验：邮箱格式、密码长度，错误时给出提示
  - UI布局：顶部Logo+应用名，中部输入表单，主按钮，底部切换文案

  【页面2：首页信息流（Tab-首页）】
  - 顶部：搜索入口栏 + 频道切换（如"推荐""关注"两个标签）
  - 双列瀑布流展示笔记卡片：封面图 + 标题 + 作者头像 + 作者昵称 + 点赞数（含红心图标）
  - 系统预置至少5条示例笔记（含图片占位符和文字内容）
  - 支持下拉刷新加载最新内容
  - 支持上拉加载更多（分页）
  - 点击笔记卡片进入笔记详情页
  - "关注"标签展示已关注用户的笔记，无关注时显示空状态引导

  【页面3：发现/搜索页（Tab-发现）】
  - 顶部搜索栏：输入关键词搜索笔记标题和正文内容
  - 热门话题标签云：展示热门话题（如#旅行 #美食 #穿搭），点击进入话题聚合
  - 分类导航：美食、旅行、穿搭、美妆、生活等分类入口
  - 搜索历史记录：展示最近搜索词，可清空
  - 搜索结果以瀑布流展示匹配笔记；无结果时显示空状态提示

  【页面4：发布笔记页（Tab-发布）】
  - 选择图片（使用占位符URL，支持多张，展示图片预览网格，可删除已选图片）
  - 输入笔记标题（必填）
  - 输入正文内容（多行文本）
  - 添加话题标签（如#旅行 #美食，支持多个）
  - 选择分类
  - 点击发布按钮完成发布，成功后跳转首页且笔记出现在信息流顶部
  - 表单校验：标题和图片必填，缺失时给出提示

  【页面5：笔记详情页】
  - 顶部图片轮播（多图左右滑动，含指示器）
  - 显示标题、正文内容、话题标签、发布时间
  - 作者信息栏：头像 + 昵称 + "关注/已关注"按钮
  - 底部固定操作栏：点赞（点击变红+计数+1，再次取消）、收藏（点击变黄+计数+1，再次取消）、评论数、分享按钮
  - 评论区：评论列表（评论者头像+昵称+内容+时间），支持点赞评论
  - 评论输入框：输入文字发送评论，新评论即时出现在列表

  【页面6：消息/通知页（Tab-消息）】
  - 通知分类入口：赞和收藏、评论、新增关注（粉丝）
  - 互动通知列表：展示谁点赞/收藏/评论了我的笔记（头像+昵称+动作描述+时间+相关笔记缩略图）
  - 点击通知可跳转到对应笔记详情
  - 无通知时显示空状态提示

  【页面7：个人主页/我的（Tab-我的）】
  - 顶部资料区：头像、昵称、简介、粉丝数、关注数、获赞与收藏数
  - "编辑资料"入口：可修改昵称、简介、头像
  - "我的笔记"Tab：网格展示用户发布的所有笔记
  - "我的收藏"Tab：展示用户收藏的笔记列表
  - 笔记支持长按或菜单删除（仅删除自己的）
  - 设置/退出登录入口

constraints: |
  需使用真实的后端应用。
  系统预置5条示例笔记和3个示例用户；搜索无结果时显示空状态提示。

notes: "后端CRUD样本，用户自己发布图文笔记。数据为用户自产内容，系统预置示例数据用于首次展示。"
