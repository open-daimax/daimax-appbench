version: "2.0"
sample_id: PomodoroTimer
title: 番茄钟
app_type: 工具
dataset_version: "v2"
data_mode: "frontend_only"

requirement: |
  实现一个功能完整的番茄钟专注计时应用，帮助用户通过番茄工作法管理专注时间、记录专注历史、养成专注习惯。

  【整体导航结构】
  应用采用底部 Tab 导航，包含 3 个主 Tab：
  - "专注"（计时主页，默认首页）
  - "统计"（历史记录与数据统计页）
  - "我的"（设置与偏好页）

  【专注页 - 计时主页（默认首页）】
  1. 顶部显示今日专注概览："今日已完成 X 个🍅" 及今日累计专注时长
  2. 中央大圆形倒计时显示：MM:SS 格式，红色番茄色主题；圆环随倒计时进度收缩
  3. 当前状态标签：专注中🍅 / 短休息☕ / 长休息🌴
  4. 当前番茄轮次指示：以 4 个小圆点显示本轮已完成番茄数（用于长休息进度提示）
  5. 开始按钮：点击开始专注倒计时（默认 25 分钟，读取设置值）
  6. 暂停/继续按钮：进行中可暂停，暂停后可继续
  7. 放弃按钮：放弃当前番茄，回到初始待开始状态，且不计入统计
  8. 倒计时结束：自动切换到休息模式（短休息 5 分钟）
  9. 每完成 4 个番茄后，自动切换为长休息（15 分钟）
  10. 休息结束后自动切换回专注模式（不自动开始，等待用户点击开始）
  11. 可选任务标签输入框：开始前可为本番茄填写一个任务名（如"写周报"），记录到历史

  【统计页 - 历史记录与数据】
  12. 今日完成的番茄列表：每条显示开始时间+结束时间+任务标签（若有）
  13. 近 7 天统计：以柱状图展示每天完成的番茄数
  14. 累计数据卡片：累计总番茄数、累计专注时长、连续专注天数
  15. 点击某天柱状图，可展开查看当天的番茄明细列表
  16. 无任何记录时显示空状态："还没有专注记录，开始你的第一个番茄吧🍅"

  【我的页 - 设置与偏好】
  17. 专注时长设置（默认 25 分钟，可选 15/20/25/30/45 分钟）
  18. 短休息时长（默认 5 分钟，可选 3/5/10 分钟）
  19. 长休息时长（默认 15 分钟，可选 10/15/20/30 分钟）
  20. 长休息间隔（默认每 4 个番茄，可选 3/4/5/6 个）
  21. 结束提示音开关：番茄/休息结束时是否播放提示音（开/关）
  22. 自动开始下一阶段开关：休息结束后是否自动开始下一个番茄（默认关）
  23. 清空所有历史记录入口：点击后二次确认，清空全部统计数据
  24. 设置修改后立即持久化，并在返回计时页时生效

  【数据流转说明】
  用户在专注页开始→完成番茄后写入历史记录并更新今日统计→统计页展示今日列表与7天柱状图→
  我的页修改时长设置影响后续倒计时→清空历史后统计页回到空状态。

core_functions:
  - 底部Tab导航(专注/统计/我的)
  - 大圆形倒计时显示(MM:SS)与进度圆环
  - 专注/短休息/长休息状态切换
  - 开始/暂停/继续/放弃操作
  - 本轮番茄轮次指示(4圆点)
  - 可选任务标签记录
  - 自动切换休息模式
  - 长休息触发(每4个番茄)
  - 今日番茄数与专注时长统计
  - 历史记录列表与近7天柱状图
  - 累计数据(总番茄/总时长/连续天数)
  - 时长设置(专注/短休/长休/间隔)
  - 提示音/自动开始开关
  - 清空历史记录
  - 空状态展示

constraints: "纯前台计时；历史数据存localStorage；关闭页面后不恢复；精度±500ms"

notes: "纯前端番茄钟应用。重点验证倒计时精度、状态自动切换逻辑、暂停继续、长休息触发、设置生效等功能。"
