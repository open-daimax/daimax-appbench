version: "2.0"
sample_id: NewsReader
title: 新闻阅读
app_type: 资讯
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
data_mode: "frontend_local"

requirement: |
  实现一个功能完整的新闻阅读器应用，支持分类频道浏览、阅读详情、搜索、收藏、离线阅读与个性化设置：

  【账户与登录】
  1. 支持用户注册和登录；未登录也可阅读，收藏、设置等个人数据在登录后与账户关联

  【导航结构】
  2. 底部Tab导航：首页 / 搜索 / 收藏 / 我的

  【首页-新闻列表】
  3. 顶部分类频道Tab(推荐/科技/财经/体育/娱乐)，点击切换分类
  4. 每条新闻显示：标题、摘要(一行截断)、来源、发布时间、缩略图
  5. 支持下拉刷新列表
  6. 点击新闻进入详情页

  【新闻详情页】
  7. 标题、来源、发布时间
  8. 正文内容（3-5段文字）
  9. 底部相关推荐(2-3条同分类新闻)，点击可跳转
  10. 收藏按钮与字体随设置生效

  【搜索页】
  11. 顶部搜索输入框
  12. 实时搜索匹配标题和摘要
  13. 搜索结果列表(与首页列表样式一致)
  14. 无结果时显示空状态

  【收藏页】
  15. 已收藏文章列表
  16. 点击进入详情；支持取消收藏
  17. 无收藏时显示空状态提示
  18. 离线阅读：已收藏文章可在无网络时从本地数据读取正文

  【我的/设置页】
  19. 展示当前账户信息（登录后）与收藏数量统计
  20. 字体大小选择(小/中/大，对应14px/16px/18px)，设置即时生效
  21. 夜间模式开关，切换背景色与文字色
  22. 清除本地缓存、关于页面入口、退出登录入口

core_functions:
  - 用户注册与登录
  - 分类Tab切换浏览新闻(5个分类)
  - 下拉刷新列表
  - 新闻详情阅读(标题/来源/正文/相关推荐)
  - 关键词搜索(实时过滤标题和摘要)与空状态
  - 文章收藏与取消收藏
  - 收藏文章离线阅读
  - 字体大小调节(小/中/大)
  - 夜间模式切换
  - 我的/设置页(账户信息/偏好设置/退出登录)

constraints: |
  纯前端应用，新闻数据全部硬编码(20条)，不依赖外部RSS或API。
  收藏和设置存localStorage。
  搜索为前端本地过滤，匹配标题和摘要。
  字体大小影响正文显示(14px/16px/18px)。
  夜间模式切换背景色(白->深灰)和文字色(黑->浅灰)。
  内置数据(每分类4条)：
  - 推荐：年度科技大会召开、股市再创新高、世界杯预选赛开打、新电影票房破纪录
  - 科技：AI大模型最新突破、5G商用覆盖扩大、新能源电池技术革新、量子计算里程碑
  - 财经：央行利率决议公布、独角兽企业IPO、跨境电商政策利好、数字货币试点扩围
  - 体育：奥运会筹备进展、NBA新赛季开幕、马拉松赛事报名、电竞入亚运正式项目
  - 娱乐：热门综艺新一季、音乐节阵容公布、影帝影后揭晓、游戏大作发售日确认

notes: "纯前端新闻阅读应用。重点验证分类浏览、搜索过滤、收藏管理、字体调节、夜间模式等功能。"
