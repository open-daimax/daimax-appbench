version: "2.0"
sample_id: RestaurantReview
title: 餐厅点评
app_type: 餐饮
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个完整的餐厅点评应用，用户可浏览附近餐厅、搜索筛选、查看详情、发表评价、收藏餐厅并管理个人中心。支持用户注册和登录，登录后进入应用主界面。

  【导航结构】
  底部Tab导航共3个入口：附近(首页)/收藏/我的。餐厅详情、发表评价、我的评价等为二级页面。

  【登录/注册页】
  1. 支持用户注册和登录，提供邮箱+密码方式
  2. 登录成功后进入附近餐厅首页

  【首页-附近餐厅】
  3. 展示8家预置餐厅列表
  4. 每家显示：名称、评分(1-5星)、人均消费、距离(km)、封面图
  5. 顶部搜索框：按餐厅名或菜系搜索
  6. 支持按距离/评分/人均三种排序方式切换
  7. 支持按菜系/人均区间筛选
  8. 点击餐厅进入详情页

  【餐厅详情页】
  9. 餐厅基本信息：名称、地址、电话、营业时间
  10. 环境照片区域(多张餐厅照片)
  11. 菜品推荐区域(3-4道招牌菜，含图片和价格)
  12. 评分概览：平均分、各星级评价数量分布
  13. 用户评价列表(每家预置3条评价，含头像、评分、内容)
  14. 收藏按钮、发表评价入口

  【发表评价页】
  15. 评分选择(1-5星点击选择)
  16. 文字评价输入框(10-200字，实时字数提示)
  17. 标签选择(环境好/服务好/味道赞/性价比高，可多选)
  18. 提交评价按钮，提交后评价出现在详情页并影响平均分

  【我的收藏页】
  19. 已收藏餐厅列表
  20. 点击可进入详情
  21. 滑动或按钮取消收藏

  【我的/个人中心页】
  22. 用户信息展示(头像/昵称/邮箱)
  23. 我的评价列表：显示餐厅名+评分+内容，可编辑和删除(删除需二次确认)
  24. 我的收藏入口
  25. 退出登录

core_functions:
  - 用户注册与登录
  - 餐厅列表浏览、搜索与排序(距离/评分/人均)与筛选
  - 餐厅详情展示(信息/环境照片/菜品/评分概览/评价)
  - 发表评价(评分+文字+标签，字数10-200校验)
  - 收藏与取消收藏餐厅
  - 我的评价管理(查看/编辑/删除)
  - 个人中心

constraints: |
  需使用真实的后端应用。
  支持用户注册和登录。
  餐厅基础数据为预置种子数据(8家)，每家预置3-4道招牌菜(含名称/价格/图片)与3条用户评价。
  用户评价、收藏、个人信息存储在后端。
  评分为整数1-5星。
  评价文字最少10字最多200字。
  删除评价需二次确认弹窗。
  内置数据：
  - 老四川火锅：人均85元，距离0.8km，评分4.5
  - 意大利小馆：人均120元，距离1.2km，评分4.3
  - 樱花日料：人均150元，距离2.0km，评分4.7
  - 麦香汉堡：人均35元，距离0.5km，评分4.0
  - 甜蜜时光：人均45元，距离1.5km，评分4.2
  - 粤港茶餐厅：人均65元，距离0.9km，评分4.4
  - 泰味坊：人均78元，距离2.5km，评分4.1
  - 新疆大盘鸡：人均55元，距离1.8km，评分4.6

notes: "后端CRUD餐厅点评应用。重点验证注册登录、列表搜索排序筛选、餐厅详情(照片/菜品/评分概览)、评价发表(含字数校验)、收藏管理、我的评价增改删(删除确认)、个人中心等功能。"
