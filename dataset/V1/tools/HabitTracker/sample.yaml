version: "2.0"
sample_id: HabitTracker
title: 习惯打卡
app_type: 工具
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个帮助用户养成好习惯的打卡追踪应用，包含以下页面与功能：

  【登录注册页】
  - 支持用户注册和登录
  - 登录成功后进入今日打卡页

  【今日打卡页（Tab1·主页）】
  - 顶部进度条：显示今日已完成/总数比例（如"3/5 完成"）
  - 全部完成后显示祝贺文字"今日全部完成！🎉"
  - 今日活跃习惯列表，未完成项排在前面
  - 每个习惯项：图标 + 名称 + 当前连续天数 + 右侧打卡按钮
  - 点击打卡按钮：标记今日完成（按钮变绿✓+完成动画），进度条同步更新
  - 同一天重复点击不重复计数（幂等）
  - 支持下拉刷新
  - 列表为空时显示空状态引导

  【习惯管理页（Tab2）】
  - "新建习惯"按钮
  - 新建/编辑表单：名称（必填）、图标（emoji选择器）、频率（每日/工作日/自定义周几）
  - 习惯列表：展示所有习惯（活跃+已归档），已归档灰色显示
  - 点击习惯进入习惯详情页
  - 归档习惯：不再出现在今日打卡列表但保留历史数据
  - 已归档习惯可恢复为活跃

  【习惯详情页】
  - 展示习惯名称、图标、频率、当前连续天数、历史打卡记录
  - 提供编辑、归档/恢复、删除入口

  【统计页（Tab3）】
  - 月度热力图：日历形式展示当月每天完成情况（全部完成深绿/部分完成浅绿/未完成灰色）
  - 连续天数排行：各习惯当前连续打卡天数排名
  - 完成率趋势：近7天每日完成率折线图
  - 总打卡次数统计

  【我的/设置页（Tab4）】
  - 展示当前登录用户信息
  - 主题切换（浅色/深色）
  - 打卡提醒设置
  - 数据导出
  - 关于应用
  - 退出登录

  底部Tab导航：今日打卡 / 习惯管理 / 统计 / 我的

core_functions:
  - 用户注册登录
  - 今日打卡列表(活跃习惯+连续天数+进度条+下拉刷新)
  - 打卡操作(变绿✓+幂等+全部完成祝贺)
  - 创建习惯(名称/图标/频率)
  - 习惯详情查看
  - 编辑和归档习惯(归档后不出现在今日页)
  - 恢复已归档习惯
  - 统计页(热力图/连续天数排行/完成率折线图/总次数)
  - 我的/设置页(用户信息/主题切换/打卡提醒/数据导出/关于/退出登录)

constraints: "打卡操作幂等（同一天同一习惯重复点击不重复计数）；数据按用户隔离（RLS）；归档的习惯不出现在今日打卡列表；连续天数从最近一次中断后开始计算"

notes: "后端CRUD样本，用户自产数据。重点验证打卡幂等性、习惯CRUD与归档恢复、连续天数计算、统计聚合、RLS权限隔离。"
