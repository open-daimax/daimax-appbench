version: "2.0"
sample_id: Tetris
title: 俄罗斯方块
app_type: 游戏
game_category: 益智类
dataset_version: "v2"
status: active

requirement: |
  实现一个功能完整的俄罗斯方块游戏应用，具备完整的"主菜单→游戏→结束→查看成绩→重新开始"闭环体验，包含主菜单、游戏、设置、排行榜等页面。

  【页面结构】
  1. 主菜单页：
     - 顶部展示游戏标题"俄罗斯方块"与装饰性方块图案
     - 四个主按钮：[开始游戏] [排行榜] [设置] [操作说明]
     - 底部显示当前最高分（首次为 0）
     - 点击[开始游戏]进入游戏页；[排行榜]进入排行榜页；[设置]进入设置页；[操作说明]弹出控制说明

  2. 游戏页面：
     - 游戏区域：10列×20行网格，方块在此下落和堆叠，网格线清晰
     - 信息栏（游戏区右侧或顶部）：下一方块预览区、当前分数、当前等级、已消除行数
     - 顶部[暂停]按钮：点击弹出暂停面板（[继续][重新开始][返回主菜单]）
     - 控制按钮区（屏幕底部一排）：[左移] [右移] [旋转] [加速下落] [硬降落]

  3. 设置页：
     - 音效开关（方块落地/消行音效）
     - 背景音乐开关
     - 起始等级选择（1-10 级，决定初始下落速度）
     - 网格辅助线显示开关
     - 返回主菜单按钮

  4. 排行榜页：
     - 标题"排行榜"
     - Top 10 历史成绩列表：每行显示"排名 | 分数 | 消除行数 | 日期"
     - 空状态：无记录时显示"暂无记录，快去挑战吧"
     - 返回主菜单按钮

  5. 游戏结束弹窗：
     - 显示"游戏结束"文字与本次得分、消除行数、达到等级
     - 若刷新最高分则显示"新纪录！"提示与高亮动画
     - 两个按钮：[重新开始] [返回主菜单]

  【游戏规则】
  - 7种标准方块（I/O/T/S/Z/L/J）随机生成，从顶部中央开始下落
  - 方块按当前等级对应速度匀速下落
  - 方块落到底部或落到其他方块上方时固定
  - 横向填满整行时该行自动消除，上方方块整体下移

  【得分规则】
  - 消除1行 = 100分 × 当前等级
  - 消除2行 = 300分 × 当前等级
  - 消除3行 = 500分 × 当前等级
  - 消除4行（Tetris）= 800分 × 当前等级
  - 硬降落每格额外 +2 分

  【等级与速度】
  - 起始等级由设置页决定，默认 1 级
  - 每累计消除10行，等级提升1级（最高10级）
  - 等级越高方块下落速度越快，右上角实时显示当前等级

  【控制方式（仅按钮，禁止手势）】
  - [左移]：方块向左移动一格
  - [右移]：方块向右移动一格
  - [旋转]：方块顺时针旋转90度（贴墙时自动踢墙调整）
  - [加速下落]：方块加速向下移动（软降）
  - [硬降落]：方块立即落到最底部并固定

  【视觉与音效反馈】
  - 7种方块使用不同颜色，方块有描边
  - 消行时该行高亮闪烁后消失，伴随消行音效
  - 4行同时消除（Tetris）时有特殊闪光动画与音效
  - 方块落地有轻微落地音效
  - 升级时右上角等级数字有放大动画
  - 音效/背景音乐受设置页开关控制

  【数据持久化】
  - 最高分与 Top 10 排行榜使用 localStorage 本地持久化
  - 设置项（音效/音乐/起始等级/辅助线）本地持久化
  - 游戏结束时若成绩进入前10名则写入排行榜

  【游戏结束条件】
  - 新方块生成时顶部空间已被占据，无法放置，游戏结束

core_functions:
  - 10×20 游戏网格渲染与方块显示
  - 7种标准方块(I/O/T/S/Z/L/J)随机生成
  - 下一方块预览显示
  - 按钮控制：左移、右移、旋转、加速下落、硬降落
  - 方块碰撞检测（边界与已固定方块）
  - 旋转踢墙调整
  - 方块落底固定与满行消除
  - 得分计算（含等级倍率与硬降落加分）
  - 等级系统（每10行升1级，共10级）
  - 下落速度随等级递增
  - 暂停面板（继续/重新开始/返回主菜单）
  - 游戏结束判定（顶部堆满）
  - 主菜单导航（开始/排行榜/设置/操作说明）
  - 设置页（音效/音乐/起始等级/辅助线）
  - 排行榜Top10记录与展示
  - 音效与动画反馈（消行/升级/落地）
  - 最高分与排行榜本地持久化(localStorage)

constraints:
  - 纯单机游戏，无需网络
  - 无需用户登录
  - 仅使用按钮控制，禁止滑动/拖拽/手势操作
  - 最高分与排行榜使用localStorage本地持久化
  - 标准7种方块形状完整实现
  - 游戏区域固定为10列×20行

notes: "V2版本：扩展为完整游戏应用，新增设置页、排行榜页、暂停面板与音效动画反馈，得分含等级倍率。重点验证按钮控制响应、消行得分计算、等级速度递增、排行榜与最高分持久化。"
