version: "1.0"
sample_id: StockApp
title: 股票行情
app_type: 金融
dataset_version: "v1"
status: deprecated
deprecated_reason: "依赖实时外部API，无法独立评测"
requires_backend: true
requires_auth: true

requirement: |
  实现一个股票行情查询应用：
  1. 首页展示市场概况：沪指、深指、创业板指数涨跌幅
  2. 自选股列表：显示用户关注的股票，含股票名称、代码、现价、涨跌幅
  3. 股票详情页：K线图（日K/周K/月K切换）、实时价格、成交量、开盘价、昨收、最高最低
  4. 分时图：显示当日股票价格走势折线图
  5. 个股搜索：按名称或代码搜索股票
  6. 我的页面：展示用户个人信息、自选股数量统计、功能菜单（我的自选、浏览历史、设置、关于）、退出登录按钮。登录/注册成功后自动跳转到我的页面
  7. 添加自选：在详情页将股票加入自选股列表
  8. 行情排行：涨幅榜、跌幅榜、成交量榜
  9. 资讯新闻：显示与个股相关的最新新闻

core_functions:
  - 市场指数实时展示
  - 自选股列表管理
  - K线图(日/周/月)渲染
  - 分时走势图
  - 股票搜索
  - 我的页面与个人中心
  - 自选股添加/删除
  - 涨跌幅/成交量排行榜
  - 个股相关新闻

constraints:
  - 需要使用真实的后端服务
  - 需要用户登录注册功能

notes: "测试金融数据可视化:K线图渲染、实时数据展示、排行榜数据加载。重点验证K线图的日/周/月切换和数据展示的准确性。验证我的页面个人信息展示、自选股数量统计、退出登录功能，以及登录成功后自动跳转到我的页面。"
