version: "2.0"
sample_id: CookingDiary
title: 烹饪日记
app_type: 生活
dataset_version: "v2"
data_mode: "backend_crud"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的烹饪日记应用，帮助用户记录、管理与回顾每次做菜的过程和心得：

  【底部Tab导航】
  登录后应用底部固定3个Tab：日记、统计、我的，点击可在三个主页面间切换，当前Tab高亮。

  【登录注册页】
  1. 支持用户注册和登录
  2. 登录后跳转日记列表页

  【日记列表页(主页Tab)】
  3. 按时间倒序展示我的烹饪日记列表
  4. 每条日记卡片显示：菜品名称、封面图(占位符)、评分(1-5星)、日期
  5. 顶部搜索框：按菜品名称关键词搜索日记
  6. 支持按评分筛选（全部/5星/4星/3星及以下）
  7. 底部浮动"+"按钮：新建日记
  8. 下拉刷新加载

  【新建日记页】
  9. 菜品名称输入框（必填）
  11. 评分选择：1-5颗星点击选择
  12. 烹饪时长输入（分钟）
  13. 难度选择：简单/中等/困难
  14. 烹饪步骤记录：
      - 每步有文字描述输入框
      - "添加步骤"按钮可增加多步
      - 至少需要1步
  15. 心得笔记：多行文本输入（如"火候要小一些""下次少放盐"）
  16. 保存按钮 → 保存成功 → 返回列表

  【日记详情页】
  17. 顶部菜品名称+封面图
  18. 评分星星+难度标签+烹饪时长
  19. 步骤列表：有序号展示各步骤描述
  20. 心得笔记区域
  21. 编辑按钮 → 进入编辑模式
  22. 删除按钮 → 确认弹窗 → 删除后返回列表

  【统计页(Tab)】
  23. 累计做菜次数
  24. 本月做菜次数
  25. 平均评分
  26. 最常做的菜品Top3（按名称统计）
  27. 评分分布（各星级日记数量）

  【我的页(Tab)】
  28. 展示当前登录用户账号信息
  29. 展示日记总数等简单概览
  30. 退出登录按钮（带二次确认）
  31. 关于应用信息

core_functions:
  - 用户注册登录
  - 底部Tab导航(日记/统计/我的)
  - 日记列表展示(时间倒序+封面图+评分+日期)
  - 新建日记(名称/封面图/评分/时长/难度/步骤/心得)
  - 查看日记详情(步骤列表+心得)
  - 编辑和删除日记
  - 按菜名搜索日记
  - 按评分筛选(全部/5星/4星/3星及以下)
  - 统计页(累计次数/本月次数/平均评分/Top3菜品/评分分布)
  - 我的页(账号信息/概览/退出登录)


notes: "后端CRUD样本，用户自产数据。重点验证登录注册、底部Tab导航、日记CRUD完整性、多步骤记录、搜索与评分筛选逻辑、统计聚合、我的页与RLS权限隔离。"
