version: "2.0"
sample_id: Forum
title: 社区论坛
app_type: 社交
dataset_version: "v1"
status: deprecated
deprecated_reason: "确定拦截"
requires_backend: true
requires_auth: true

requirement: |
  实现一个功能完整的社区论坛应用，采用底部Tab导航（首页/发帖/我的），包含以下核心页面与能力：

  【登录注册页】
  - 支持用户注册和登录
  - 注册成功后自动登录并进入首页
  - 提供登录/注册切换入口

  【页面1：板块/频道列表（首页）】
  - 系统预置多个板块（如：技术交流、生活分享、游戏讨论、影视推荐、美食天地）
  - 每个板块显示：板块名称+图标+帖子数+关注人数
  - 顶部提供全站搜索入口
  - 点击板块进入对应的帖子列表

  【页面2：帖子列表页】
  - 展示当前板块内的帖子，每条显示：标题+作者+回复数+发布时间+标签
  - 系统为每个板块预置若干示例帖子
  - 提供排序切换：最新（按发布时间倒序）/ 最热（按回复数或热度倒序）
  - 提供标签筛选：点击标签仅展示带该标签的帖子
  - 提供发帖入口

  【页面3：帖子详情页】
  - 顶部显示帖子标题+正文+作者信息+发布时间+标签
  - 回复列表按楼层顺序展示（1楼、2楼...），每条显示楼层号+作者+内容+时间
  - 楼中楼：点击某楼层的回复按钮→输入回复→发送→在该楼层下方缩进显示
  - 底部回复输入框：发送文字回复（新增楼层）
  - 提供收藏/取消收藏该帖子的入口

  【页面4：发帖页】
  - 选择所属板块
  - 输入帖子标题（必填）与正文内容
  - 选择或输入标签（可选）
  - 点击发布→帖子出现在对应板块帖子列表顶部

  【页面5：搜索页】
  - 输入关键词搜索帖子（按标题/内容匹配）
  - 展示搜索结果列表，点击进入帖子详情

  【页面6：个人中心（我的）】
  - 展示用户信息
  - 我的帖子：当前用户发布的帖子列表（支持长按或通过菜单删除自己发布的帖子）
  - 我的回复：当前用户发出的回复列表
  - 我的收藏：当前用户收藏的帖子列表
  - 提供退出登录入口

constraints: "系统预置多个板块及每个板块若干示例帖子；帖子列表支持最新/最热排序与标签筛选；仅帖子/回复作者可编辑或删除自己的内容"

notes: "后端CRUD样本，用户自己发帖、回复、收藏。重点验证楼层回复与楼中楼嵌套、排序/搜索/标签筛选以及个人中心聚合展示。"
