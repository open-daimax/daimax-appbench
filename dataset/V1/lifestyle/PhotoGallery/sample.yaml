version: "2.0"
sample_id: PhotoGallery
title: 图片画廊
app_type: 生活
dataset_version: "v2"
data_mode: "frontend_local"

requirement: |
  实现一个功能完整的图片画廊应用，提供照片浏览、相册管理、收藏、幻灯片播放、搜索与个性化设置的完整体验。

  【底部Tab导航】
  应用底部固定4个Tab：画廊、相册、收藏、我的，点击可在四个主页面间切换，当前Tab高亮。

  【画廊页（首页Tab）】
  1. 顶部标题栏，右上角有搜索图标和幻灯片播放图标
  2. 分类筛选栏（横向滚动）：全部/风景/建筑/美食/人物/动物，默认选中「全部」
  3. 瀑布流布局展示全部20张预置图片（每行2-3列自适应），图片以缩略图显示
  4. 支持排序切换：默认顺序 / 按标题排序
  5. 点击任意图片进入图片详情页
  6. 下拉刷新重新加载图片列表

  【相册页（Tab）】
  7. 以相册封面网格展示5个分类相册（风景/建筑/美食/人物/动物）
  8. 每个相册封面显示：分类名称、代表封面缩略图、该相册照片数量
  9. 点击某相册进入该分类的图片网格列表，可点击图片进入详情

  【图片详情页】
  10. 顶部返回按钮，顶部大图展示（gallery尺寸）
  11. 图片信息区：标题、分类标签、拍摄地点、描述文字
  12. 收藏按钮：点击切换收藏/取消收藏，按钮状态高亮变化
  13. 底部上一张/下一张导航按钮，切换后大图与所有信息同步更新

  【幻灯片模式】
  14. 全屏大图轮播，自动播放（3秒/张）
  15. 显示当前图片序号/总数
  16. 暂停/继续按钮控制自动播放
  17. 手动上一张/下一张控制

  【搜索页】
  18. 顶部搜索输入框，支持按标题或分类关键词搜索
  19. 实时过滤显示匹配结果（网格展示）
  20. 无匹配时显示空状态提示
  21. 点击搜索结果进入图片详情

  【收藏页（Tab）】
  22. 网格展示已收藏图片，顶部显示收藏总数
  23. 点击收藏项进入图片详情
  24. 无收藏时显示友好的空状态提示与引导文案

  【我的/设置页（Tab）】
  25. 顶部展示收藏数量、总图片数等简单统计
  26. 设置项：瀑布流列数切换（2列/3列）、主题切换（浅色/深色）
  27. 清空收藏按钮（带二次确认弹窗）
  28. 关于应用信息（版本号、简介）

core_functions:
  - 底部Tab导航(画廊/相册/收藏/我的)
  - 图片瀑布流布局(20张预置图片，2-3列自适应)
  - 分类筛选(风景/建筑/美食/人物/动物)与排序(默认/按标题)
  - 相册页分类相册封面网格与相册内图片列表
  - 图片详情查看(大图/标题/分类/地点/描述)
  - 图片导航(上一张/下一张)
  - 收藏与取消收藏(localStorage持久化)
  - 收藏页网格展示、收藏总数与空状态
  - 幻灯片自动轮播(3秒间隔，暂停/继续，手动切换，序号显示)
  - 图片搜索(按标题和分类本地过滤)与无结果空状态
  - 我的/设置页(统计/列数切换/主题切换/清空收藏/关于)

constraints: |
  纯前端应用，不依赖后端服务。
  图片元数据硬编码(20张)，每张有标题、分类、拍摄地点、描述。
  收藏存localStorage。
  幻灯片自动播放间隔3秒。
  搜索为前端本地过滤，匹配标题和分类。
  瀑布流布局每行2-3列自适应。
  内置数据（20张图片，5个分类各4张）：
  - 风景类：山间日出、海边落日、森林小径、高山湖泊
  - 建筑类：古城墙、现代摩天楼、日式庭院、欧式教堂
  - 美食类：日式拉面、法式甜点、中式火锅、意大利披萨
  - 人物类：街头艺人、晨跑少年、读书老人、舞蹈演员
  - 动物类：草原雄狮、海底珊瑚鱼、森林松鼠、极地企鹅

notes: "纯前端图片画廊应用。重点验证底部Tab导航、瀑布流布局、分类筛选与排序、相册页、图片详情与导航、收藏交互与持久化、幻灯片自动轮播控制、搜索过滤、设置页与空状态等核心功能。"
